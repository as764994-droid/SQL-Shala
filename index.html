"difficulty":"Medium","title":"Show orders and replace NULL ShipAddress with 'Address Pending'","prompt":"Show orders and replace NULL ShipAddress with 'Address Pending'.","tables":["Orders"],"solutionSql":"SELECT OrderID, CustomerID,\n       IFNULL(ShipAddress, 'Address Pending') AS ShipAddress,\n       IFNULL(BillAddress, 'Address Pending') AS BillAddress\nFROM Orders","starterSql":"","id":"isnull-07"},{"topic":"isnull","difficulty":"Hard","title":"Calculate total sales per customer, treating NULL Score as 0 in a weighted formula","prompt":"Calculate total sales per customer, treating NULL Score as 0 in a weighted formula.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, (COALESCE(c.FirstName, '') || ' ' || COALESCE(IFNULL(c.LastName,''), '')) AS CustomerName,\n       IFNULL(c.Score, 0) AS Score,\n       SUM(o.Sales)       AS TotalSales,\n       SUM(o.Sales) * (IFNULL(c.Score, 0) / 1000.0) AS WeightedRevenue\nFROM Customers c\nJOIN Orders o ON c.CustomerID = o.CustomerID\nGROUP BY c.CustomerID, c.FirstName, c.LastName, c.Score\nORDER BY WeightedRevenue DESC","starterSql":"","id":"isnull-08"},{"topic":"isnull","difficulty":"Hard","title":"For each employee, use ISNULL to display the manager's EmployeeID and substitute 'Self-Man","prompt":"For each employee, use ISNULL to display the manager's EmployeeID and substitute 'Self-Managed' for top-level employees.","tables":["Employees"],"solutionSql":"SELECT e.EmployeeID, e.FirstName,\n       IFNULL(CAST(e.ManagerID AS TEXT), 'Self-Managed') AS ManagerDisplay,\n       IFNULL(m.FirstName || ' ' || IFNULL(m.LastName,''), 'No Manager') AS ManagerName\nFROM Employees e\nLEFT JOIN Employees m ON e.ManagerID = m.EmployeeID","starterSql":"","id":"isnull-09"},{"topic":"isnull","difficulty":"Hard","title":"Combine ISNULL with aggregation: find the total score of customers, counting NULLs as 0","prompt":"Combine ISNULL with aggregation: find the total score of customers, counting NULLs as 0.","tables":["Customers"],"solutionSql":"SELECT Country,\n       COUNT(*)             AS TotalCustomers,\n       SUM(IFNULL(Score,0)) AS TotalScore,\n       AVG(IFNULL(Score,0)) AS AvgScoreInclNull\nFROM Customers\nGROUP BY Country\nORDER BY TotalScore DESC","starterSql":"","id":"isnull-10"},{"topic":"isnull","difficulty":"Hard","title":"Flag orders where both ShipAddress and BillAddress are NULL, using ISNULL to build a statu","prompt":"Flag orders where both ShipAddress and BillAddress are NULL, using ISNULL to build a status column.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       IFNULL(ShipAddress, 'MISSING') AS ShipAddr,\n       IFNULL(BillAddress, 'MISSING') AS BillAddr,\n       CASE\n           WHEN ShipAddress IS NULL AND BillAddress IS NULL THEN 'Both Missing'\n           WHEN ShipAddress IS NULL THEN 'Ship Missing'\n           WHEN BillAddress IS NULL THEN 'Bill Missing'\n           ELSE 'Complete'\n       END AS AddressStatus\nFROM Orders","starterSql":"","id":"isnull-11"},{"topic":"nullif","difficulty":"Easy","title":"Use NULLIF to return NULL when Quantity equals 0 (avoiding zero in calculations)","prompt":"Use NULLIF to return NULL when Quantity equals 0 (avoiding zero in calculations).","tables":["Orders"],"solutionSql":"SELECT OrderID, Quantity,\n       NULLIF(Quantity, 0) AS SafeQuantity\nFROM Orders","starterSql":"","id":"nullif-02"},{"topic":"nullif","difficulty":"Easy","title":"Use NULLIF to treat 'Unknown' country as NULL for customers","prompt":"Use NULLIF to treat 'Unknown' country as NULL for customers.","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName,\n       NULLIF(Country, 'Unknown') AS Country\nFROM Customers","starterSql":"","id":"nullif-03"},{"topic":"nullif","difficulty":"Medium","title":"Use NULLIF to safely calculate price per unit sold (avoid divide-by-zero)","prompt":"Use NULLIF to safely calculate price per unit sold (avoid divide-by-zero).","tables":["Orders"],"solutionSql":"SELECT o.OrderID, o.Sales,\n       NULLIF(o.Quantity, 0)           AS SafeQty,\n       o.Sales / NULLIF(o.Quantity, 0) AS PricePerUnit\nFROM Orders o","starterSql":"","id":"nullif-04"},{"topic":"nullif","difficulty":"Medium","title":"Show employees where NULLIF returns NULL when Salary equals 55000","prompt":"Show employees where NULLIF returns NULL when Salary equals 55000.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, Salary,\n       NULLIF(Salary, 55000) AS AdjustedSalary\nFROM Employees","starterSql":"","id":"nullif-05"},{"topic":"nullif","difficulty":"Medium","title":"Use NULLIF with ISNULL together: replace NULL (from NULLIF) with a default value","prompt":"Use NULLIF with ISNULL together: replace NULL (from NULLIF) with a default value.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       IFNULL(NULLIF(Quantity, 0), -1) AS FinalQuantity\nFROM Orders","starterSql":"","id":"nullif-06"},{"topic":"nullif","difficulty":"Medium","title":"Detect rows where ShipAddress equals BillAddress using NULLIF","prompt":"Detect rows where ShipAddress equals BillAddress using NULLIF.","tables":["Orders"],"solutionSql":"SELECT OrderID, ShipAddress, BillAddress,\n       NULLIF(ShipAddress, BillAddress) AS DiffShipAddr\nFROM Orders","starterSql":"","id":"nullif-07"},{"topic":"nullif","difficulty":"Hard","title":"Use NULLIF in a calculation: compute the sales-to-quantity ratio, treating 0-quantity orde","prompt":"Use NULLIF in a calculation: compute the sales-to-quantity ratio, treating 0-quantity orders as NULL to exclude from AVG.","tables":["Orders"],"solutionSql":"SELECT AVG(CAST(Sales AS FLOAT) / NULLIF(Quantity, 0)) AS AvgUnitPrice\nFROM Orders","starterSql":"","id":"nullif-08"},{"topic":"nullif","difficulty":"Hard","title":"Use NULLIF to compare first and last name of customers and employees: return NULL when the","prompt":"Use NULLIF to compare first and last name of customers and employees: return NULL when they share the same FirstName.","tables":["Customers","Employees"],"solutionSql":"SELECT c.CustomerID, c.FirstName AS CustFirstName,\n       e.EmployeeID, e.FirstName AS EmpFirstName,\n       NULLIF(c.FirstName, e.FirstName) AS DifferentFirstName\nFROM Customers c\nJOIN Employees e ON c.CustomerID = e.EmployeeID","starterSql":"","id":"nullif-09"},{"topic":"nullif","difficulty":"Hard","title":"Find the average score of customers, treating a score of 0 as NULL (excluded from AVG)","prompt":"Find the average score of customers, treating a score of 0 as NULL (excluded from AVG).","tables":["Customers"],"solutionSql":"SELECT AVG(CAST(NULLIF(Score, 0) AS FLOAT)) AS AvgScoreExclZero,\n       AVG(CAST(Score AS FLOAT))            AS AvgScoreInclNull\nFROM Customers","starterSql":"","id":"nullif-10"},{"topic":"nullif","difficulty":"Hard","title":"Use NULLIF in a CASE to categorize employees: if salary equals the department minimum, fla","prompt":"Use NULLIF in a CASE to categorize employees: if salary equals the department minimum, flag as 'At Minimum'.","tables":["Employees"],"solutionSql":"SELECT e.EmployeeID, e.FirstName, e.Department, e.Salary,\n       CASE\n           WHEN NULLIF(e.Salary, MIN(e2.Salary) OVER (PARTITION BY e.Department)) IS NULL\n               THEN 'At Minimum'\n           ELSE 'Above Minimum'\n       END AS SalaryStatus\nFROM Employees e\nJOIN Employees e2 ON e.Department = e2.Department\nGROUP BY e.EmployeeID, e.FirstName, e.Department, e.Salary;\n-- Simpler equivalent using window function:\nSELECT EmployeeID, FirstName, Department, Salary,\n       CASE\n           WHEN NULLIF(Salary, MIN(Salary) OVER (PARTITION BY Department)) IS NULL\n               THEN 'At Minimum'\n           ELSE 'Above Minimum'\n       END AS SalaryStatus\nFROM Employees","starterSql":"","id":"nullif-11"},{"topic":"coalesce","difficulty":"Easy","title":"Return the first non-NULL address (ShipAddress, then BillAddress) per order","prompt":"Return the first non-NULL address (ShipAddress, then BillAddress) per order.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       COALESCE(ShipAddress, BillAddress, 'No Address') AS PrimaryAddress\nFROM Orders","starterSql":"","id":"coalesce-02"},{"topic":"coalesce","difficulty":"Easy","title":"Display each customer's LastName, substituting 'N/A' if NULL","prompt":"Display each customer's LastName, substituting 'N/A' if NULL.","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName,\n       COALESCE(LastName, 'N/A') AS LastName\nFROM Customers","starterSql":"","id":"coalesce-03"},{"topic":"coalesce","difficulty":"Medium","title":"For each employee, display Score from Customers if they share an ID, otherwise show 0","prompt":"For each employee, display Score from Customers if they share an ID, otherwise show 0.","tables":["Customers","Employees"],"solutionSql":"SELECT e.EmployeeID, e.FirstName,\n       COALESCE(c.Score, 0) AS CustomerScore\nFROM Employees e\nLEFT JOIN Customers c ON e.EmployeeID = c.CustomerID","starterSql":"","id":"coalesce-04"},{"topic":"coalesce","difficulty":"Medium","title":"Build a full name using COALESCE to handle NULL last names gracefully","prompt":"Build a full name using COALESCE to handle NULL last names gracefully.","tables":["Customers"],"solutionSql":"SELECT CustomerID,\n       COALESCE(FirstName || ' ' || LastName, FirstName, 'Unnamed') AS FullName\nFROM Customers","starterSql":"","id":"coalesce-05"},{"topic":"coalesce","difficulty":"Medium","title":"Use COALESCE to pick the first available contact field: ShipAddress, BillAddress, or 'Cont","prompt":"Use COALESCE to pick the first available contact field: ShipAddress, BillAddress, or 'Contact Not Available'.","tables":["Orders"],"solutionSql":"SELECT OrderID, CustomerID,\n       COALESCE(ShipAddress, BillAddress, 'Contact Not Available') AS ContactAddress\nFROM Orders\nORDER BY OrderID","starterSql":"","id":"coalesce-06"},{"topic":"coalesce","difficulty":"Medium","title":"Replace NULL ManagerID with 0 using COALESCE, then label as CEO or Staff","prompt":"Replace NULL ManagerID with 0 using COALESCE, then label as CEO or Staff.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName,\n       COALESCE(ManagerID, 0) AS ManagerID,\n       CASE WHEN ManagerID IS NULL THEN 'Top-Level' ELSE 'Staff' END AS Role\nFROM Employees","starterSql":"","id":"coalesce-07"},{"topic":"coalesce","difficulty":"Hard","title":"Use COALESCE to compute a fallback unit price: use Sales/Quantity if Quantity > 0, else us","prompt":"Use COALESCE to compute a fallback unit price: use Sales/Quantity if Quantity > 0, else use the product's listed Price.","tables":["Products","Orders"],"solutionSql":"SELECT o.OrderID, o.Sales, o.Quantity, p.Price,\n       COALESCE(\n           CASE WHEN o.Quantity > 0 THEN CAST(o.Sales AS FLOAT) / o.Quantity ELSE NULL END,\n           p.Price\n       ) AS EffectiveUnitPrice\nFROM Orders o\nJOIN Products p ON o.ProductID = p.ProductID","starterSql":"","id":"coalesce-08"},{"topic":"coalesce","difficulty":"Hard","title":"Use COALESCE across three columns to build a priority address chain and count how many ord","prompt":"Use COALESCE across three columns to build a priority address chain and count how many orders need each fallback level.","tables":["Orders"],"solutionSql":"SELECT\n    SUM(CASE WHEN ShipAddress IS NOT NULL THEN 1 ELSE 0 END) AS UsedShipAddress,\n    SUM(CASE WHEN ShipAddress IS NULL AND BillAddress IS NOT NULL THEN 1 ELSE 0 END) AS UsedBillFallback,\n    SUM(CASE WHEN ShipAddress IS NULL AND BillAddress IS NULL THEN 1 ELSE 0 END) AS NoAddress\nFROM Orders","starterSql":"","id":"coalesce-09"},{"topic":"coalesce","difficulty":"Hard","title":"Use COALESCE with aggregation to get each customer's score, substituting the country avera","prompt":"Use COALESCE with aggregation to get each customer's score, substituting the country average when score is NULL.","tables":["Customers"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.Country, c.Score,\n       COALESCE(c.Score, AVG(c2.Score)) AS EffectiveScore\nFROM Customers c\nJOIN Customers c2 ON c.Country = c2.Country AND c2.Score IS NOT NULL\nGROUP BY c.CustomerID, c.FirstName, c.Country, c.Score","starterSql":"","id":"coalesce-10"},{"topic":"coalesce","difficulty":"Hard","title":"Multi-column COALESCE: for each order, build a complete audit string using whichever addre","prompt":"Multi-column COALESCE: for each order, build a complete audit string using whichever address columns are available.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       'Ship: ' || COALESCE(ShipAddress,'N/A')\n       || ' | Bill: ' || COALESCE(BillAddress,'N/A') AS AddressAudit\nFROM Orders","starterSql":"","id":"coalesce-11"},{"topic":"is-null","difficulty":"Easy","title":"Find all customers who have a NULL LastName","prompt":"Find all customers who have a NULL LastName.","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName, LastName\nFROM Customers\nWHERE LastName IS NULL","starterSql":"","id":"is-null-02"},{"topic":"is-null","difficulty":"Easy","title":"Find all customers who have a non-NULL Score","prompt":"Find all customers who have a non-NULL Score.","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName, Score\nFROM Customers\nWHERE Score IS NOT NULL","starterSql":"","id":"is-null-03"},{"topic":"is-null","difficulty":"Medium","title":"Find employees who have no manager assigned (top-level employees)","prompt":"Find employees who have no manager assigned (top-level employees).","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, LastName, Department\nFROM Employees\nWHERE ManagerID IS NULL","starterSql":"","id":"is-null-04"},{"topic":"is-null","difficulty":"Medium","title":"Find orders where BillAddress IS NULL (billing not captured)","prompt":"Find orders where BillAddress IS NULL (billing not captured).","tables":["Orders"],"solutionSql":"SELECT OrderID, CustomerID, OrderDate, ShipAddress, BillAddress\nFROM Orders\nWHERE BillAddress IS NULL","starterSql":"","id":"is-null-05"},{"topic":"is-null","difficulty":"Medium","title":"Count how many customers have NULL vs non-NULL Score","prompt":"Count how many customers have NULL vs non-NULL Score.","tables":["Customers"],"solutionSql":"SELECT\n    SUM(CASE WHEN Score IS NULL THEN 1 ELSE 0 END)     AS NullScoreCount,\n    SUM(CASE WHEN Score IS NOT NULL THEN 1 ELSE 0 END)  AS HasScoreCount\nFROM Customers","starterSql":"","id":"is-null-06"},{"topic":"is-null","difficulty":"Medium","title":"List employees whose LastName IS NOT NULL","prompt":"List employees whose LastName IS NOT NULL.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, LastName, Department\nFROM Employees\nWHERE LastName IS NOT NULL","starterSql":"","id":"is-null-07"},{"topic":"is-null","difficulty":"Hard","title":"Find orders where either ShipAddress OR BillAddress is NULL and classify the missing-data ","prompt":"Find orders where either ShipAddress OR BillAddress is NULL and classify the missing-data severity.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       CASE\n           WHEN ShipAddress IS NULL AND BillAddress IS NULL THEN 'Critical - Both Missing'\n           WHEN ShipAddress IS NULL THEN 'Warning - Ship Missing'\n           WHEN BillAddress IS NULL THEN 'Info - Bill Missing'\n           ELSE 'OK'\n       END AS DataQuality\nFROM Orders\nWHERE ShipAddress IS NULL OR BillAddress IS NULL\nORDER BY DataQuality","starterSql":"","id":"is-null-08"},{"topic":"is-null","difficulty":"Hard","title":"Find customers who have placed orders but have NULL Score (missed scoring opportunity)","prompt":"Find customers who have placed orders but have NULL Score (missed scoring opportunity).","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.Score,\n       COUNT(o.OrderID)  AS OrderCount,\n       SUM(o.Sales)      AS TotalSales\nFROM Customers c\nJOIN Orders o ON c.CustomerID = o.CustomerID\nWHERE c.Score IS NULL\nGROUP BY c.CustomerID, c.FirstName, c.Score","starterSql":"","id":"is-null-09"},{"topic":"is-null","difficulty":"Hard","title":"Produce a data-completeness report for the Employees table","prompt":"Produce a data-completeness report for the Employees table.","tables":["Employees"],"solutionSql":"SELECT\n    COUNT(*)                                                  AS TotalEmployees,\n    SUM(CASE WHEN LastName   IS NULL THEN 1 ELSE 0 END)      AS MissingLastName,\n    SUM(CASE WHEN ManagerID  IS NULL THEN 1 ELSE 0 END)      AS MissingManager,\n    SUM(CASE WHEN BirthDate  IS NULL THEN 1 ELSE 0 END)      AS MissingBirthDate,\n    SUM(CASE WHEN Salary     IS NULL THEN 1 ELSE 0 END)      AS MissingSalary\nFROM Employees","starterSql":"","id":"is-null-10"},{"topic":"is-null","difficulty":"Hard","title":"Rank customers by Score but place NULL scores at the bottom","prompt":"Rank customers by Score but place NULL scores at the bottom.","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName, Score,\n       ROW_NUMBER() OVER (\n           ORDER BY CASE WHEN Score IS NULL THEN 1 ELSE 0 END, Score DESC\n       ) AS ScoreRank\nFROM Customers","starterSql":"","id":"is-null-11"},{"topic":"case-when-null","difficulty":"Easy","title":"Label each order as 'Delivered' or 'Not Yet Delivered'","prompt":"Label each order as 'Delivered' or 'Not Yet Delivered'.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderStatus,\n       CASE WHEN OrderStatus = 'Delivered' THEN 'Delivered'\n            ELSE 'Not Yet Delivered'\n       END AS DeliveryLabel\nFROM Orders","starterSql":"","id":"case-when-null-02"},{"topic":"case-when-null","difficulty":"Easy","title":"Categorize customer Score: High (>=750), Medium (500-749), Low (<500)","prompt":"Categorize customer Score: High (>=750), Medium (500-749), Low (<500).","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName, Score,\n       CASE\n           WHEN Score >= 750 THEN 'High'\n           WHEN Score >= 500 THEN 'Medium'\n           WHEN Score IS NULL THEN 'Unscored'\n           ELSE 'Low'\n       END AS ScoreCategory\nFROM Customers","starterSql":"","id":"case-when-null-03"},{"topic":"case-when-null","difficulty":"Medium","title":"Assign a salary band label to each employee","prompt":"Assign a salary band label to each employee.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, Salary,\n       CASE\n           WHEN Salary >= 90000 THEN 'Band A (Senior)'\n           WHEN Salary >= 70000 THEN 'Band B (Mid-Senior)'\n           WHEN Salary >= 60000 THEN 'Band C (Mid)'\n           ELSE 'Band D (Junior)'\n       END AS SalaryBand\nFROM Employees","starterSql":"","id":"case-when-null-04"},{"topic":"case-when-null","difficulty":"Medium","title":"Classify orders by Sales amount: Small (<20), Medium (20-49), Large (>=50)","prompt":"Classify orders by Sales amount: Small (<20), Medium (20-49), Large (>=50).","tables":["Orders"],"solutionSql":"SELECT OrderID, Sales,\n       CASE\n           WHEN Sales < 20  THEN 'Small'\n           WHEN Sales < 50  THEN 'Medium'\n           ELSE 'Large'\n       END AS OrderSize\nFROM Orders\nORDER BY Sales","starterSql":"","id":"case-when-null-05"},{"topic":"case-when-null","difficulty":"Medium","title":"Use CASE WHEN to pivot: count orders per status in one row","prompt":"Use CASE WHEN to pivot: count orders per status in one row.","tables":["Orders"],"solutionSql":"SELECT\n    SUM(CASE WHEN OrderStatus = 'Delivered' THEN 1 ELSE 0 END) AS Delivered,\n    SUM(CASE WHEN OrderStatus = 'Shipped'   THEN 1 ELSE 0 END) AS Shipped,\n    SUM(CASE WHEN OrderStatus = 'Pending'   THEN 1 ELSE 0 END) AS Pending\nFROM Orders","starterSql":"","id":"case-when-null-06"},{"topic":"case-when-null","difficulty":"Medium","title":"Flag employees who earn above their department's average salary","prompt":"Flag employees who earn above their department's average salary.","tables":["Employees"],"solutionSql":"SELECT e.EmployeeID, e.FirstName, e.Department, e.Salary,\n       CASE\n           WHEN e.Salary > AVG(e2.Salary) THEN 'Above Average'\n           WHEN e.Salary = AVG(e2.Salary) THEN 'At Average'\n           ELSE 'Below Average'\n       END AS SalaryVsAvg\nFROM Employees e\nJOIN Employees e2 ON e.Department = e2.Department\nGROUP BY e.EmployeeID, e.FirstName, e.Department, e.Salary","starterSql":"","id":"case-when-null-07"},{"topic":"case-when-null","difficulty":"Hard","title":"Use nested CASE WHEN to generate a combined customer tier and country label","prompt":"Use nested CASE WHEN to generate a combined customer tier and country label.","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName, Country, Score,\n       CASE\n           WHEN Country = 'USA' THEN\n               CASE\n                   WHEN Score >= 750 THEN 'US-Platinum'\n                   WHEN Score >= 500 THEN 'US-Gold'\n                   WHEN Score IS NULL THEN 'US-Unscored'\n                   ELSE 'US-Standard'\n               END\n           WHEN Country = 'Germany' THEN\n               CASE\n                   WHEN Score >= 500 THEN 'DE-Gold'\n                   ELSE 'DE-Standard'\n               END\n           ELSE 'Other'\n       END AS CustomerTier\nFROM Customers","starterSql":"","id":"case-when-null-08"},{"topic":"case-when-null","difficulty":"Hard","title":"Use CASE WHEN in ORDER BY to sort: Delivered first, then Shipped, then others","prompt":"Use CASE WHEN in ORDER BY to sort: Delivered first, then Shipped, then others.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderStatus, OrderDate, Sales\nFROM Orders\nORDER BY\n    CASE OrderStatus\n        WHEN 'Delivered' THEN 1\n        WHEN 'Shipped'   THEN 2\n        ELSE 3\n    END,\n    OrderDate","starterSql":"","id":"case-when-null-09"},{"topic":"case-when-null","difficulty":"Hard","title":"Compute a dynamic discount rate using CASE WHEN based on quantity and sales","prompt":"Compute a dynamic discount rate using CASE WHEN based on quantity and sales.","tables":["Orders"],"solutionSql":"SELECT OrderID, Sales, Quantity,\n       CASE\n           WHEN Quantity >= 3 AND Sales >= 80 THEN 0.15\n           WHEN Quantity >= 2 AND Sales >= 50 THEN 0.10\n           WHEN Quantity >= 2                 THEN 0.05\n           ELSE 0.00\n       END AS DiscountRate,\n       Sales * (1 - CASE\n           WHEN Quantity >= 3 AND Sales >= 80 THEN 0.15\n           WHEN Quantity >= 2 AND Sales >= 50 THEN 0.10\n           WHEN Quantity >= 2                 THEN 0.05\n           ELSE 0.00\n       END) AS DiscountedSales\nFROM Orders","starterSql":"","id":"case-when-null-10"},{"topic":"case-when-null","difficulty":"Hard","title":"Use CASE WHEN to build a comprehensive order health report combining status, address compl","prompt":"Use CASE WHEN to build a comprehensive order health report combining status, address completeness, and quantity checks.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderStatus, Quantity, ShipAddress, BillAddress,\n       CASE\n           WHEN OrderStatus = 'Delivered' AND ShipAddress IS NOT NULL THEN 'Healthy'\n           WHEN OrderStatus = 'Shipped'   AND ShipAddress IS NOT NULL THEN 'In Transit'\n           WHEN Quantity = 0 THEN 'Zero Qty - Investigate'\n           WHEN ShipAddress IS NULL AND BillAddress IS NULL THEN 'No Address - Blocked'\n           ELSE 'Needs Review'\n       END AS OrderHealth\nFROM Orders","starterSql":"","id":"case-when-null-11"},{"topic":"case-statement","difficulty":"Easy","title":"Translate OrderStatus codes to descriptive labels using simple CASE","prompt":"Translate OrderStatus codes to descriptive labels using simple CASE.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       CASE OrderStatus\n           WHEN 'Delivered' THEN 'Order Complete'\n           WHEN 'Shipped'   THEN 'Out for Delivery'\n           WHEN 'Pending'   THEN 'Awaiting Processing'\n           ELSE 'Unknown Status'\n       END AS StatusLabel\nFROM Orders","starterSql":"","id":"case-statement-02"},{"topic":"case-statement","difficulty":"Easy","title":"Map Gender codes to full words for employees","prompt":"Map Gender codes to full words for employees.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName,\n       CASE Gender\n           WHEN 'M' THEN 'Male'\n           WHEN 'F' THEN 'Female'\n           ELSE 'Other'\n       END AS GenderLabel\nFROM Employees","starterSql":"","id":"case-statement-03"},{"topic":"case-statement","difficulty":"Medium","title":"Map Country code to a region label","prompt":"Map Country code to a region label.","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName, Country,\n       CASE Country\n           WHEN 'USA'     THEN 'North America'\n           WHEN 'Germany' THEN 'Europe'\n           WHEN 'UK'      THEN 'Europe'\n           ELSE 'Other'\n       END AS Region\nFROM Customers","starterSql":"","id":"case-statement-04"},{"topic":"case-statement","difficulty":"Medium","title":"Use simple CASE to assign a numeric priority to order status","prompt":"Use simple CASE to assign a numeric priority to order status.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderStatus,\n       CASE OrderStatus\n           WHEN 'Pending'   THEN 1\n           WHEN 'Shipped'   THEN 2\n           WHEN 'Delivered' THEN 3\n           ELSE 99\n       END AS StatusPriority\nFROM Orders\nORDER BY StatusPriority","starterSql":"","id":"case-statement-05"},{"topic":"case-statement","difficulty":"Medium","title":"Use CASE to display department name with an emoji/short code","prompt":"Use CASE to display department name with an emoji/short code.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, Department,\n       CASE Department\n           WHEN 'Sales'     THEN 'Sales [S]'\n           WHEN 'Marketing' THEN 'Marketing [M]'\n           WHEN 'IT'        THEN 'IT [I]'\n           ELSE Department || ' [x]'\n       END AS DeptDisplay\nFROM Employees","starterSql":"","id":"case-statement-06"},{"topic":"case-statement","difficulty":"Medium","title":"Use CASE in SELECT to show different sales messages per category","prompt":"Use CASE in SELECT to show different sales messages per category.","tables":["Products"],"solutionSql":"SELECT p.ProductID, p.Product, p.Category,\n       CASE p.Category\n           WHEN 'Clothing'     THEN 'Fashion Deal!'\n           WHEN 'Accessories'  THEN 'Must-Have Accessory!'\n           ELSE 'Great Buy!'\n       END AS PromoMessage\nFROM Products p","starterSql":"","id":"case-statement-07"},{"topic":"case-statement","difficulty":"Hard","title":"Use simple CASE inside SUM to pivot: total sales by order status in one row","prompt":"Use simple CASE inside SUM to pivot: total sales by order status in one row.","tables":["Orders"],"solutionSql":"SELECT\n    SUM(CASE OrderStatus WHEN 'Delivered' THEN Sales ELSE 0 END) AS DeliveredSales,\n    SUM(CASE OrderStatus WHEN 'Shipped'   THEN Sales ELSE 0 END) AS ShippedSales\nFROM Orders","starterSql":"","id":"case-statement-08"},{"topic":"case-statement","difficulty":"Hard","title":"Assign a shipping priority score to each order based on status, then rank","prompt":"Assign a shipping priority score to each order based on status, then rank.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderStatus, Sales,\n       CASE OrderStatus\n           WHEN 'Pending'   THEN 10\n           WHEN 'Shipped'   THEN 5\n           WHEN 'Delivered' THEN 1\n           ELSE 99\n       END AS PriorityScore,\n       RANK() OVER (\n           ORDER BY CASE OrderStatus\n               WHEN 'Pending'   THEN 10\n               WHEN 'Shipped'   THEN 5\n               WHEN 'Delivered' THEN 1\n               ELSE 99\n           END DESC\n       ) AS PriorityRank\nFROM Orders","starterSql":"","id":"case-statement-09"},{"topic":"case-statement","difficulty":"Hard","title":"Use CASE to create a gender-based salary report with per-gender totals","prompt":"Use CASE to create a gender-based salary report with per-gender totals.","tables":["Employees"],"solutionSql":"SELECT\n    SUM(CASE Gender WHEN 'M' THEN Salary ELSE 0 END) AS MaleSalaryTotal,\n    SUM(CASE Gender WHEN 'F' THEN Salary ELSE 0 END) AS FemaleSalaryTotal,\n    AVG(CASE Gender WHEN 'M' THEN Salary ELSE NULL END) AS MaleAvgSalary,\n    AVG(CASE Gender WHEN 'F' THEN Salary ELSE NULL END) AS FemaleAvgSalary\nFROM Employees","starterSql":"","id":"case-statement-10"},{"topic":"case-statement","difficulty":"Hard","title":"Combine simple CASE for category discount with window function to compute discounted price","prompt":"Combine simple CASE for category discount with window function to compute discounted price and rank within category.","tables":["Products"],"solutionSql":"SELECT p.ProductID, p.Product, p.Category, p.Price,\n       CASE p.Category\n           WHEN 'Clothing'    THEN 0.10\n           WHEN 'Accessories' THEN 0.05\n           ELSE 0\n       END AS DiscountRate,\n       ROUND(p.Price * (1 - CASE p.Category\n           WHEN 'Clothing'    THEN 0.10\n           WHEN 'Accessories' THEN 0.05\n           ELSE 0 END), 2) AS DiscountedPrice,\n       RANK() OVER (PARTITION BY p.Category\n                    ORDER BY p.Price DESC) AS PriceRankInCategory\nFROM Products p","starterSql":"","id":"case-statement-11"},{"topic":"choose-join","difficulty":"Easy","title":"Choose INNER JOIN for valid customer orders","prompt":"Return only orders that have matching customers. Show OrderID, CustomerID, FirstName, and Sales.","tables":["Orders","Customers"],"solutionSql":"SELECT o.OrderID, c.CustomerID, c.FirstName, o.Sales\nFROM Orders o\nINNER JOIN Customers c ON o.CustomerID = c.CustomerID\nORDER BY o.OrderID","starterSql":"","id":"choose-join-02"},{"topic":"choose-join","difficulty":"Easy","title":"Choose LEFT JOIN for all customers","prompt":"Show every customer and any matching order. Include customers with no order.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, o.OrderID, o.Sales\nFROM Customers c\nLEFT JOIN Orders o ON c.CustomerID = o.CustomerID\nORDER BY c.CustomerID, o.OrderID","starterSql":"","id":"choose-join-03"},{"topic":"choose-join","difficulty":"Easy","title":"Choose LEFT ANTI JOIN for customers without orders","prompt":"Find customers who have not placed any order.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName\nFROM Customers c\nLEFT JOIN Orders o ON c.CustomerID = o.CustomerID\nWHERE o.OrderID IS NULL\nORDER BY c.CustomerID","starterSql":"","id":"choose-join-04"},{"topic":"choose-join","difficulty":"Medium","title":"Choose multi-table joins for an order report","prompt":"Show each order with customer name, product name, salesperson name, and sales.","tables":["Orders","Customers","Products","Employees"],"solutionSql":"SELECT o.OrderID, c.FirstName AS CustomerName, p.Product AS ProductName, e.FirstName AS SalespersonName, o.Sales\nFROM Orders o\nLEFT JOIN Customers c ON o.CustomerID = c.CustomerID\nLEFT JOIN Products p ON o.ProductID = p.ProductID\nLEFT JOIN Employees e ON o.SalesPersonID = e.EmployeeID\nORDER BY o.OrderID","starterSql":"","id":"choose-join-05"},{"topic":"choose-join","difficulty":"Medium","title":"Choose CROSS JOIN for all customer-product pairs","prompt":"Create every possible customer and product combination.","tables":["Customers","Products"],"solutionSql":"SELECT c.CustomerID, c.FirstName, p.ProductID, p.Product\nFROM Customers c\nCROSS JOIN Products p\nORDER BY c.CustomerID, p.ProductID","starterSql":"","id":"choose-join-06"},{"topic":"choose-join","difficulty":"Medium","title":"Choose aggregation after LEFT JOIN","prompt":"Show every customer with order count and total sales, using 0 for customers without orders.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, COUNT(o.OrderID) AS OrderCount, IFNULL(SUM(o.Sales),0) AS TotalSales\nFROM Customers c\nLEFT JOIN Orders o ON c.CustomerID = o.CustomerID\nGROUP BY c.CustomerID, c.FirstName\nORDER BY c.CustomerID","starterSql":"","id":"choose-join-07"},{"topic":"choose-join","difficulty":"Medium","title":"Choose self join for employee managers","prompt":"Show each employee with their manager name when a manager exists.","tables":["Employees"],"solutionSql":"SELECT e.EmployeeID, e.FirstName AS EmployeeName, m.FirstName AS ManagerName\nFROM Employees e\nLEFT JOIN Employees m ON e.ManagerID = m.EmployeeID\nORDER BY e.EmployeeID","starterSql":"","id":"choose-join-08"},{"topic":"choose-join","difficulty":"Hard","title":"Choose anti join for unsold products","prompt":"Find products that are in Products but never appear in Orders.","tables":["Products","Orders"],"solutionSql":"SELECT p.ProductID, p.Product, p.Category\nFROM Products p\nLEFT JOIN Orders o ON p.ProductID = o.ProductID\nWHERE o.OrderID IS NULL\nORDER BY p.ProductID","starterSql":"","id":"choose-join-09"},{"topic":"choose-join","difficulty":"Hard","title":"Choose join plus HAVING for repeat customers","prompt":"Find customers with more than two orders.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, COUNT(o.OrderID) AS OrderCount\nFROM Customers c\nINNER JOIN Orders o ON c.CustomerID = o.CustomerID\nGROUP BY c.CustomerID, c.FirstName\nHAVING COUNT(o.OrderID) > 2\nORDER BY OrderCount DESC","starterSql":"","id":"choose-join-10"},{"topic":"choose-join","difficulty":"Hard","title":"Choose UNION ALL for full mismatch audit","prompt":"Return customer-only records and order-only records in one audit result.","tables":["Customers","Orders"],"solutionSql":"SELECT 'Customer Only' AS AuditType, c.CustomerID, c.FirstName, NULL AS OrderID\nFROM Customers c\nLEFT JOIN Orders o ON c.CustomerID = o.CustomerID\nWHERE o.OrderID IS NULL\nUNION ALL\nSELECT 'Order Only', o.CustomerID, NULL, o.OrderID\nFROM Orders o\nLEFT JOIN Customers c ON o.CustomerID = c.CustomerID\nWHERE c.CustomerID IS NULL","starterSql":"","id":"choose-join-11"},{"topic":"date-time","difficulty":"Easy","title":"Display the OrderDate and ShipDate for every order","prompt":"Display the OrderDate and ShipDate for every order.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderDate, ShipDate\nFROM Orders","starterSql":"","id":"date-time-02"},{"topic":"date-time","difficulty":"Easy","title":"Extract the year, month, and day from each employee's BirthDate","prompt":"Extract the year, month, and day from each employee's BirthDate.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, BirthDate,\n       CAST(strftime('%Y', BirthDate) AS INT)  AS BirthYear,\n       CAST(strftime('%m', BirthDate) AS INT) AS BirthMonth,\n       CAST(strftime('%d', BirthDate) AS INT)   AS BirthDay\nFROM Employees","starterSql":"","id":"date-time-03"},{"topic":"date-time","difficulty":"Easy","title":"Show orders placed in January 2025","prompt":"Show orders placed in January 2025.","tables":["Orders"],"solutionSql":"SELECT OrderID, CustomerID, OrderDate, Sales\nFROM Orders\nWHERE CAST(strftime('%m', OrderDate) AS INT) = 1 AND CAST(strftime('%Y', OrderDate) AS INT) = 2025","starterSql":"","id":"date-time-04"},{"topic":"date-time","difficulty":"Easy","title":"Show the current date and current date-time","prompt":"Show the current date and current date-time.","tables":["Orders"],"solutionSql":"SELECT CAST(datetime('now') AS DATE) AS TodayDate,\n       datetime('now')               AS CurrentDateTime","starterSql":"","id":"date-time-05"},{"topic":"date-time","difficulty":"Medium","title":"Calculate how many days it took to ship each order (difference between ShipDate and OrderD","prompt":"Calculate how many days it took to ship each order (difference between ShipDate and OrderDate).","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderDate, ShipDate,\n       CAST(julianday(ShipDate) - julianday(OrderDate) AS INT) AS DaysToShip\nFROM Orders\nORDER BY DaysToShip DESC","starterSql":"","id":"date-time-06"},{"topic":"date-time","difficulty":"Medium","title":"Add 30 days to each order's ShipDate to compute an estimated return window","prompt":"Add 30 days to each order's ShipDate to compute an estimated return window.","tables":["Orders"],"solutionSql":"SELECT OrderID, ShipDate,\n       date(ShipDate, (30) || ' days') AS ReturnDeadline\nFROM Orders","starterSql":"","id":"date-time-07"},{"topic":"date-time","difficulty":"Medium","title":"Calculate each employee's age (in years) from their BirthDate","prompt":"Calculate each employee's age (in years) from their BirthDate.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, LastName, BirthDate,\n       (CAST(strftime('%Y', datetime('now')) AS INT)-CAST(strftime('%Y', BirthDate) AS INT)) AS Age\nFROM Employees\nORDER BY Age","starterSql":"","id":"date-time-08"},{"topic":"date-time","difficulty":"Medium","title":"Extract the hour and minute from CreationTime for all orders","prompt":"Extract the hour and minute from CreationTime for all orders.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       CreationTime,\n       CAST(strftime('%H', CreationTime) AS INT) AS OrderHour,\n       CAST(strftime('%M', CreationTime) AS INT) AS OrderMinute\nFROM Orders","starterSql":"","id":"date-time-09"},{"topic":"date-time","difficulty":"Medium","title":"Show orders placed in the first 15 days of any month","prompt":"Show orders placed in the first 15 days of any month.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderDate, CustomerID, Sales\nFROM Orders\nWHERE CAST(strftime('%d', OrderDate) AS INT) <= 15","starterSql":"","id":"date-time-10"},{"topic":"date-time","difficulty":"Medium","title":"Format OrderDate as 'Month DD, YYYY' string (e.g. 'January 01, 2025')","prompt":"Format OrderDate as 'Month DD, YYYY' string (e.g. 'January 01, 2025').","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       strftime('%Y-%m-%d', OrderDate) AS FormattedDate\nFROM Orders","starterSql":"","id":"date-time-11"},{"topic":"date-time","difficulty":"Medium","title":"Find employees who were born in February","prompt":"Find employees who were born in February.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, LastName, BirthDate\nFROM Employees\nWHERE CAST(strftime('%m', BirthDate) AS INT) = 2","starterSql":"","id":"date-time-12"},{"topic":"date-time","difficulty":"Medium","title":"Calculate the number of months between OrderDate and ShipDate for each order","prompt":"Calculate the number of months between OrderDate and ShipDate for each order.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderDate, ShipDate,\n       ((CAST(strftime('%Y', ShipDate) AS INT)-CAST(strftime('%Y', OrderDate) AS INT))*12 + (CAST(strftime('%m', ShipDate) AS INT)-CAST(strftime('%m', OrderDate) AS INT))) AS MonthsDiff\nFROM Orders","starterSql":"","id":"date-time-13"},{"topic":"date-time","difficulty":"Hard","title":"For each month in 2025, count the number of orders and total sales","prompt":"For each month in 2025, count the number of orders and total sales.","tables":["Orders"],"solutionSql":"SELECT CAST(strftime('%m', OrderDate) AS INT) AS OrderMonth,\n       CASE strftime('%m', OrderDate) WHEN '01' THEN 'January' WHEN '02' THEN 'February' WHEN '03' THEN 'March' WHEN '04' THEN 'April' WHEN '05' THEN 'May' WHEN '06' THEN 'June' WHEN '07' THEN 'July' WHEN '08' THEN 'August' WHEN '09' THEN 'September' WHEN '10' THEN 'October' WHEN '11' THEN 'November' ELSE 'December' END AS MonthName,\n       COUNT(*)         AS TotalOrders,\n       SUM(Sales)       AS TotalSales\nFROM Orders\nWHERE CAST(strftime('%Y', OrderDate) AS INT) = 2025\nGROUP BY CAST(strftime('%m', OrderDate) AS INT), CASE strftime('%m', OrderDate) WHEN '01' THEN 'January' WHEN '02' THEN 'February' WHEN '03' THEN 'March' WHEN '04' THEN 'April' WHEN '05' THEN 'May' WHEN '06' THEN 'June' WHEN '07' THEN 'July' WHEN '08' THEN 'August' WHEN '09' THEN 'September' WHEN '10' THEN 'October' WHEN '11' THEN 'November' ELSE 'December' END\nORDER BY OrderMonth","starterSql":"","id":"date-time-14"},{"topic":"date-time","difficulty":"Hard","title":"Find orders where shipping took more than 7 days","prompt":"Find orders where shipping took more than 7 days.","tables":["Orders"],"solutionSql":"SELECT OrderID, CustomerID, OrderDate, ShipDate,\n       CAST(julianday(ShipDate) - julianday(OrderDate) AS INT) AS DaysToShip\nFROM Orders\nWHERE CAST(julianday(ShipDate) - julianday(OrderDate) AS INT) > 7\nORDER BY DaysToShip DESC","starterSql":"","id":"date-time-15"},{"topic":"date-time","difficulty":"Hard","title":"Show orders placed on weekdays vs weekends","prompt":"Show orders placed on weekdays vs weekends.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderDate,\n       CASE strftime('%w', OrderDate) WHEN '0' THEN 'Sunday' WHEN '1' THEN 'Monday' WHEN '2' THEN 'Tuesday' WHEN '3' THEN 'Wednesday' WHEN '4' THEN 'Thursday' WHEN '5' THEN 'Friday' ELSE 'Saturday' END AS DayName,\n       CASE WHEN strftime('%w', OrderDate) IN ('0','6') THEN 'Weekend' ELSE 'Weekday' END AS DayType\nFROM Orders\nORDER BY OrderDate","starterSql":"","id":"date-time-16"},{"topic":"date-time","difficulty":"Hard","title":"Identify employees whose birthday falls in the current month","prompt":"Identify employees whose birthday falls in the current month.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, LastName, BirthDate\nFROM Employees\nWHERE CAST(strftime('%m', BirthDate) AS INT) = CAST(strftime('%m', datetime('now')) AS INT)","starterSql":"","id":"date-time-17"},{"topic":"date-time","difficulty":"Hard","title":"Calculate the average shipping duration in days per order status","prompt":"Calculate the average shipping duration in days per order status.","tables":["Orders"],"solutionSql":"SELECT OrderStatus,\n       COUNT(*)                                 AS TotalOrders,\n       AVG(CAST(julianday(ShipDate) - julianday(OrderDate) AS INT)) AS AvgShippingDays\nFROM Orders\nGROUP BY OrderStatus\nORDER BY AvgShippingDays DESC","starterSql":"","id":"date-time-18"},{"topic":"date-time","difficulty":"Hard","title":"Find the earliest and latest order dates per customer","prompt":"Find the earliest and latest order dates per customer.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID,\n       c.FirstName || ' ' || COALESCE(c.LastName,'') AS CustomerName,\n       MIN(o.OrderDate) AS FirstOrderDate,\n       MAX(o.OrderDate) AS LastOrderDate,\n       CAST(julianday(MAX(o.OrderDate)) - julianday(MIN(o.OrderDate)) AS INT) AS DaysBetween\nFROM Customers c\nJOIN Orders o ON c.CustomerID = o.CustomerID\nGROUP BY c.CustomerID, c.FirstName, c.LastName\nORDER BY c.CustomerID","starterSql":"","id":"date-time-19"},{"topic":"date-time","difficulty":"Hard","title":"Truncate CreationTime to just the date part (remove time) and group orders by date","prompt":"Truncate CreationTime to just the date part (remove time) and group orders by date.","tables":["Orders"],"solutionSql":"SELECT date(CreationTime) AS OrderCreationDate,\n       COUNT(*)                   AS OrdersCreated,\n       SUM(Sales)                 AS DailySales\nFROM Orders\nGROUP BY date(CreationTime)\nORDER BY OrderCreationDate","starterSql":"","id":"date-time-20"},{"topic":"date-time","difficulty":"Hard","title":"Compare the shipping speed of orders in Q1 2025: find the fastest, slowest, and average da","prompt":"Compare the shipping speed of orders in Q1 2025: find the fastest, slowest, and average days-to-ship across the quarter, broken down by salesperson.","tables":["Orders"],"solutionSql":"SELECT SalesPersonID,\n       MIN(CAST(julianday(ShipDate) - julianday(OrderDate) AS INT)) AS FastestShip,\n       MAX(CAST(julianday(ShipDate) - julianday(OrderDate) AS INT)) AS SlowestShip,\n       AVG(CAST(julianday(ShipDate) - julianday(OrderDate) AS INT)) AS AvgShip,\n       COUNT(*)                                AS TotalOrders\nFROM Orders\nWHERE OrderDate BETWEEN '2025-01-01' AND '2025-03-31'\nGROUP BY SalesPersonID\nORDER BY AvgShip","starterSql":"","id":"date-time-21"}];

function renderTopicTree(){
  function chapterForTopic(id){
    let found=null;
    function walk(items, chapter){
      items.forEach(item=>{
        if(typeof item==="string" && item===id) found=chapter;
        else if(item.children) walk(item.children, chapter);
      });
    }
    TOPIC_TREE.forEach(main=>walk(main.children, main.main));
    return found;
  }
  currentChapter=chapterForTopic(currentTopic)||currentChapter||TOPIC_TREE[0].main;
  $("chapterSelect").innerHTML=TOPIC_TREE.map(main=>`<option value="${esc(main.main)}" ${main.main===currentChapter?"selected":""}>${esc(main.main)}</option>`).join("");
  $("chapterSelect").onchange=e=>{
    currentChapter=e.target.value;
    const selected=TOPIC_TREE.find(main=>main.main===currentChapter);
    function firstTopic(items){
      for(const item of items){
        if(typeof item==="string") return item;
        const child=firstTopic(item.children||[]);
        if(child) return child;
      }
      return null;
    }
    const first=selected?firstTopic(selected.children):null;
    if(first){currentTopic=first;currentTab="explanation";currentQuestionId=`${first}-01`;render();}
  };
  function leaf(id, depth){
    const topic=TOPIC[id];
    if(!topic) return "";
    return `<button class="topic-leaf depth-${depth} ${id===currentTopic?"active":""}" data-topic="${id}">${esc(topic.title)}</button>`;
  }
  function node(item, depth=0){
    if(typeof item==="string") return leaf(item, depth);
    return `<div class="topic-parent">${esc(item.label)}</div>${item.children.map(x=>node(x, depth+1)).join("")}`;
  }
  const selected=TOPIC_TREE.find(main=>main.main===currentChapter)||TOPIC_TREE[0];
  $("topicTree").innerHTML=`<div class="topic-group"><div class="topic-main">${esc(selected.main)}</div><div class="topic-branch">${selected.children.map(x=>node(x,0)).join("")}</div></div>`;
  document.querySelectorAll(".topic-leaf").forEach(b=>b.addEventListener("click",()=>{currentTopic=b.dataset.topic;currentTab="explanation";currentChapter=chapterForTopic(currentTopic)||currentChapter;const first=PRACTICE.find(q=>q.topic===currentTopic);currentQuestionId=first?first.id:currentQuestionId;render();}));
}

function renderExplanation(topic){
  function renderConceptContent(text){
    // Split on lines to detect code blocks (lines starting with SELECT, FROM, etc.)
    const lines=text.split("\n");
    let html="",inCode=false,codeLines=[];
    const codeStart=l=>(/^\s*(SELECT|FROM|INNER|LEFT|RIGHT|FULL|CROSS|WHERE|ON|GROUP|ORDER|HAVING|JOIN|UNION|EXCEPT|INTERSECT|WITH|INSERT|UPDATE|DELETE|CREATE|--)/i.test(l.trim()));
    for(let i=0;i<lines.length;i++){
      const l=lines[i];
      if(codeStart(l)){
        if(!inCode){inCode=true;codeLines=[];}
        codeLines.push(l);
      } else {
        if(inCode){html+=`<pre style="margin:8px 0 10px">${esc(codeLines.join("\n"))}</pre>`;inCode=false;codeLines=[];}
        if(l.trim()===""){html+="<br>";} else {html+=`<span>${esc(l)}</span><br>`;}
      }
    }
    if(inCode) html+=`<pre style="margin:8px 0 10px">${esc(codeLines.join("\n"))}</pre>`;

function formatSql(sql){
  let text=sql.trim().replace(/\s+/g," ");
  if(!text) return "";
  const protectedStrings=[];
  text=text.replace(/'([^']|'')*'/g,m=>{protectedStrings.push(m);return `__STR_${protectedStrings.length-1}__`;});
  const clauses=["SELECT","FROM","WHERE","GROUP BY","HAVING","ORDER BY","UNION ALL","UNION","EXCEPT","INTERSECT","INNER JOIN","LEFT JOIN","RIGHT JOIN","FULL JOIN","CROSS JOIN","JOIN","ON","LIMIT"];
  clauses.forEach(c=>{text=text.replace(new RegExp(`\\s+${c.replace(" ","\\s+")}\\s+`,"ig"),`\n${c} `);});
  text=text.replace(/\s*,\s*/g,",\n    ").replace(/\s*(=|<>|!=|>=|<=|>|<|\+|-|\*|\/)\s*/g," $1 ");
  text=text.replace(/\b(select|from|where|group by|having|order by|union all|union|except|intersect|inner join|left join|right join|full join|cross join|join|on|and|or|case|when|then|else|end|as|distinct|limit)\b/gi,m=>m.toUpperCase());
  text=text.split("\n").map((line,i)=>{
    const t=line.trim();
    if(!t) return "";
    if(i===0) return t;
    return /^(FROM|WHERE|GROUP BY|HAVING|ORDER BY|UNION|EXCEPT|INTERSECT|INNER JOIN|LEFT JOIN|RIGHT JOIN|FULL JOIN|CROSS JOIN|JOIN|ON|LIMIT)\b/.test(t)?t:"    "+t;
  }).join("\n");
  protectedStrings.forEach((s,i)=>{text=text.replace(`__STR_${i}__`,s);});
  return /;\s*$/.test(text)?text:text+";";
}
function extractAliases(sql){
  const aliases={};
  const tableNames=Object.keys(SCHEMA).join("|");
  const re=new RegExp(`\\b(?:FROM|JOIN)\\s+(${tableNames})\\s+(?:AS\\s+)?([A-Za-z_][\\w]*)`,"gi");
  let m;
  while((m=re.exec(sql))) if(!/^(ON|WHERE|JOIN|INNER|LEFT|RIGHT|FULL|CROSS|GROUP|ORDER|HAVING|LIMIT)$/i.test(m[2])) aliases[m[2]]=m[1];
  Object.keys(SCHEMA).forEach(t=>aliases[t]=t);
  return aliases;
}
function scheduleSqlValidation(showStatus=true){
  clearTimeout(validationTimer);

function validateSqlInEditor(showStatus=true){
  if(!sqlEditor||!window.monaco) return;
  const model=sqlEditor.getModel();
  const sql=model.getValue().trim();
  const markers=[];
  if(!sql){monaco.editor.setModelMarkers(model,"sql-shala",[]);updateEditorStatus("Ready.","status-ok");return;}
  if(!db){updateEditorStatus("Database is loading. Validation will start when DB is ready.","status-warn");return;}
  try{
    statementRanges(sql).forEach(item=>{
      if(!item.text.trim()) return;
      const stmt=db.prepare(item.text);
      stmt.free();
    });
    markers.push(...lintSql(sql,model));
    monaco.editor.setModelMarkers(model,"sql-shala",markers);
    if(showStatus) updateEditorStatus(markers.length?`${markers.length} warning${markers.length===1?"":"s"} found.`:"SQL looks valid.","status-ok");
  }catch(e){
    const marker=markerFromSqlError(e.message,model);
    monaco.editor.setModelMarkers(model,"sql-shala",[marker]);
    updateEditorStatus(`Line ${marker.startLineNumber}: ${e.message}`,"status-err");
  }
}
function markerFromSqlError(message,model){
  const near=message.match(/near "([^"]+)"/i)?.[1]||message.match(/no such column:\s*([^\s]+)/i)?.[1]||message.match(/no such table:\s*([^\s]+)/i)?.[1];
  let range={startLineNumber:1,startColumn:1,endLineNumber:1,endColumn:2};
  if(near){
    const match=model.findMatches(near,false,false,true,null,true)[0];
    if(match) range=match.range;
  }
  return {severity:monaco.MarkerSeverity.Error,message,startLineNumber:range.startLineNumber,startColumn:range.startColumn,endLineNumber:range.endLineNumber,endColumn:range.endColumn};
}
function lintSql(sql,model){
  const markers=[];
  const aliases=extractAliases(sql);
  const aliasRefs=[...sql.matchAll(/\b([A-Za-z_]\w*)\s*\./g)].map(m=>m[1]);
  aliasRefs.forEach(alias=>{
    if(!aliases[alias]){
      const match=model.findMatches(alias+".",false,false,true,null,true)[0];
      if(match) markers.push({severity:monaco.MarkerSeverity.Error,message:`Undefined alias '${alias}'. Check your FROM/JOIN alias.`,startLineNumber:match.range.startLineNumber,startColumn:match.range.startColumn,endLineNumber:match.range.endLineNumber,endColumn:match.range.endColumn});
    }
  });
  const selectLine=sql.match(/select\s+([A-Za-z_]\w*)\s+([A-Za-z_]\w*)\s+from/i);
  if(selectLine){
    const allCols=new Set(Object.values(SCHEMA).flatMap(t=>t.columns.map(c=>c.toLowerCase())));
    if(allCols.has(selectLine[1].toLowerCase())&&allCols.has(selectLine[2].toLowerCase())){
      const match=model.findMatches(selectLine[1]+" "+selectLine[2],false,false,true,null,true)[0];
      if(match) markers.push({severity:monaco.MarkerSeverity.Warning,message:`Possible missing comma between '${selectLine[1]}' and '${selectLine[2]}'. If '${selectLine[2]}' is meant as an alias, use AS.`,startLineNumber:match.range.startLineNumber,startColumn:match.range.startColumn,endLineNumber:match.range.endLineNumber,endColumn:match.range.endColumn});
    }
  }
  return markers;
}

  try{
    const SQL=await initSqlJs({locateFile:f=>`https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.2/${f}`});
    db=new SQL.Database();
    for(const [name,t] of Object.entries(SCHEMA)){
      const defs=t.columns.map(c=>{
        const numeric=["CustomerID","Score","EmployeeID","Salary","ManagerID","ProductID","Price","OrderID","SalesPersonID","Quantity","Sales"].includes(c);
        return `${c} ${numeric?"REAL":"TEXT"}`;
      }).join(",");
      db.run(`CREATE TABLE ${name} (${defs});`);
      const placeholders=t.columns.map(()=>"?").join(",");
      const stmt=db.prepare(`INSERT INTO ${name} VALUES (${placeholders})`);
      t.rows.forEach(r=>stmt.run(r));
      stmt.free();
    }
    $("dbPill").className="pill ready";$("dbPill").innerHTML='<span class="dot"></span><span>DB ready</span>';render();
  }catch(e){$("dbPill").innerHTML='<span class="dot"></span><span>DB error</span>';console.error(e);}
}
function handleEditorKeys(e){
  if((e.ctrlKey||e.metaKey)&&e.key==="Enter"){
    e.preventDefault();
    runQuery();
    return;
  }
  if(e.key==="Enter"){
    e.preventDefault();
    const el=e.target;
    const start=el.selectionStart;
    const value=el.value;
    // Find the start of the current line
    const lineStart=value.lastIndexOf("\n",start-1)+1;
    const currentLine=value.slice(lineStart,start);
    // Extract leading whitespace from current line
    const indent=currentLine.match(/^(\s*)/)[1];
    const insertion="\n"+indent;
    el.value=value.slice(0,start)+insertion+value.slice(el.selectionEnd);
    el.selectionStart=el.selectionEnd=start+insertion.length;
    return;
  }
  if(e.key==="Tab"){
    e.preventDefault();
    const el=e.target;
    const start=el.selectionStart;
    const end=el.selectionEnd;
    const value=el.value;
    el.value=value.slice(0,start)+"  "+value.slice(end);
    el.selectionStart=el.selectionEnd=start+2;
  }
}
function executableStatements(sql){
  return statementRanges(sql).map(x=>x.text).filter(Boolean);
}
function statementRanges(sql){
  const ranges=[];
  let start=0,inSingle=false,inDouble=false,inLineComment=false,inBlockComment=false;
  for(let i=0;i<sql.length;i++){
    const ch=sql[i],next=sql[i+1];
    if(inLineComment){if(ch==="\n") inLineComment=false;continue;}
    if(inBlockComment){if(ch==="*"&&next==="/"){inBlockComment=false;i++;}continue;}
    if(inSingle){if(ch==="'"&&next==="'"){i++;continue;}if(ch==="'") inSingle=false;continue;}
    if(inDouble){if(ch==='"') inDouble=false;continue;}
    if(ch==="-"&&next==="-"){inLineComment=true;i++;continue;}
    if(ch==="/"&&next==="*"){inBlockComment=true;i++;continue;}
    if(ch==="'"){inSingle=true;continue;}
    if(ch==='"'){inDouble=true;continue;}
    if(ch===";"){
      const raw=sql.slice(start,i+1);
      const text=stripSqlComments(raw).trim();
      if(text) ranges.push({text,start,end:i+1});
      start=i+1;
    }
  }
  const raw=sql.slice(start);
  const text=stripSqlComments(raw).trim();
  if(text) ranges.push({text,start,end:sql.length});
  return ranges;
}
function stripSqlComments(sql){
  return sql.replace(/\/\*[\s\S]*?\*\//g,"").split("\n").filter(line=>!line.trim().startsWith("--")).join("\n");
}
function offsetToPosition(text,offset){
  const before=text.slice(0,offset).split("\n");
  return {lineNumber:before.length,column:before[before.length-1].length+1};
}
function rangeFromOffsets(text,start,end){
  const s=offsetToPosition(text,start),e=offsetToPosition(text,end);
  return new monaco.Range(s.lineNumber,s.column,e.lineNumber,e.column);
}
function executeLastResult(sql){
  let last=null;
  executableStatements(sql).forEach(statement=>{
    const res=db.exec(statement);
    if(res.length) last=res[res.length-1];
  });
  return last;
}
function executeSqlScript(sql){
  const started=performance.now();
  let last=null,rowsAffected=0,statementCount=0;
  executableStatements(sql).forEach(statement=>{
    statementCount++;
    const before=db.getRowsModified();
    const res=db.exec(statement);
    const after=db.getRowsModified();
    rowsAffected+=Math.max(0,after-before);
    if(res.length) last=res[res.length-1];
  });
  return {last,rowsAffected,statementCount,elapsedMs:performance.now()-started};
}
function normalizeResult(result){
  if(!result) return {columns:[],rows:[]};
  return {
    columns:result.columns.map(c=>String(c).toLowerCase()),
    rows:result.values.map(row=>row.map(cell=>cell===null?null:String(cell)))
  };
}
function compareResults(userResult, expectedResult){
  const user=normalizeResult(userResult);
  const expected=normalizeResult(expectedResult);
  if(user.columns.length!==expected.columns.length){
    return {ok:false,message:`Column count differs. Your query returned ${user.columns.length}, expected ${expected.columns.length}.`};
  }
  if(user.rows.length!==expected.rows.length){
    return {ok:false,message:`Row count differs. Your query returned ${user.rows.length}, expected ${expected.rows.length}.`};
  }
  for(let i=0;i<expected.rows.length;i++){
    for(let j=0;j<expected.columns.length;j++){
      if(user.rows[i][j]!==expected.rows[i][j]){
        return {ok:false,message:`Data differs near row ${i+1}, column ${j+1}. Your output ran, but it does not match the expected answer yet.`};
      }
    }
  }
  return {ok:true,message:"Correct. Your output matches the expected solution for this question."};
}
function generateErrorHint(errorMsg, sql){
  const err=errorMsg.toLowerCase();
  const sqlUp=sql.toUpperCase();
  let where="",why="",fix="";
  if(err.includes("syntax error")&&err.includes("near")){
    const nearMatch=errorMsg.match(/near "([^"]+)"/i);
    const nearWord=nearMatch?nearMatch[1]:"a keyword";
    where=`The problem is near the word <strong>"${esc(nearWord)}"</strong> in your query.`;
    if(nearWord.toUpperCase()==="FROM"||nearWord.toUpperCase()==="WHERE"||nearWord.toUpperCase()==="ON"){
      why=`SQL found an unexpected keyword <strong>${esc(nearWord)}</strong> — this usually means the clause before it is incomplete or has a trailing comma.`;
      fix=`Check the clause just before <strong>${esc(nearWord)}</strong>. Look for a missing column name, an extra comma, or an unclosed parenthesis.`;
    } else {
      why=`SQL could not parse <strong>"${esc(nearWord)}"</strong> in this position. It might be misspelled, used in the wrong place, or the previous clause is missing something.`;
      fix=`Double-check the spelling of <strong>"${esc(nearWord)}"</strong> and make sure the clause before it ends correctly (no missing commas or keywords).`;
    }
  } else if(err.includes("no such column")){
    const colMatch=errorMsg.match(/no such column:\s*(.+)/i);
    const col=colMatch?colMatch[1].trim():"a column";
    where=`The column <strong>${esc(col)}</strong> was not found.`;
    why=`Either the column name is misspelled, you are using the wrong table alias, or you are referencing a column that does not exist in the tables you joined.`;
    fix=`Check the Required Schema panel on the right to confirm the exact column name. If you used an alias (like <code>c.CustomerID</code>), make sure the alias matches your FROM/JOIN clause.`;
  } else if(err.includes("no such table")){
    const tblMatch=errorMsg.match(/no such table:\s*(.+)/i);
    const tbl=tblMatch?tblMatch[1].trim():"a table";
    where=`The table <strong>${esc(tbl)}</strong> was not found.`;
    why=`The table name is either misspelled or you may be using a prefix (like <code>Sales.</code>) that does not apply to this local SQLite database.`;
    fix=`Use the exact table names shown in the Schema panel: <strong>Customers, Orders, Products, Employees, OrdersArchive</strong>. Do not add any prefix before the table name.`;
  } else if(err.includes("ambiguous column")){
    const colMatch=errorMsg.match(/ambiguous column name:\s*(.+)/i);
    const col=colMatch?colMatch[1].trim():"a column";
    where=`The column <strong>${esc(col)}</strong> is ambiguous.`;
    why=`Two or more tables in your query have a column with this name, so SQL doesn't know which one you mean.`;
    fix=`Qualify the column with its table alias. For example, write <code>c.${esc(col)}</code> or <code>o.${esc(col)}</code> depending on which table you intend.`;
  } else if(err.includes("misuse of aggregate")||err.includes("not a single-group group function")){
    where=`There is a problem with how you are mixing aggregate functions (like SUM, COUNT) with regular columns.`;
    why=`When you use an aggregate function, every non-aggregated column in the SELECT must appear in a GROUP BY clause.`;
    fix=`Add a GROUP BY clause that lists all non-aggregated columns from your SELECT. For example, if you select <code>CustomerID, SUM(Sales)</code>, you need <code>GROUP BY CustomerID</code>.`;
  } else if(err.includes("incomplete input")||err.includes("unexpected end")){
    where=`Your query appears to be incomplete — SQL reached the end without finishing a valid statement.`;
    why=`A clause, keyword, or parenthesis was started but never finished.`;
    fix=`Read your query from the last line upwards. Look for an unclosed parenthesis, a missing table/column name after a keyword like JOIN or ON, or a forgotten semicolon.`;
  } else {
    where=`An error occurred while running your query.`;
    why=`The database returned: <em>${esc(errorMsg)}</em>`;
    fix=`Read the error message carefully and compare your query against the Required Schema on the right. Check column names, table names, JOIN conditions, and keyword spelling.`;
  }
  return `<strong>💡 Hint — Do not give up yet!</strong><br><br>
    <strong>📍 Where:</strong> ${where}<br><br>
    <strong>🤔 Why:</strong> ${why}<br><br>
    <strong>🔧 How to fix it:</strong> ${fix}<br><br>
    <span style="color:var(--faint);font-size:.82rem">Try correcting your query and run it again. The solution is available via the "Reveal Solution" button when you need it.</span>`;
}
function selectedSqlForExecution(){
  if(!sqlEditor) return {sql:"",range:null,selected:false};
  const model=sqlEditor.getModel();
  const selection=sqlEditor.getSelection();
  if(selection&&!selection.isEmpty()) return {sql:model.getValueInRange(selection).trim(),range:selection,selected:true};
  return {sql:model.getValue().trim(),range:model.getFullModelRange(),selected:false};
}
function highlightExecutingRange(range){
  if(!sqlEditor||!range) return;
  executingDecorationIds=sqlEditor.deltaDecorations(executingDecorationIds,[{range,options:{isWholeLine:true,className:"query-running-line",glyphMarginClassName:"query-running-glyph"}}]);
  setTimeout(()=>{if(sqlEditor) executingDecorationIds=sqlEditor.deltaDecorations(executingDecorationIds,[]);},1200);
}
function renderExecutionSummary(check,exec,selected){
  const rows=exec.last?exec.last.values.length:0;
  return `<div class="result-msg ${check.ok?"check-ok":"check-warn"}">${esc(check.message)}</div><div class="check-detail">Executed ${selected?"selected SQL":"editor SQL"}: ${exec.statementCount} statement${exec.statementCount===1?"":"s"} in ${exec.elapsedMs.toFixed(1)} ms. Rows returned: ${rows}. Rows affected: ${exec.rowsAffected}.</div>`;
}
function renderResultGrid(columns,values,meta={}){
  resultState={columns,values:[...values],page:0,pageSize:25,sortColumn:null,sortDir:1,meta};
  drawResultGrid();
}
function drawResultGrid(){
  if(!resultState||!$("resultBody")) return;
  const total=resultState.values.length,maxPage=Math.max(0,Math.ceil(total/resultState.pageSize)-1);
  resultState.page=Math.min(resultState.page,maxPage);
  const start=resultState.page*resultState.pageSize;
  const rows=resultState.values.slice(start,start+resultState.pageSize);
  $("resultBody").innerHTML=`${resultState.meta.beforeHtml||""}<div class="result-tools"><div class="meta">${esc(resultState.meta.label||"Result grid")} • ${total} row${total===1?"":"s"} • ${esc(resultState.meta.time||"")}</div><div class="actions"><button class="btn ghost" id="csvBtn">Export CSV</button><div class="pager"><button class="btn ghost" id="prevPage">Prev</button><span>Page ${resultState.page+1} / ${maxPage+1}</span><button class="btn ghost" id="nextPage">Next</button></div></div></div><div class="result-grid-wrap"><table class="result-grid"><thead><tr>${resultState.columns.map((c,i)=>`<th data-c="${i}" title="Click to sort, drag edge to resize">${esc(c)}${resultState.sortColumn===i?(resultState.sortDir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead><tbody>${rows.map((row,ridx)=>`<tr>${row.map((cell,cidx)=>`<td data-r="${start+ridx}" data-c="${cidx}" title="Click to copy">${cell===null?'<span style="color:var(--faint)">NULL</span>':esc(cell)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
  $("csvBtn").addEventListener("click",exportResultCsv);
  $("prevPage").addEventListener("click",()=>{resultState.page=Math.max(0,resultState.page-1);drawResultGrid();});
  $("nextPage").addEventListener("click",()=>{resultState.page=Math.min(maxPage,resultState.page+1);drawResultGrid();});
  document.querySelectorAll(".result-grid th").forEach(th=>th.addEventListener("click",()=>sortResultBy(Number(th.dataset.c))));
  document.querySelectorAll(".result-grid td").forEach(td=>td.addEventListener("click",()=>copyResultCell(td)));
}
function sortResultBy(index){
  if(!resultState) return;
  resultState.sortDir=resultState.sortColumn===index?-resultState.sortDir:1;
  resultState.sortColumn=index;
  resultState.values.sort((a,b)=>{
    const av=a[index],bv=b[index];
    if(av===bv) return 0;
    if(av===null) return 1;
    if(bv===null) return -1;
    const an=Number(av),bn=Number(bv);
    const cmp=!Number.isNaN(an)&&!Number.isNaN(bn)?an-bn:String(av).localeCompare(String(bv));
    return cmp*resultState.sortDir;
  });
  resultState.page=0;
  drawResultGrid();
}
function copyResultCell(td){
  const value=resultState?.values[Number(td.dataset.r)]?.[Number(td.dataset.c)];
  navigator.clipboard?.writeText(value===null?"NULL":String(value));
  td.classList.add("copy-flash");
  setTimeout(()=>td.classList.remove("copy-flash"),450);
  toast("Cell copied.");
}
function exportResultCsv(){
  if(!resultState) return;
  const escapeCsv=v=>v===null?"":`"${String(v).replace(/"/g,'""')}"`;
  const csv=[resultState.columns.map(escapeCsv).join(","),...resultState.values.map(r=>r.map(escapeCsv).join(","))].join("\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download=`sql-shala-result-${Date.now()}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}
function runQuery(){
  const q=qById(currentQuestionId), picked=selectedSqlForExecution(), sql=picked.sql;
  if(!sql){$("resultBody").innerHTML='<div class="result-msg err">Please write a query first.</div>';return;}
  if(!db){$("resultBody").innerHTML='<div class="result-msg err">Database is still loading.</div>';return;}
  const statements=executableStatements(sql);
  if(!statements.length){$("resultBody").innerHTML='<div class="result-msg err">Please write a real SQL statement, not only comments.</div>';return;}
  localStorage.setItem("draft:"+q.id,getEditorValue());
  highlightExecutingRange(picked.range);
  try{
    const exec=executeSqlScript(sql);
    const last=exec.last;
    const expected=executeLastResult(q.solutionSql);
    const check=compareResults(last, expected);
    attempts.add(q.id);localStorage.setItem("sqlNotesAttempts",JSON.stringify([...attempts]));renderProgress();
    if($("solutionBox")){$("solutionBox").classList.add("show");$("solutionBox").innerHTML=solutionHtml(q);}
    if(!last){
      $("resultBody").innerHTML=renderExecutionSummary(check,exec,picked.selected)+`<div class="result-msg ok">Query executed successfully. No rows returned.</div>`;
      return;
    }
    const beforeHtml=renderExecutionSummary(check,exec,picked.selected)+`<div class="check-detail">Correctness is checked by comparing your final result table with the stored expected solution. A valid alternate answer may need the same selected columns and row order to be marked correct.</div>`;
    renderResultGrid(last.columns,last.values,{label:check.ok?"Success":"Executed with check warning",time:`${exec.elapsedMs.toFixed(1)} ms`,beforeHtml});
  }catch(e){
    validateSqlInEditor();
    const hint=generateErrorHint(e.message, getEditorValue());
    if($("resultBody")) $("resultBody").innerHTML=`<div class="result-msg err">Error: ${esc(e.message)}</div><div class="error-help">${hint}</div>`;
  }
}
function renderProgress(){$("progressPill").textContent=`${attempts.size} attempted`;}
function toast(message){const t=$("toast");t.textContent=message;t.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove("show"),1800);}
function clamp(n,min,max){return Math.max(min,Math.min(max,n));}
function setupSidebarResize(){
  const handle=$("sidebarResizer");
  if(!handle) return;
  handle.onpointerdown=e=>{
    e.preventDefault();
    document.body.style.userSelect="none";
    handle.setPointerCapture(e.pointerId);
    const onMove=ev=>{
      const width=clamp(ev.clientX,240,460);
      document.documentElement.style.setProperty("--sidebar-w",`${width}px`);
      localStorage.setItem("sqlSikhoSidebarW",width);
    };
    const onUp=ev=>{
      document.body.style.userSelect="";
      handle.releasePointerCapture(ev.pointerId);
      window.removeEventListener("pointermove",onMove);
      window.removeEventListener("pointerup",onUp);
    };
    window.addEventListener("pointermove",onMove);
    window.addEventListener("pointerup",onUp);
  };
}
function setupSchemaResize(){
  const handle=$("schemaResizer");
  if(!handle) return;
  handle.onpointerdown=e=>{
    e.preventDefault();
    document.body.style.userSelect="none";
    handle.setPointerCapture(e.pointerId);
    const onMove=ev=>{
      const contentRight=document.querySelector(".content").getBoundingClientRect().right;
      const width=clamp(contentRight-ev.clientX-18,320,680);
      document.documentElement.style.setProperty("--schema-w",`${width}px`);
      localStorage.setItem("sqlSikhoSchemaW",width);
    };
    const onUp=ev=>{
      document.body.style.userSelect="";
      handle.releasePointerCapture(ev.pointerId);
      window.removeEventListener("pointermove",onMove);
      window.removeEventListener("pointerup",onUp);
    };
    window.addEventListener("pointermove",onMove);
    window.addEventListener("pointerup",onUp);
  };
}
function restoreResizableWidths(){
  const sidebarW=Number(localStorage.getItem("sqlSikhoSidebarW"));
  const schemaW=Number(localStorage.getItem("sqlSikhoSchemaW"));
  if(sidebarW) document.documentElement.style.setProperty("--sidebar-w",`${clamp(sidebarW,240,460)}px`);
  if(schemaW) document.documentElement.style.setProperty("--schema-w",`${clamp(schemaW,320,680)}px`);
  setupSidebarResize();
}
document.querySelectorAll(".tab-btn").forEach(b=>b.addEventListener("click",()=>{currentTab=b.dataset.tab;render();}));
$("prevQ").addEventListener("click",()=>{const qs=PRACTICE.filter(q=>q.topic===currentTopic);const i=qs.findIndex(q=>q.id===currentQuestionId);if(i>0){currentQuestionId=qs[i-1].id;currentTab="practice";render();}});
$("nextQ").addEventListener("click",()=>{const qs=PRACTICE.filter(q=>q.topic===currentTopic);const i=qs.findIndex(q=>q.id===currentQuestionId);if(i<qs.length-1){currentQuestionId=qs[i+1].id;currentTab="practice";render();}});
$("resetBtn").addEventListener("click",()=>{attempts.clear();revealed.clear();Object.keys(localStorage).forEach(k=>{if(k==="sqlNotesAttempts"||k.startsWith("draft:"))localStorage.removeItem(k);});render();toast("Progress reset.");});
restoreResizableWidths();
render();
initDB();
</script>
