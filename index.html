<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SQL Shala - Uploaded SQL Notes Practice</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&family=Montserrat:wght@700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1020;--panel:#111827;--panel2:#162033;--panel3:#1e2b43;--line:#26344f;--line2:#3a4b69;
  --text:#edf2f7;--muted:#a8b4c7;--faint:#718096;--accent:#21c7a8;--accent2:#58a6ff;
  --warn:#f2b84b;--danger:#ff6b6b;--ok:#31d07d;--code:#080e19;--shadow:0 18px 50px rgba(0,0,0,.26);
  --sidebar-w:286px;--schema-w:430px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
a{color:inherit}
.app{height:100vh;display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);grid-template-rows:58px minmax(0,1fr)}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 18px;background:#0d1426;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:#0b1222;border:1px solid var(--line2);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.brand-title{font-family:"Montserrat",Inter,sans-serif;font-weight:800;line-height:1.1}.brand-sub{font-family:"Open Sans",Inter,sans-serif;font-size:.72rem;color:var(--muted)}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}
.pill{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:#111a2e;color:var(--muted);padding:7px 11px;border-radius:999px;font-size:.76rem;white-space:nowrap}
.pill.ready{color:var(--ok);border-color:rgba(49,208,125,.45)}.dot{width:7px;height:7px;border-radius:50%;background:currentColor}.dot.loading{animation:pulse 1.1s infinite ease-in-out}@keyframes pulse{50%{opacity:.25}}
.sidebar{position:relative;min-height:0;border-right:1px solid var(--line);background:#0f172a;display:grid;grid-template-rows:auto minmax(0,1fr)}
.sidebar-resizer{position:absolute;top:0;right:-5px;width:10px;height:100%;cursor:col-resize;z-index:25}
.sidebar-resizer:hover{background:rgba(88,166,255,.18)}
.side-section{min-height:0;padding:14px;border-top:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.label{font-size:.68rem;text-transform:uppercase;letter-spacing:.13em;color:var(--faint);font-weight:800}
.chapter-select{width:100%;margin-top:10px;background:#111a2e;border:1px solid var(--line2);color:var(--text);border-radius:9px;padding:10px 11px;font-weight:800;outline:none}
.chapter-select:focus{border-color:var(--accent)}
.topic-btn{width:100%;margin-top:10px;border:1px solid var(--line);background:#131d32;color:var(--muted);border-radius:9px;padding:11px;text-align:left}
.topic-btn.active{border-color:rgba(33,199,168,.65);color:var(--text);background:rgba(33,199,168,.11)}
.topic-title{font-weight:800;font-size:.92rem}.topic-small{display:block;color:var(--faint);font-size:.72rem;margin-top:4px;line-height:1.4}
.topic-tree{flex:1;min-height:0;max-height:calc(100vh - 260px);margin-top:10px;display:grid;align-content:start;gap:8px;overflow-y:auto;overflow-x:hidden;padding-right:8px;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:#526178 #0b1020}
.topic-tree::-webkit-scrollbar,.topic-group::-webkit-scrollbar,.content::-webkit-scrollbar,.schema-scroll::-webkit-scrollbar{width:10px}.topic-tree::-webkit-scrollbar-thumb,.topic-group::-webkit-scrollbar-thumb,.content::-webkit-scrollbar-thumb,.schema-scroll::-webkit-scrollbar-thumb{background:#526178;border-radius:999px;border:2px solid #0f172a}.topic-tree::-webkit-scrollbar-track,.topic-group::-webkit-scrollbar-track,.content::-webkit-scrollbar-track,.schema-scroll::-webkit-scrollbar-track{background:#0b1020}
.topic-group{border:1px solid var(--line);background:#111a2e;border-radius:10px;overflow-y:auto;overflow-x:hidden;max-height:100%;scrollbar-width:thin;scrollbar-color:#526178 #0b1020}
.topic-main{position:sticky;top:0;z-index:2;padding:10px 11px;font-weight:800;color:var(--text);background:#131d32;border-bottom:1px solid var(--line)}
.topic-branch{padding:8px 9px 9px;display:grid;gap:5px}
.topic-parent{color:var(--accent);font-weight:800;font-size:.78rem;margin:6px 0 2px}
.topic-leaf{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:8px;padding:7px 8px;text-align:left;font-weight:700;font-size:.78rem}
.topic-leaf:hover{background:#17253d;color:var(--text)}.topic-leaf.active{border-color:rgba(33,199,168,.55);background:rgba(33,199,168,.1);color:var(--text)}
.topic-leaf.depth-2{margin-left:10px}.topic-leaf.depth-3{margin-left:20px}
.tab-list{padding:12px;display:grid;gap:7px;background:#0b1020;border-bottom:1px solid var(--line)}
.tab-btn{border:1px solid transparent;background:transparent;color:var(--muted);border-radius:9px;padding:9px 11px;text-align:left;font-weight:800}
.tab-btn:hover{background:#131d32;color:var(--text)}.tab-btn.active{background:#17253d;border-color:rgba(74,163,255,.5);color:var(--text)}
.schema-panel{display:none}
.main{min-width:0;min-height:0;display:grid;grid-template-rows:auto minmax(0,1fr);background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px),var(--bg);background-size:36px 36px}
.main.home-mode{grid-template-rows:minmax(0,1fr)}.main.home-mode .main-head{display:none}
.main-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);background:rgba(13,20,38,.86)}
h1{margin:0;font-size:1.35rem}.head-sub{color:var(--muted);font-size:.82rem;margin-top:4px}.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.content{min-height:0;overflow:auto;padding:18px}
.section{display:none}.section.active{display:block}
.grid-two{display:grid;grid-template-columns:minmax(0,1fr) minmax(310px,.55fr);gap:16px}
.hero-lab{position:relative;min-height:560px;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:16px;background:#07101f}
.hero-lab::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,16,31,.98) 0%,rgba(7,16,31,.88) 48%,rgba(7,16,31,.22) 100%);z-index:1}
.hero-lab::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(88,166,255,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(88,166,255,.09) 1px,transparent 1px);background-size:42px 42px;z-index:2;opacity:.42}
.hero-photo-bg{position:absolute;right:0;bottom:0;width:48%;height:100%;object-fit:contain;object-position:right bottom;filter:saturate(1.05) contrast(1.04) drop-shadow(0 26px 48px rgba(0,0,0,.55));z-index:0}
.hero-content{position:relative;z-index:3;min-height:560px;padding:44px;display:flex;flex-direction:column;justify-content:center;max-width:820px}
.hero-kicker{color:var(--accent);font-size:.72rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin-bottom:12px}
.hero-title{font-size:clamp(2.5rem,5.8vw,5.8rem);line-height:.94;font-weight:800;letter-spacing:-.04em;margin:0}
.hero-title span{color:var(--accent)}
.hero-copy{color:#c8d4e8;line-height:1.7;max-width:720px;margin:18px 0 0;font-size:1rem}
.hero-detail{color:#aebbd0;line-height:1.65;max-width:720px;margin:12px 0 0;font-size:.93rem}
.hero-chip-row{display:flex;gap:9px;flex-wrap:wrap;margin-top:22px}
.hero-chip{border:1px solid rgba(88,166,255,.32);background:rgba(14,28,52,.72);color:#d9e9ff;border-radius:999px;padding:7px 11px;font-size:.78rem;font-weight:800}
.hero-stats-grid{display:grid;grid-template-columns:repeat(4,minmax(105px,1fr));gap:10px;margin-top:26px;max-width:680px}
.hero-stat{border:1px solid rgba(255,255,255,.09);background:rgba(11,18,34,.7);border-radius:10px;padding:12px}
.hero-stat strong{display:block;color:#fff;font-size:1.05rem}.hero-stat span{display:block;color:var(--muted);font-size:.72rem;margin-top:3px;line-height:1.35}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}.hero-actions a{text-decoration:none}
.hero-code{position:absolute;right:24px;bottom:24px;z-index:3;width:min(390px,38%);border:1px solid rgba(33,199,168,.26);background:rgba(5,10,18,.78);backdrop-filter:blur(10px);border-radius:12px;padding:14px;font-family:"JetBrains Mono",monospace;color:#d6e7ff;font-size:.72rem;line-height:1.55}
.hero-code .green{color:var(--accent)}.hero-code .blue{color:var(--accent2)}.hero-code .muted{color:var(--faint)}
.card{border:1px solid var(--line);background:rgba(17,24,39,.96);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;border-bottom:1px solid var(--line);background:#111a2e;font-weight:800}
.card-b{padding:15px}.card-b p,.card-b li{color:var(--muted);line-height:1.72;font-size:.93rem}.card-b strong{color:var(--text)}
.mentor{border:1px solid rgba(33,199,168,.22);background:rgba(33,199,168,.08);border-radius:10px;padding:13px 14px;color:#c9fff3;line-height:1.65;font-size:.9rem;margin-top:12px}
.concept-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.concept{border:1px solid var(--line);background:#0b1222;border-radius:10px;padding:13px}
.concept h3{margin:0 0 8px;font-size:.94rem}.concept p{margin:0;color:var(--muted);line-height:1.55;font-size:.86rem}
pre{margin:0;background:var(--code);border:1px solid var(--line);border-radius:10px;color:#e6edf3;padding:14px;overflow:auto;font-family:"JetBrains Mono",monospace;font-size:.79rem;line-height:1.6;white-space:pre-wrap}
.example-grid{display:grid;gap:14px}
.practice-layout{display:grid;grid-template-columns:300px minmax(480px,1fr) var(--schema-w);gap:16px;min-height:calc(100vh - 132px)}
.q-list{min-height:0;overflow:auto;border:1px solid var(--line);background:#10192b;border-radius:12px;padding:10px}
.q-filter{width:100%;background:#0b1222;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px;margin-bottom:10px;outline:none}
.q-btn{width:100%;border:1px solid transparent;background:transparent;color:var(--muted);border-radius:9px;padding:10px;margin-bottom:7px;text-align:left}
.q-btn:hover{background:#131d32;color:var(--text)}.q-btn.active{background:#17253d;border-color:rgba(74,163,255,.5);color:var(--text)}
.q-top{display:flex;align-items:center;gap:7px;margin-bottom:6px}.q-title{font-weight:800;font-size:.84rem;line-height:1.35}.q-desc{font-size:.72rem;color:var(--faint);line-height:1.4}
.tag{display:inline-flex;align-items:center;border:1px solid var(--line2);border-radius:999px;padding:2px 7px;font-size:.64rem;color:var(--muted);white-space:nowrap}
.tag.easy{color:var(--ok);border-color:rgba(49,208,125,.35)}.tag.medium{color:var(--warn);border-color:rgba(242,184,75,.38)}.tag.hard{color:var(--danger);border-color:rgba(255,107,107,.38)}.tag.done{color:var(--accent);border-color:rgba(33,199,168,.45)}
.solve-pane{min-height:0;border:1px solid var(--line);background:rgba(17,24,39,.96);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-rows:auto minmax(0,1fr)}
.question-area{min-height:0;overflow:auto;padding:15px}.prompt{color:var(--text);line-height:1.72;font-size:.98rem}.hint{border:1px solid var(--line);background:#0b1222;border-radius:9px;padding:10px;color:var(--muted);font-size:.85rem;line-height:1.55;margin-top:10px}
.editor-area{min-height:0;display:grid;grid-template-rows:auto minmax(360px,.95fr) minmax(280px,1fr);border-top:1px solid var(--line)}
.editor-head,.result-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 13px;border-bottom:1px solid var(--line);background:#111a2e;font-weight:800}
.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line2);color:var(--text);background:#162238;border-radius:8px;padding:8px 11px;font-size:.8rem;font-weight:800}.btn:hover{border-color:var(--accent2)}.btn.primary{background:linear-gradient(135deg,var(--accent),#62d68f);color:#06111f;border-color:transparent}.btn.ghost{background:transparent;color:var(--muted)}.btn.warn{border-color:rgba(242,184,75,.5);color:#ffd78d;background:rgba(242,184,75,.08)}
.sql-editor-wrap{position:relative;min-height:0;background:#070d18;display:grid;grid-template-rows:minmax(0,1fr) auto}
.sql-editor{width:100%;height:100%;min-height:360px;border:0;outline:0;background:#070d18}
.editor-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 12px;border-top:1px solid var(--line);background:#0b1222;color:var(--muted);font-size:.74rem}
.editor-status .status-ok{color:var(--ok)}.editor-status .status-warn{color:var(--warn)}.editor-status .status-err{color:var(--danger)}
.query-running-line{background:rgba(33,199,168,.16);border-left:3px solid var(--accent)}
.query-running-glyph{background:var(--accent);width:7px!important;margin-left:4px;border-radius:999px}
.result-body{min-height:0;overflow:hidden;background:#0b1222;display:flex;flex-direction:column}.result-msg{padding:11px 13px;font-family:"JetBrains Mono",monospace;font-size:.78rem;border-bottom:1px solid var(--line)}.result-msg.ok{color:var(--ok)}.result-msg.err{color:var(--danger)}
.result-msg.check-ok{color:var(--ok);background:rgba(49,208,125,.08)}
.result-msg.check-warn{color:var(--warn);background:rgba(242,184,75,.08)}
.check-detail{padding:10px 13px;color:var(--muted);font-size:.82rem;line-height:1.55;border-bottom:1px solid var(--line)}
.result-tools{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);background:#0f172a;flex-wrap:wrap}
.result-tools .meta{color:var(--muted);font-size:.78rem}.result-tools .actions{gap:6px}
.result-grid-wrap{min-height:0;overflow:auto;flex:1}.result-grid th{resize:horizontal;overflow:auto;user-select:none;cursor:pointer}.result-grid td{cursor:copy}.result-grid tr:nth-child(even) td{background:rgba(255,255,255,.015)}
.pager{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.78rem}.pager button{padding:5px 8px}
.copy-flash{background:rgba(33,199,168,.18)!important}
.solution{display:none;border-top:1px solid var(--line);background:#10192b;padding:13px;max-height:260px;overflow:auto}.solution.show{display:block}.solution p{color:var(--muted);line-height:1.6;font-size:.86rem}
.schema-workspace{position:sticky;top:16px;height:calc(100vh - 154px);min-height:0;border:1px solid var(--line);background:rgba(17,24,39,.96);border-radius:12px;box-shadow:var(--shadow);overflow:visible;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.schema-workspace-inner{min-height:0;overflow:hidden;display:grid;grid-template-rows:auto auto minmax(0,1fr);border-radius:12px;height:100%}
.schema-resizer{position:absolute;left:-6px;top:0;width:12px;height:100%;cursor:col-resize;z-index:12}
.schema-resizer:hover{background:rgba(88,166,255,.18)}
.schema-workspace .schema-scroll{min-height:0;overflow:auto;padding:12px}
.schema-note{color:var(--muted);font-size:.78rem;line-height:1.5;padding:10px 12px;border-bottom:1px solid var(--line);background:#111a2e}
.schema-mini{border:1px solid var(--line);background:#0b1222;border-radius:10px;padding:12px;margin-bottom:10px}
.schema-mini h3{margin:0 0 8px;font-size:.92rem;color:#d9f7ff;font-family:"JetBrains Mono",monospace}
.schema-mini .join-key{display:block;text-align:left;margin-bottom:10px}
.sample-section{border:1px solid var(--line);background:#0b1222;border-radius:10px;margin:0 0 12px;overflow:hidden}
.sample-section h3{margin:0;padding:10px 11px;border-bottom:1px solid var(--line);font-size:.86rem;color:#d9f7ff;background:#10192b}
.sample-section .empty{padding:12px}
.column-grid{display:flex;flex-wrap:wrap;gap:7px}
.error-help{border-top:1px solid var(--line);padding:13px;background:rgba(242,184,75,.08);color:#ffe1a3;line-height:1.65;font-size:.86rem}
.error-help strong{color:#fff}
.table-card{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#0c1323;margin-bottom:12px}.table-head{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:10px 11px;border-bottom:1px solid var(--line)}.table-name{font-family:"JetBrains Mono",monospace;font-weight:800;font-size:.84rem;color:#d9f7ff}.join-key{font-size:.68rem;color:var(--accent);text-align:right}
.cols{display:flex;flex-wrap:wrap;gap:6px;padding:10px 11px;border-bottom:1px solid var(--line)}.col{font-family:"JetBrains Mono",monospace;font-size:.68rem;color:#bcd0e6;background:#141f33;border:1px solid var(--line);padding:4px 7px;border-radius:999px}
.sample-wrap{overflow:auto;max-height:210px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid rgba(38,52,79,.75);padding:7px 9px;font-family:"JetBrains Mono",monospace;font-size:.7rem;white-space:nowrap}th{color:var(--accent2);background:#121d31;position:sticky;top:0}td{color:#c2ccda}
.link-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.link-card{display:block;border:1px solid var(--line);background:#10192b;border-radius:10px;padding:15px;text-decoration:none}.link-card:hover{border-color:var(--accent2);background:#14203a}.link-card h3{margin:0;font-size:.98rem}.link-card p{margin:0;color:var(--muted);font-size:.84rem;line-height:1.55}.source{color:var(--accent);font-size:.72rem;font-weight:800;margin-top:10px}
.empty{padding:18px;color:var(--muted);line-height:1.6}.toast{position:fixed;right:18px;bottom:18px;border:1px solid var(--line2);background:#111a2e;color:var(--text);padding:11px 13px;border-radius:9px;box-shadow:var(--shadow);display:none;font-size:.84rem;z-index:20}.toast.show{display:block}
@media(max-width:1180px){body{overflow:auto}.app{height:auto;min-height:100vh;grid-template-columns:1fr;grid-template-rows:auto auto}.sidebar{border-right:0;border-bottom:1px solid var(--line);grid-template-rows:auto auto}.topic-tree{max-height:360px}.grid-two,.practice-layout{grid-template-columns:1fr}.practice-layout{min-height:0}.solve-pane{min-height:880px}.schema-workspace{min-height:620px}.hero-photo-bg{width:54%;opacity:.55}.hero-code{position:relative;right:auto;bottom:auto;width:100%;margin:0 44px 36px;max-width:520px}}
@media(max-width:680px){.topbar,.main-head{height:auto;align-items:flex-start;flex-direction:column}.top-actions{margin-left:0;flex-wrap:wrap}.content{padding:10px}.editor-head,.result-head{align-items:flex-start;flex-direction:column}.hero-lab,.hero-content{min-height:620px}.hero-content{padding:28px}.hero-photo-bg{width:100%;opacity:.28}.hero-stats-grid{grid-template-columns:1fr 1fr}.hero-code{margin:0 24px 24px;width:auto}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo"><img src="favicon.ico" alt="SQL Shala"></div>
    <div>
      <div class="brand-title">SQL Shala</div>
      <div class="brand-sub">Your Gateway to SQL Mastery</div>
    </div>
    <div class="top-actions">
      <span class="pill" id="progressPill">0 attempted</span>
      <button class="btn ghost" id="resetBtn" type="button">Reset Progress</button>
      <span class="pill" id="dbPill"><span class="dot loading"></span><span>DB loading</span></span>
    </div>
  </header>
  <aside class="sidebar">
    <div class="sidebar-resizer" id="sidebarResizer" title="Drag to resize sidebar"></div>
    <div class="tab-list">
      <button class="tab-btn active" data-tab="home">1. Home</button>
      <button class="tab-btn" data-tab="explanation">2. Explanation</button>
      <button class="tab-btn" data-tab="practice">3. Practice Questions</button>
      <button class="tab-btn" data-tab="interview">4. Interview Practical Questions</button>
    </div>
    <div class="side-section">
      <div class="label">Uploaded Topics Only</div>
      <select class="chapter-select" id="chapterSelect" aria-label="Choose chapter"></select>
      <div class="topic-tree" id="topicTree"></div>
    </div>
    <div class="schema-panel" id="schemaPanel"></div>
  </aside>
  <main class="main">
    <div class="main-head">
      <div>
        <h1 id="pageTitle">INNER Join</h1>
        <div class="head-sub" id="pageSub">Learn first, see examples, then solve.</div>
      </div>
      <div class="head-actions">
        <button class="btn ghost" id="prevQ">Previous Q</button>
        <button class="btn ghost" id="nextQ">Next Q</button>
      </div>
    </div>
    <div class="content">
      <section class="section active" id="homeSection"></section>
      <section class="section" id="explanationSection"></section>
      <section class="section" id="practiceSection"></section>

const TOPIC = {
  joins:{
    title:"JOINs",
    sub:"JOINs combine tables horizontally: more columns side by side.",
    tables:["Customers","Orders","Products","Employees"],
    explanation:[
      {h:"What is a JOIN?",p:"A JOIN is a SQL operation that links related rows from two or more tables using a common key column. In a relational database, data is spread across multiple tables to avoid duplication — Orders stores IDs, while Customers, Products, and Employees store the readable details behind those IDs. JOINs bring this data back together so you can write meaningful business reports, dashboards, and analyses."},
      {h:"Why do we need JOINs?",p:"Without JOINs, you can only query one table at a time. With JOINs, you can combine Orders with Customers to see who bought what, add Products to see what was sold, and add Employees to see who closed the deal — all in a single query."},
      {h:"Core dataset links in this lab",p:"Orders.CustomerID links to Customers.CustomerID. Orders.ProductID links to Products.ProductID. Orders.SalesPersonID links to Employees.EmployeeID. Employees.ManagerID links back to Employees.EmployeeID for self joins."},
      {h:"How to choose the right JOIN",p:"Use INNER JOIN when only matching rows matter. Use LEFT JOIN when the left table is your main list and you want to keep all its rows even if there is no match on the right. Use ANTI JOIN (LEFT JOIN + WHERE right key IS NULL) to find missing relationships. Use CROSS JOIN to generate every possible combination."},
      {h:"Friendly rule",p:"Ask yourself: Which table must not lose rows? Put that table on the left and usually use LEFT JOIN. If both sides must match, use INNER JOIN."}
    ],
    concepts:[
      ["INNER JOIN","Returns only rows that have a match in BOTH tables.\n\nSyntax:\nSELECT c.CustomerID, c.FirstName, o.OrderID\nFROM Customers c\nINNER JOIN Orders o ON c.CustomerID = o.CustomerID;\n\nExample result: Only customers who have placed at least one order appear. Customers with no orders are excluded."],
      ["LEFT JOIN","Returns ALL rows from the left table, plus matching rows from the right table. Where there is no match, right-side columns show NULL.\n\nSyntax:\nSELECT c.CustomerID, c.FirstName, o.OrderID\nFROM Customers c\nLEFT JOIN Orders o ON c.CustomerID = o.CustomerID;\n\nExample result: All 5 customers appear. Customers with no orders show NULL in OrderID."],
      ["RIGHT JOIN","Returns ALL rows from the right table, plus matching rows from the left. Where there is no match, left-side columns show NULL. Note: SQLite does not support RIGHT JOIN natively — simulate it by swapping the table order and using LEFT JOIN.\n\nSyntax (standard SQL):\nSELECT c.CustomerID, o.OrderID\nFROM Customers c\nRIGHT JOIN Orders o ON c.CustomerID = o.CustomerID;\n\nSQLite equivalent:\nSELECT c.CustomerID, o.OrderID\nFROM Orders o\nLEFT JOIN Customers c ON o.CustomerID = c.CustomerID;\n\nExample result: All orders appear. Orders with no matching customer show NULL."],
      ["FULL JOIN","Returns ALL rows from BOTH tables. Where there is no match on either side, the missing columns show NULL. SQLite does not support FULL JOIN — simulate with LEFT JOIN + UNION ALL + anti-join.\n\nSyntax (standard SQL):\nSELECT c.CustomerID, o.OrderID\nFROM Customers c\nFULL JOIN Orders o ON c.CustomerID = o.CustomerID;\n\nSQLite equivalent: combine LEFT JOIN results with a right-side anti-join using UNION ALL.\n\nExample result: All customers and all orders appear. Unmatched rows on either side show NULL."],
      ["ANTI JOIN","Finds rows in the left table that have NO match in the right table. Written as LEFT JOIN + WHERE right key IS NULL.\n\nSyntax:\nSELECT c.CustomerID, c.FirstName\nFROM Customers c\nLEFT JOIN Orders o ON c.CustomerID = o.CustomerID\nWHERE o.CustomerID IS NULL;\n\nExample result: Only customers who have never placed an order are returned."],
      ["CROSS JOIN","Generates every possible combination of rows from both tables. 5 customers × 5 products = 25 rows.\n\nSyntax:\nSELECT c.FirstName, p.Product\nFROM Customers c\nCROSS JOIN Products p;\n\nExample result: 25 rows showing every customer paired with every product — useful for promotion planning grids."],
      ["SELF JOIN","Joins a table to itself using two aliases. Used for hierarchical data like employee-manager relationships.\n\nSyntax:\nSELECT e.FirstName AS Employee, m.FirstName AS Manager\nFROM Employees e\nLEFT JOIN Employees m ON e.ManagerID = m.EmployeeID;\n\nExample result: Each employee is shown alongside their manager's name. Top-level employees with no manager show NULL."]
    ],
    examples:[
      {title:"INNER JOIN - valid customer orders",sql:"SELECT c.CustomerID, c.FirstName, c.LastName, o.OrderID, o.Sales\nFROM Customers AS c\nINNER JOIN Orders AS o\n  ON c.CustomerID = o.CustomerID;"},
      {title:"LEFT JOIN - all customers including no orders",sql:"SELECT c.CustomerID, c.FirstName, c.LastName, o.OrderID, o.Sales\nFROM Customers AS c\nLEFT JOIN Orders AS o\n  ON c.CustomerID = o.CustomerID;"},
      {title:"RIGHT JOIN idea - preserve all orders in SQLite",sql:"SELECT c.CustomerID, c.FirstName, o.OrderID, o.CustomerID AS OrderCustomerID, o.Sales\nFROM Orders AS o\nLEFT JOIN Customers AS c\n  ON o.CustomerID = c.CustomerID;"},
      {title:"FULL JOIN idea - full audit using UNION ALL",sql:"SELECT c.CustomerID, c.FirstName, o.OrderID, o.Sales, 'Customer side' AS SourceSide\nFROM Customers AS c\nLEFT JOIN Orders AS o\n  ON c.CustomerID = o.CustomerID\nUNION ALL\nSELECT o.CustomerID, NULL, o.OrderID, o.Sales, 'Order side orphan' AS SourceSide\nFROM Orders AS o\nLEFT JOIN Customers AS c\n  ON o.CustomerID = c.CustomerID\nWHERE c.CustomerID IS NULL;"},
      {title:"LEFT ANTI JOIN - customers with no orders",sql:"SELECT c.CustomerID, c.FirstName, c.LastName, c.Country\nFROM Customers AS c\nLEFT JOIN Orders AS o\n  ON c.CustomerID = o.CustomerID\nWHERE o.CustomerID IS NULL;"},
      {title:"SELF JOIN - employee and manager",sql:"SELECT\n  e.FirstName || ' ' || COALESCE(e.LastName, '') AS EmployeeName,\n  COALESCE(m.FirstName || ' ' || COALESCE(m.LastName, ''), 'No Manager') AS ManagerName\nFROM Employees AS e\nLEFT JOIN Employees AS m\n  ON e.ManagerID = m.EmployeeID;"},
      {title:"CROSS JOIN - promotion grid",sql:"SELECT c.CustomerID, c.FirstName, p.ProductID, p.Product\nFROM Customers AS c\nCROSS JOIN Products AS p;"},
      {title:"NON-EQUI SELF JOIN - salary comparison",sql:"SELECT high.FirstName AS HighEarner, high.Salary AS HighSalary,\n       low.FirstName AS LowerEarner, low.Salary AS LowerSalary,\n       high.Department\nFROM Employees AS high\nINNER JOIN Employees AS low\n  ON high.Department = low.Department\n AND high.Salary > low.Salary;"},
      {title:"MULTI-TABLE JOIN - executive order view",sql:"SELECT o.OrderID, o.OrderDate, c.FirstName AS CustomerFirstName,\n       p.Product AS ProductName, e.FirstName AS SalespersonFirstName, o.Sales\nFROM Orders AS o\nLEFT JOIN Customers AS c ON o.CustomerID = c.CustomerID\nLEFT JOIN Products AS p ON o.ProductID = p.ProductID\nLEFT JOIN Employees AS e ON o.SalesPersonID = e.EmployeeID;"}
    ]
  },
  sets:{
    title:"SET Operators",
    sub:"SET Operators combine result sets vertically: more rows stacked together.",
    tables:["Customers","Employees","Orders","OrdersArchive","Products"],
    explanation:[
      {h:"What are SET Operators?",p:"SET Operators are SQL commands that combine the results of two or more SELECT queries into a single result set by stacking rows vertically. While JOINs add more columns side by side (horizontal combining), SET Operators add more rows on top of each other (vertical combining). Think of it as stacking spreadsheets."},
      {h:"Why do we need SET Operators?",p:"SET Operators let you merge data from multiple tables or queries without requiring shared key columns. They are ideal for comparing lists (who is in both tables?), finding differences (what changed between periods?), and building full audit reports (show all records from past and present)."},
      {h:"Golden rules — every SET query must follow these",p:"1. Each SELECT must return the same number of columns. 2. Columns must be in the same order and have compatible data types. 3. Column names in the final result come from the FIRST SELECT only. 4. ORDER BY appears only once — at the very end of the full query."},
      {h:"How to choose the right SET Operator",p:"Use UNION to merge and remove exact duplicates. Use UNION ALL to merge and keep all rows including duplicates (faster). Use EXCEPT to find rows in query 1 that are NOT in query 2. Use INTERSECT to find rows that appear in BOTH queries."},
      {h:"Friendly rule",p:"If you are comparing two lists, think SET Operators. If you need extra columns from related tables, use EXCEPT or INTERSECT to find the matching IDs first, then JOIN back to the main table for the full details."}
    ],
    concepts:[
      ["UNION","Combines results from two queries and removes exact duplicate rows. Both queries must have the same number of columns.\n\nSyntax:\nSELECT FirstName, LastName FROM Customers\nUNION\nSELECT FirstName, LastName FROM Employees;\n\nExample result: A distinct list of all unique names across both tables. If Kevin Brown appears in both, he appears only once."],
      ["UNION ALL","Combines results and keeps ALL rows including exact duplicates. Faster than UNION because no deduplication step.\n\nSyntax:\nSELECT 'Customer' AS Source, FirstName, LastName FROM Customers\nUNION ALL\nSELECT 'Employee' AS Source, FirstName, LastName FROM Employees;\n\nExample result: All rows from both tables appear. If Kevin Brown is in both, he appears twice — once as Customer, once as Employee."],
      ["EXCEPT","Returns rows from the FIRST query that do NOT appear in the second query. Direction matters — switching the query order gives a different answer.\n\nSyntax:\nSELECT FirstName, LastName FROM Employees\nEXCEPT\nSELECT FirstName, LastName FROM Customers;\n\nExample result: Names that are in Employees but NOT in Customers — employees who are not also customers."],
      ["INTERSECT","Returns only rows that appear in BOTH queries. Think of it as finding the overlap between two lists.\n\nSyntax:\nSELECT FirstName, LastName FROM Employees\nINTERSECT\nSELECT FirstName, LastName FROM Customers;\n\nExample result: Names that exist in both tables — people who are both an employee and a customer."],
      ["ORDER BY rule","Only one ORDER BY is allowed per SET query, and it must appear at the very end after all UNION / UNION ALL / EXCEPT / INTERSECT clauses.\n\nCorrect:\nSELECT FirstName FROM Customers\nUNION\nSELECT FirstName FROM Employees\nORDER BY FirstName;\n\nWrong: Putting ORDER BY inside individual SELECT blocks will cause a syntax error."],
      ["Enrichment pattern","Use EXCEPT or INTERSECT to identify the matching IDs, then JOIN back to get full details like names, addresses, or revenue.\n\nExample:\nSELECT p.ProductID, p.Product, p.Price\nFROM Products p\nINNER JOIN (\n  SELECT ProductID FROM Products\n  EXCEPT\n  SELECT ProductID FROM Orders\n) missing ON p.ProductID = missing.ProductID;\n\nThis finds products never ordered, then joins back to Products to show the full details."]
    ],
    examples:[
      {title:"UNION - distinct people",sql:"SELECT FirstName, LastName FROM Customers\nUNION\nSELECT FirstName, LastName FROM Employees\nORDER BY LastName, FirstName;"},
      {title:"UNION ALL - keep duplicate people with source",sql:"SELECT 'Customer' AS SourceTable, FirstName, LastName FROM Customers\nUNION ALL\nSELECT 'Employee' AS SourceTable, FirstName, LastName FROM Employees;"},
      {title:"EXCEPT - employees who are not customers",sql:"SELECT FirstName, LastName FROM Employees\nEXCEPT\nSELECT FirstName, LastName FROM Customers;"},
      {title:"INTERSECT - people in both tables",sql:"SELECT FirstName, LastName FROM Employees\nINTERSECT\nSELECT FirstName, LastName FROM Customers;"},
      {title:"UNION ALL + GROUP BY - revenue by source",sql:"SELECT SourceTable, SUM(Sales) AS TotalRevenue\nFROM (\n  SELECT 'Orders' AS SourceTable, Sales FROM Orders\n  UNION ALL\n  SELECT 'Archive' AS SourceTable, Sales FROM OrdersArchive\n) AS all_orders\nGROUP BY SourceTable;"},
      {title:"EXCEPT + JOIN - products never ordered",sql:"SELECT p.ProductID, p.Product, p.Category, p.Price\nFROM Products AS p\nINNER JOIN (\n  SELECT ProductID FROM Products\n  EXCEPT\n  SELECT ProductID FROM Orders\n) AS missing\n  ON p.ProductID = missing.ProductID;"},
      {title:"INTERSECT + JOIN - loyal customers in both periods",sql:"SELECT c.CustomerID, c.FirstName, c.LastName, c.Country\nFROM Customers AS c\nINNER JOIN (\n  SELECT CustomerID FROM Orders\n  INTERSECT\n  SELECT CustomerID FROM OrdersArchive\n) AS loyal\n  ON c.CustomerID = loyal.CustomerID;"}
    ]
  }
};

function addTopic(id,title,main,summary,sql,tables,difficulty="Easy"){
  TOPIC[id]={title,sub:`${main}: ${summary}`,tables,explanation:[
    {h:`What is ${title}?`,p:summary},
    {h:"How it works",p:"Read the output requirement first, identify the table grain, then write SQL that returns the same column order shown in Sample Output. The examples are adapted from your notes for this local SQLite practice database."},
    {h:"When to use it",p:"Use this pattern when the question asks for the same business idea described in the lesson. Keep aliases clear, avoid SELECT *, and add ORDER BY when the expected output depends on row order."}
  ],concepts:[[title,`${summary}\n\nExample:\n${sql}`]],examples:[{title,sql}]};
  const qid=`${id}-01`;
  PRACTICE.push({id:qid,topic:id,difficulty,title:`${title} Practice`,prompt:`Write a query for ${title}. Use the Sample Output panel to understand the exact columns and column order expected.`,tables,solutionSql:sql,starterSql:""});
  INTERVIEW_LINKS[id]=INTERVIEW_LINKS[main==="Combining Data"?(id.includes("union")||id.includes("except")||id.includes("intersect")?"sets":"joins"):"joins"]||INTERVIEW_LINKS.joins;
}

const EXTRA_PRACTICE = [{"topic":"inner-join","difficulty":"Easy","title":"Retrieve all orders along with the customer's first name and last name","prompt":"Retrieve all orders along with the customer's first name and last name.","tables":["Customers","Orders"],"solutionSql":"SELECT o.OrderID, c.FirstName, c.LastName, o.OrderDate, o.Sales\nFROM Orders o\nINNER JOIN Customers c ON o.CustomerID = c.CustomerID","starterSql":"","id":"inner-join-02"},{"topic":"inner-join","difficulty":"Easy","title":"Show each order with the product name and category","prompt":"Show each order with the product name and category.","tables":["Products","Orders"],"solutionSql":"SELECT o.OrderID, p.Product, p.Category, o.Quantity, o.Sales\nFROM Orders o\nINNER JOIN Products p ON o.ProductID = p.ProductID","starterSql":"","id":"inner-join-03"},{"topic":"inner-join","difficulty":"Medium","title":"Get all orders with customer name, product name, and salesperson name","prompt":"Get all orders with customer name, product name, and salesperson name.","tables":["Customers","Employees","Products","Orders"],"solutionSql":"SELECT o.OrderID, \n       c.FirstName || ' ' || c.LastName AS CustomerName,\n       p.Product,\n       e.FirstName || ' ' || e.LastName AS SalesPersonName,\n       o.Sales\nFROM Orders o\nINNER JOIN Customers c  ON o.CustomerID    = c.CustomerID\nINNER JOIN Products  p  ON o.ProductID     = p.ProductID\nINNER JOIN Employees e  ON o.SalesPersonID = e.EmployeeID","starterSql":"","id":"inner-join-04"},{"topic":"inner-join","difficulty":"Medium","title":"Find the total sales amount per customer using INNER JOIN","prompt":"Find the total sales amount per customer using INNER JOIN.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName, SUM(o.Sales) AS TotalSales\nFROM Customers c\nINNER JOIN Orders o ON c.CustomerID = o.CustomerID\nGROUP BY c.CustomerID, c.FirstName, c.LastName\nORDER BY TotalSales DESC","starterSql":"","id":"inner-join-05"},{"topic":"inner-join","difficulty":"Medium","title":"List all orders for products in the 'Clothing' category with customer details","prompt":"List all orders for products in the 'Clothing' category with customer details.","tables":["Customers","Products","Orders"],"solutionSql":"SELECT o.OrderID, c.FirstName, c.LastName, p.Product, p.Category, o.Sales\nFROM Orders o\nINNER JOIN Customers c ON o.CustomerID = c.CustomerID\nINNER JOIN Products  p ON o.ProductID  = p.ProductID\nWHERE p.Category = 'Clothing'","starterSql":"","id":"inner-join-06"},{"topic":"inner-join","difficulty":"Medium","title":"Show orders placed in January 2025 with customer and product details","prompt":"Show orders placed in January 2025 with customer and product details.","tables":["Customers","Products","Orders"],"solutionSql":"SELECT o.OrderID, c.FirstName, c.LastName, p.Product, o.OrderDate, o.Sales\nFROM Orders o\nINNER JOIN Customers c ON o.CustomerID = c.CustomerID\nINNER JOIN Products  p ON o.ProductID  = p.ProductID\nWHERE o.OrderDate >= '2025-01-01' AND o.OrderDate < '2025-02-01'","starterSql":"","id":"inner-join-07"},{"topic":"inner-join","difficulty":"Hard","title":"Find customers who ordered more than 1 distinct product using INNER JOIN and GROUP BY + HA","prompt":"Find customers who ordered more than 1 distinct product using INNER JOIN and GROUP BY + HAVING.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName,\n       COUNT(DISTINCT o.ProductID) AS DistinctProducts\nFROM Customers c\nINNER JOIN Orders o ON c.CustomerID = o.CustomerID\nGROUP BY c.CustomerID, c.FirstName, c.LastName\nHAVING COUNT(DISTINCT o.ProductID) > 1\nORDER BY DistinctProducts DESC","starterSql":"","id":"inner-join-08"},{"topic":"inner-join","difficulty":"Hard","title":"Show employees who acted as salespersons and their total sales amount, ranked by sales","prompt":"Show employees who acted as salespersons and their total sales amount, ranked by sales.","tables":["Employees","Orders"],"solutionSql":"SELECT e.EmployeeID, e.FirstName, e.LastName, e.Department,\n       COUNT(o.OrderID)  AS TotalOrders,\n       SUM(o.Sales)      AS TotalSales\nFROM Employees e\nINNER JOIN Orders o ON e.EmployeeID = o.SalesPersonID\nGROUP BY e.EmployeeID, e.FirstName, e.LastName, e.Department\nORDER BY TotalSales DESC","starterSql":"","id":"inner-join-09"},{"topic":"inner-join","difficulty":"Hard","title":"Find the highest-selling product per category using INNER JOIN with subquery","prompt":"Find the highest-selling product per category using INNER JOIN with subquery.","tables":["Products","Orders"],"solutionSql":"SELECT p.Category, p.Product, SUM(o.Sales) AS TotalSales\nFROM Products p\nINNER JOIN Orders o ON p.ProductID = o.ProductID\nGROUP BY p.Category, p.Product\nHAVING SUM(o.Sales) = (\n    SELECT MAX(sub.TotalSales)\n    FROM (\n        SELECT p2.Category, SUM(o2.Sales) AS TotalSales\n        FROM Products p2\n        INNER JOIN Orders o2 ON p2.ProductID = o2.ProductID\n        GROUP BY p2.Category, p2.Product\n    ) sub\n    WHERE sub.Category = p.Category\n)","starterSql":"","id":"inner-join-10"},{"topic":"inner-join","difficulty":"Hard","title":"Display each order with a running total of sales per customer using INNER JOIN","prompt":"Display each order with a running total of sales per customer using INNER JOIN.","tables":["Customers","Orders"],"solutionSql":"SELECT o.OrderID, c.FirstName, c.LastName, o.OrderDate, o.Sales,\n       SUM(o.Sales) OVER (PARTITION BY c.CustomerID ORDER BY o.OrderDate, o.OrderID) AS RunningTotal\nFROM Orders o\nINNER JOIN Customers c ON o.CustomerID = c.CustomerID\nORDER BY c.CustomerID, o.OrderDate, o.OrderID","starterSql":"","id":"inner-join-11"},{"topic":"left-join","difficulty":"Easy","title":"List all customers and their orders (include customers who have no orders)","prompt":"List all customers and their orders (include customers who have no orders).","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName, o.OrderID, o.Sales\nFROM Customers c\nLEFT JOIN Orders o ON c.CustomerID = o.CustomerID\nORDER BY c.CustomerID","starterSql":"","id":"left-join-02"},{"topic":"left-join","difficulty":"Easy","title":"Show all products and their orders (include products that were never ordered)","prompt":"Show all products and their orders (include products that were never ordered).","tables":["Products","Orders"],"solutionSql":"SELECT p.ProductID, p.Product, p.Category, o.OrderID, o.OrderDate\nFROM Products p\nLEFT JOIN Orders o ON p.ProductID = o.ProductID\nORDER BY p.ProductID","starterSql":"","id":"left-join-03"},{"topic":"left-join","difficulty":"Medium","title":"Find customers who have NOT placed any orders","prompt":"Find customers who have NOT placed any orders.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName, c.Country\nFROM Customers c\nLEFT JOIN Orders o ON c.CustomerID = o.CustomerID\nWHERE o.OrderID IS NULL","starterSql":"","id":"left-join-04"},{"topic":"left-join","difficulty":"Medium","title":"Show all employees and the orders they sold (including those who made no sales)","prompt":"Show all employees and the orders they sold (including those who made no sales).","tables":["Employees","Orders"],"solutionSql":"SELECT e.EmployeeID, e.FirstName, e.LastName, e.Department,\n       o.OrderID, o.Sales, o.OrderDate\nFROM Employees e\nLEFT JOIN Orders o ON e.EmployeeID = o.SalesPersonID\nORDER BY e.EmployeeID","starterSql":"","id":"left-join-05"},{"topic":"left-join","difficulty":"Medium","title":"List all customers with their total sales (show 0 for customers with no orders)","prompt":"List all customers with their total sales (show 0 for customers with no orders).","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName,\n       COALESCE(SUM(o.Sales), 0) AS TotalSales\nFROM Customers c\nLEFT JOIN Orders o ON c.CustomerID = o.CustomerID\nGROUP BY c.CustomerID, c.FirstName, c.LastName\nORDER BY TotalSales DESC","starterSql":"","id":"left-join-06"},{"topic":"left-join","difficulty":"Medium","title":"Show all customers with their most recent order date using LEFT JOIN","prompt":"Show all customers with their most recent order date using LEFT JOIN.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName,\n       MAX(o.OrderDate) AS LastOrderDate\nFROM Customers c\nLEFT JOIN Orders o ON c.CustomerID = o.CustomerID\nGROUP BY c.CustomerID, c.FirstName, c.LastName\nORDER BY c.CustomerID","starterSql":"","id":"left-join-07"},{"topic":"left-join","difficulty":"Hard","title":"For each customer, show the number of orders, total sales, and average sales using LEFT JO","prompt":"For each customer, show the number of orders, total sales, and average sales using LEFT JOIN (all customers must appear).","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName, c.Country,\n       COUNT(o.OrderID)       AS OrderCount,\n       COALESCE(SUM(o.Sales), 0)   AS TotalSales,\n       COALESCE(AVG(CAST(o.Sales AS DECIMAL(10,2))), 0) AS AvgSales\nFROM Customers c\nLEFT JOIN Orders o ON c.CustomerID = o.CustomerID\nGROUP BY c.CustomerID, c.FirstName, c.LastName, c.Country\nORDER BY TotalSales DESC","starterSql":"","id":"left-join-08"},{"topic":"left-join","difficulty":"Hard","title":"Find products that have never been sold using LEFT JOIN","prompt":"Find products that have never been sold using LEFT JOIN.","tables":["Products","Orders"],"solutionSql":"SELECT p.ProductID, p.Product, p.Category, p.Price\nFROM Products p\nLEFT JOIN Orders o ON p.ProductID = o.ProductID\nWHERE o.OrderID IS NULL","starterSql":"","id":"left-join-09"},{"topic":"left-join","difficulty":"Hard","title":"Show each employee with their manager name using a self LEFT JOIN on Employees","prompt":"Show each employee with their manager name using a self LEFT JOIN on Employees.","tables":["Employees"],"solutionSql":"SELECT e.EmployeeID, e.FirstName AS EmployeeFirstName, e.LastName AS EmployeeLastName,\n       e.Department, e.Salary,\n       m.FirstName AS ManagerFirstName, m.LastName AS ManagerLastName\nFROM Employees e\nLEFT JOIN Employees m ON e.ManagerID = m.EmployeeID\nORDER BY e.EmployeeID","starterSql":"","id":"left-join-10"},{"topic":"left-join","difficulty":"Hard","title":"Show all customers with their orders and product details; customers with no orders and unm","prompt":"Show all customers with their orders and product details; customers with no orders and unmatched products should still appear.","tables":["Customers","Products","Orders"],"solutionSql":"SELECT c.FirstName, c.LastName, \n       o.OrderID, o.OrderDate, o.Sales,\n       p.Product, p.Category\nFROM Customers c\nLEFT JOIN Orders   o ON c.CustomerID = o.CustomerID\nLEFT JOIN Products p ON o.ProductID  = p.ProductID\nORDER BY c.CustomerID, o.OrderDate","starterSql":"","id":"left-join-11"},{"topic":"right-join","difficulty":"Easy","title":"Show all orders and their associated customers (include orders even if customer is missing","prompt":"Show all orders and their associated customers (include orders even if customer is missing).","tables":["Customers","Orders"],"solutionSql":"SELECT o.OrderID, o.OrderDate, o.Sales, c.FirstName, c.LastName\nFROM Customers c\nRIGHT JOIN Orders o ON c.CustomerID = o.CustomerID\nORDER BY o.OrderID","starterSql":"","id":"right-join-02"},{"topic":"right-join","difficulty":"Easy","title":"Show all products and any matching orders (all products must appear on right side)","prompt":"Show all products and any matching orders (all products must appear on right side).","tables":["Products","Orders"],"solutionSql":"SELECT o.OrderID, o.Sales, p.ProductID, p.Product, p.Category\nFROM Orders o\nRIGHT JOIN Products p ON o.ProductID = p.ProductID\nORDER BY p.ProductID","starterSql":"","id":"right-join-03"},{"topic":"right-join","difficulty":"Medium","title":"Find all employees including those who have never sold anything (orders table on left, emp","prompt":"Find all employees including those who have never sold anything (orders table on left, employees on right).","tables":["Employees","Orders"],"solutionSql":"SELECT o.OrderID, o.Sales, o.OrderDate,\n       e.EmployeeID, e.FirstName, e.LastName, e.Department\nFROM Orders o\nRIGHT JOIN Employees e ON o.SalesPersonID = e.EmployeeID\nORDER BY e.EmployeeID","starterSql":"","id":"right-join-04"},{"topic":"right-join","difficulty":"Medium","title":"List the total orders and sales per salesperson (all employees on right side)","prompt":"List the total orders and sales per salesperson (all employees on right side).","tables":["Employees","Orders"],"solutionSql":"SELECT e.EmployeeID, e.FirstName, e.LastName,\n       COUNT(o.OrderID)          AS TotalOrders,\n       COALESCE(SUM(o.Sales), 0) AS TotalSales\nFROM Orders o\nRIGHT JOIN Employees e ON o.SalesPersonID = e.EmployeeID\nGROUP BY e.EmployeeID, e.FirstName, e.LastName\nORDER BY TotalSales DESC","starterSql":"","id":"right-join-05"},{"topic":"right-join","difficulty":"Medium","title":"Show all products and their total quantity sold (include unsold products as 0)","prompt":"Show all products and their total quantity sold (include unsold products as 0).","tables":["Products","Orders"],"solutionSql":"SELECT p.ProductID, p.Product, p.Category,\n       COALESCE(SUM(o.Quantity), 0) AS TotalQuantity,\n       COALESCE(SUM(o.Sales), 0)    AS TotalSales\nFROM Orders o\nRIGHT JOIN Products p ON o.ProductID = p.ProductID\nGROUP BY p.ProductID, p.Product, p.Category\nORDER BY TotalSales DESC","starterSql":"","id":"right-join-06"},{"topic":"right-join","difficulty":"Medium","title":"Using RIGHT JOIN, show all customers and their orders for 'Delivered' orders only","prompt":"Using RIGHT JOIN, show all customers and their orders for 'Delivered' orders only.","tables":["Customers","Orders"],"solutionSql":"SELECT o.OrderID, o.OrderDate, o.OrderStatus, o.Sales,\n       c.CustomerID, c.FirstName, c.LastName\nFROM Orders o\nRIGHT JOIN Customers c ON o.CustomerID = c.CustomerID AND o.OrderStatus = 'Delivered'\nORDER BY c.CustomerID","starterSql":"","id":"right-join-07"},{"topic":"right-join","difficulty":"Hard","title":"For each product, show the max, min, and avg sale using RIGHT JOIN (all products)","prompt":"For each product, show the max, min, and avg sale using RIGHT JOIN (all products).","tables":["Products","Orders"],"solutionSql":"SELECT p.ProductID, p.Product, p.Price,\n       MAX(o.Sales)  AS MaxSale,\n       MIN(o.Sales)  AS MinSale,\n       AVG(CAST(o.Sales AS DECIMAL(10,2))) AS AvgSale\nFROM Orders o\nRIGHT JOIN Products p ON o.ProductID = p.ProductID\nGROUP BY p.ProductID, p.Product, p.Price\nORDER BY p.ProductID","starterSql":"","id":"right-join-08"},{"topic":"right-join","difficulty":"Hard","title":"Show all customers including those without orders along with product details of their orde","prompt":"Show all customers including those without orders along with product details of their orders.","tables":["Customers","Products","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName, c.Country,\n       p.Product, p.Category, o.Sales\nFROM Orders o\nINNER JOIN Products p ON o.ProductID = p.ProductID\nRIGHT JOIN Customers c ON o.CustomerID = c.CustomerID\nORDER BY c.CustomerID","starterSql":"","id":"right-join-09"},{"topic":"right-join","difficulty":"Hard","title":"Identify which employees have never been assigned as a manager (using self RIGHT JOIN)","prompt":"Identify which employees have never been assigned as a manager (using self RIGHT JOIN).","tables":["Employees"],"solutionSql":"SELECT e.EmployeeID, e.FirstName, e.LastName\nFROM Employees mgr\nRIGHT JOIN Employees e ON mgr.ManagerID = e.EmployeeID\nWHERE mgr.ManagerID IS NULL\n  AND NOT EXISTS (SELECT 1 FROM Employees sub WHERE sub.ManagerID = e.EmployeeID);\n-- Alternative: Find employees whose EmployeeID never appears in ManagerID column\nSELECT e.EmployeeID, e.FirstName, e.LastName\nFROM Employees e\nLEFT JOIN Employees sub ON e.EmployeeID = sub.ManagerID\nWHERE sub.ManagerID IS NULL","starterSql":"","id":"right-join-10"},{"topic":"right-join","difficulty":"Hard","title":"RIGHT JOIN orders archive with orders to find archive orders not in current orders","prompt":"RIGHT JOIN orders archive with orders to find archive orders not in current orders.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT oa.OrderID AS ArchiveOrderID, oa.OrderDate AS ArchiveDate,\n       oa.Sales AS ArchiveSales, o.OrderID AS CurrentOrderID\nFROM Orders o\nRIGHT JOIN OrdersArchive oa ON o.OrderID = oa.OrderID AND o.ProductID = oa.ProductID\n                            AND o.CustomerID = oa.CustomerID\nWHERE o.OrderID IS NULL","starterSql":"","id":"right-join-11"},{"topic":"full-join","difficulty":"Easy","title":"Show all customers and all orders, whether or not they match","prompt":"Show all customers and all orders, whether or not they match.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName, o.OrderID, o.Sales\nFROM Customers c\nFULL JOIN Orders o ON c.CustomerID = o.CustomerID\nORDER BY c.CustomerID, o.OrderID","starterSql":"","id":"full-join-02"},{"topic":"full-join","difficulty":"Easy","title":"Show all products and all orders using FULL JOIN","prompt":"Show all products and all orders using FULL JOIN.","tables":["Products","Orders"],"solutionSql":"SELECT p.ProductID, p.Product, o.OrderID, o.OrderDate\nFROM Products p\nFULL JOIN Orders o ON p.ProductID = o.ProductID\nORDER BY p.ProductID, o.OrderID","starterSql":"","id":"full-join-03"},{"topic":"full-join","difficulty":"Medium","title":"Use FULL JOIN between Orders and OrdersArchive and show all combined records","prompt":"Use FULL JOIN between Orders and OrdersArchive and show all combined records.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT COALESCE(o.OrderID, oa.OrderID)   AS OrderID,\n       COALESCE(o.OrderDate, oa.OrderDate) AS OrderDate,\n       COALESCE(o.Sales, oa.Sales)         AS Sales,\n       CASE WHEN o.OrderID IS NOT NULL THEN 'Current' ELSE 'Archive' END AS Source\nFROM Orders o\nFULL JOIN OrdersArchive oa ON o.OrderID = oa.OrderID\n                           AND o.ProductID = oa.ProductID\n                           AND o.CustomerID = oa.CustomerID\nORDER BY OrderID","starterSql":"","id":"full-join-04"},{"topic":"full-join","difficulty":"Medium","title":"Find records that exist in Orders but not in OrdersArchive, and records in OrdersArchive b","prompt":"Find records that exist in Orders but not in OrdersArchive, and records in OrdersArchive but not in Orders.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT 'Only in Orders'   AS Source, o.OrderID, o.ProductID, o.CustomerID, o.Sales\nFROM Orders o\nFULL JOIN OrdersArchive oa ON o.OrderID = oa.OrderID AND o.ProductID = oa.ProductID\nWHERE oa.OrderID IS NULL\nUNION ALL\nSELECT 'Only in Archive'  AS Source, oa.OrderID, oa.ProductID, oa.CustomerID, oa.Sales\nFROM Orders o\nFULL JOIN OrdersArchive oa ON o.OrderID = oa.OrderID AND o.ProductID = oa.ProductID\nWHERE o.OrderID IS NULL","starterSql":"","id":"full-join-05"},{"topic":"full-join","difficulty":"Medium","title":"Show all employees and all customers using FULL JOIN (unrelated tables joined to see combi","prompt":"Show all employees and all customers using FULL JOIN (unrelated tables joined to see combined universe).","tables":["Customers","Employees"],"solutionSql":"SELECT e.EmployeeID, e.FirstName AS EmpFirstName, e.LastName AS EmpLastName,\n       c.CustomerID, c.FirstName AS CustFirstName, c.LastName AS CustLastName\nFROM Employees e\nFULL JOIN Customers c ON e.FirstName = c.FirstName AND e.LastName = c.LastName","starterSql":"","id":"full-join-06"},{"topic":"full-join","difficulty":"Medium","title":"Using FULL JOIN, show each customer's total sales and each product's total sales side by s","prompt":"Using FULL JOIN, show each customer's total sales and each product's total sales side by side.","tables":["Customers","Products","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName,\n       SUM(o.Sales) AS CustomerSales,\n       p.ProductID,  p.Product,\n       SUM(o2.Sales) AS ProductSales\nFROM Customers c\nLEFT JOIN Orders o  ON c.CustomerID = o.CustomerID\nFULL JOIN Products p ON 1=1\nLEFT JOIN Orders o2 ON p.ProductID  = o2.ProductID\nGROUP BY c.CustomerID, c.FirstName, p.ProductID, p.Product;\n-- Note: FULL JOIN across unrelated sets; typically better split into separate queries.","starterSql":"","id":"full-join-07"},{"topic":"full-join","difficulty":"Hard","title":"Using FULL JOIN, detect any orders that have an invalid CustomerID (no matching customer) ","prompt":"Using FULL JOIN, detect any orders that have an invalid CustomerID (no matching customer) or invalid ProductID (no matching product).","tables":["Customers","Products","Orders"],"solutionSql":"SELECT o.OrderID, o.CustomerID, o.ProductID,\n       c.FirstName AS CustomerFound,\n       p.Product   AS ProductFound\nFROM Orders o\nFULL JOIN Customers c ON o.CustomerID = c.CustomerID\nFULL JOIN Products  p ON o.ProductID  = p.ProductID\nWHERE c.CustomerID IS NULL OR p.ProductID IS NULL","starterSql":"","id":"full-join-08"},{"topic":"full-join","difficulty":"Hard","title":"Combine current and archive orders using FULL JOIN and calculate total sales per product","prompt":"Combine current and archive orders using FULL JOIN and calculate total sales per product.","tables":["Products","OrdersArchive","Orders"],"solutionSql":"SELECT COALESCE(p.ProductID, p2.ProductID) AS ProductID,\n       COALESCE(p.Product,   p2.Product)   AS Product,\n       COALESCE(SUM(o.Sales),  0)          AS CurrentSales,\n       COALESCE(SUM(oa.Sales), 0)          AS ArchiveSales,\n       COALESCE(SUM(o.Sales),0) + COALESCE(SUM(oa.Sales),0) AS TotalSales\nFROM Products p\nLEFT JOIN Orders        o  ON p.ProductID  = o.ProductID\nFULL JOIN OrdersArchive oa ON p.ProductID  = oa.ProductID\nLEFT JOIN Products      p2 ON oa.ProductID = p2.ProductID\nGROUP BY COALESCE(p.ProductID, p2.ProductID), COALESCE(p.Product, p2.Product)\nORDER BY TotalSales DESC","starterSql":"","id":"full-join-09"},{"topic":"full-join","difficulty":"Hard","title":"Using FULL JOIN, show each employee and each customer, flagging those who share the same f","prompt":"Using FULL JOIN, show each employee and each customer, flagging those who share the same first name.","tables":["Customers","Employees"],"solutionSql":"SELECT COALESCE(e.FirstName, c.FirstName) AS FirstName,\n       e.EmployeeID, e.LastName AS EmpLastName,  e.Department,\n       c.CustomerID, c.LastName AS CustLastName, c.Country,\n       CASE WHEN e.FirstName = c.FirstName THEN 'Shared Name' ELSE 'Unique' END AS NameFlag\nFROM Employees e\nFULL JOIN Customers c ON e.FirstName = c.FirstName","starterSql":"","id":"full-join-10"},{"topic":"full-join","difficulty":"Hard","title":"FULL JOIN between Customers, Orders, and Products to create a complete data reconciliation","prompt":"FULL JOIN between Customers, Orders, and Products to create a complete data reconciliation report showing what is missing on each side.","tables":["Customers","Products","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName,\n       o.OrderID, o.Sales,\n       p.ProductID, p.Product,\n       CASE\n           WHEN c.CustomerID IS NULL THEN 'Missing Customer'\n           WHEN p.ProductID IS NULL  THEN 'Missing Product'\n           WHEN o.OrderID IS NULL    THEN 'No Orders'\n           ELSE 'Complete'\n       END AS RecordStatus\nFROM Customers c\nFULL JOIN Orders   o ON c.CustomerID = o.CustomerID\nFULL JOIN Products p ON o.ProductID  = p.ProductID\nORDER BY RecordStatus, c.CustomerID","starterSql":"","id":"full-join-11"},{"topic":"left-anti-join","difficulty":"Easy","title":"Find customers who have never placed any order","prompt":"Find customers who have never placed any order.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName, c.Country\nFROM Customers c\nLEFT JOIN Orders o ON c.CustomerID = o.CustomerID\nWHERE o.OrderID IS NULL","starterSql":"","id":"left-anti-join-02"},{"topic":"left-anti-join","difficulty":"Easy","title":"Find products that have never been ordered","prompt":"Find products that have never been ordered.","tables":["Products","Orders"],"solutionSql":"SELECT p.ProductID, p.Product, p.Category, p.Price\nFROM Products p\nLEFT JOIN Orders o ON p.ProductID = o.ProductID\nWHERE o.OrderID IS NULL","starterSql":"","id":"left-anti-join-03"},{"topic":"left-anti-join","difficulty":"Medium","title":"Find employees who have never made a sale (never appear as SalesPersonID in Orders)","prompt":"Find employees who have never made a sale (never appear as SalesPersonID in Orders).","tables":["Employees","Orders"],"solutionSql":"SELECT e.EmployeeID, e.FirstName, e.LastName, e.Department, e.Salary\nFROM Employees e\nLEFT JOIN Orders o ON e.EmployeeID = o.SalesPersonID\nWHERE o.OrderID IS NULL","starterSql":"","id":"left-anti-join-04"},{"topic":"left-anti-join","difficulty":"Medium","title":"Find customers who exist in Customers table but never appeared in OrdersArchive","prompt":"Find customers who exist in Customers table but never appeared in OrdersArchive.","tables":["Customers","OrdersArchive"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName\nFROM Customers c\nLEFT JOIN OrdersArchive oa ON c.CustomerID = oa.CustomerID\nWHERE oa.CustomerID IS NULL","starterSql":"","id":"left-anti-join-05"},{"topic":"left-anti-join","difficulty":"Medium","title":"Find products that were sold in Orders but NOT in OrdersArchive","prompt":"Find products that were sold in Orders but NOT in OrdersArchive.","tables":["Products","OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT p.ProductID, p.Product, p.Category\nFROM Products p\nINNER JOIN Orders o   ON p.ProductID = o.ProductID\nLEFT  JOIN OrdersArchive oa ON p.ProductID = oa.ProductID\nWHERE oa.ProductID IS NULL","starterSql":"","id":"left-anti-join-06"},{"topic":"left-anti-join","difficulty":"Medium","title":"Find customers in Germany who never placed any order","prompt":"Find customers in Germany who never placed any order.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName, c.Country\nFROM Customers c\nLEFT JOIN Orders o ON c.CustomerID = o.CustomerID\nWHERE c.Country = 'Germany'\n  AND o.OrderID IS NULL","starterSql":"","id":"left-anti-join-07"},{"topic":"left-anti-join","difficulty":"Hard","title":"Find employees who have never managed anyone (never appear as ManagerID)","prompt":"Find employees who have never managed anyone (never appear as ManagerID).","tables":["Employees"],"solutionSql":"SELECT e.EmployeeID, e.FirstName, e.LastName, e.Department\nFROM Employees e\nLEFT JOIN Employees sub ON e.EmployeeID = sub.ManagerID\nWHERE sub.ManagerID IS NULL","starterSql":"","id":"left-anti-join-08"},{"topic":"left-anti-join","difficulty":"Hard","title":"Find customers who ordered in 2025 (current) but have NO orders in archive","prompt":"Find customers who ordered in 2025 (current) but have NO orders in archive.","tables":["Customers","OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT c.CustomerID, c.FirstName, c.LastName\nFROM Customers c\nINNER JOIN Orders o       ON c.CustomerID = o.CustomerID\nLEFT  JOIN OrdersArchive oa ON c.CustomerID = oa.CustomerID\nWHERE oa.CustomerID IS NULL","starterSql":"","id":"left-anti-join-09"},{"topic":"left-anti-join","difficulty":"Hard","title":"Find products that have been sold to USA customers but never to Germany customers","prompt":"Find products that have been sold to USA customers but never to Germany customers.","tables":["Customers","Products","Orders"],"solutionSql":"SELECT DISTINCT p.ProductID, p.Product\nFROM Products p\nINNER JOIN Orders o_usa ON p.ProductID = o_usa.ProductID\nINNER JOIN Customers c_usa ON o_usa.CustomerID = c_usa.CustomerID AND c_usa.Country = 'USA'\nLEFT  JOIN (\n    SELECT o.ProductID\n    FROM Orders o\n    INNER JOIN Customers c ON o.CustomerID = c.CustomerID AND c.Country = 'Germany'\n) ger ON p.ProductID = ger.ProductID\nWHERE ger.ProductID IS NULL","starterSql":"","id":"left-anti-join-10"},{"topic":"left-anti-join","difficulty":"Hard","title":"Among orders placed in January 2025, find customers who did NOT place any order in Februar","prompt":"Among orders placed in January 2025, find customers who did NOT place any order in February 2025.","tables":["Customers","Orders"],"solutionSql":"SELECT DISTINCT c.CustomerID, c.FirstName, c.LastName\nFROM Customers c\nINNER JOIN Orders jan ON c.CustomerID = jan.CustomerID\n                      AND jan.OrderDate >= '2025-01-01' AND jan.OrderDate < '2025-02-01'\nLEFT  JOIN Orders feb ON c.CustomerID = feb.CustomerID\n                      AND feb.OrderDate >= '2025-02-01' AND feb.OrderDate < '2025-03-01'\nWHERE feb.OrderID IS NULL","starterSql":"","id":"left-anti-join-11"},{"topic":"right-anti-join","difficulty":"Easy","title":"Find orders that have no matching customer (orphan orders)  RIGHT ANTI","prompt":"Find orders that have no matching customer (orphan orders)  RIGHT ANTI.","tables":["Customers","Orders"],"solutionSql":"SELECT o.OrderID, o.CustomerID, o.Sales\nFROM Customers c\nRIGHT JOIN Orders o ON c.CustomerID = o.CustomerID\nWHERE c.CustomerID IS NULL","starterSql":"","id":"right-anti-join-02"},{"topic":"right-anti-join","difficulty":"Easy","title":"Find products in the Products table that were never ordered (RIGHT ANTI approach)","prompt":"Find products in the Products table that were never ordered (RIGHT ANTI approach).","tables":["Products","Orders"],"solutionSql":"SELECT p.ProductID, p.Product, p.Category\nFROM Orders o\nRIGHT JOIN Products p ON o.ProductID = p.ProductID\nWHERE o.OrderID IS NULL","starterSql":"","id":"right-anti-join-03"},{"topic":"right-anti-join","difficulty":"Medium","title":"Find employees who never appeared as salesperson in any order (RIGHT ANTI)","prompt":"Find employees who never appeared as salesperson in any order (RIGHT ANTI).","tables":["Employees","Orders"],"solutionSql":"SELECT e.EmployeeID, e.FirstName, e.LastName, e.Salary\nFROM Orders o\nRIGHT JOIN Employees e ON o.SalesPersonID = e.EmployeeID\nWHERE o.SalesPersonID IS NULL","starterSql":"","id":"right-anti-join-04"},{"topic":"right-anti-join","difficulty":"Medium","title":"Find products that exist in the Products table but have no current orders using RIGHT ANTI","prompt":"Find products that exist in the Products table but have no current orders using RIGHT ANTI JOIN.","tables":["Products","Orders"],"solutionSql":"SELECT p.ProductID, p.Product, p.Price,\n       p.Category\nFROM Orders o\nRIGHT JOIN Products p ON o.ProductID = p.ProductID\nWHERE o.ProductID IS NULL","starterSql":"","id":"right-anti-join-05"},{"topic":"right-anti-join","difficulty":"Medium","title":"Find archive orders that are NOT present in current Orders (RIGHT ANTI JOIN)","prompt":"Find archive orders that are NOT present in current Orders (RIGHT ANTI JOIN).","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT oa.OrderID, oa.ProductID, oa.CustomerID, oa.OrderDate, oa.Sales\nFROM Orders o\nRIGHT JOIN OrdersArchive oa ON o.OrderID = oa.OrderID\n                            AND o.ProductID = oa.ProductID\nWHERE o.OrderID IS NULL","starterSql":"","id":"right-anti-join-06"},{"topic":"right-anti-join","difficulty":"Medium","title":"Among customers in USA, find those who have no 'Delivered' orders (RIGHT ANTI)","prompt":"Among customers in USA, find those who have no 'Delivered' orders (RIGHT ANTI).","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, c.LastName, c.Country\nFROM (SELECT DISTINCT CustomerID FROM Orders WHERE OrderStatus = 'Delivered') d\nRIGHT JOIN Customers c ON d.CustomerID = c.CustomerID\nWHERE d.CustomerID IS NULL AND c.Country = 'USA'","starterSql":"","id":"right-anti-join-07"},{"topic":"right-anti-join","difficulty":"Hard","title":"Find all OrderIDs in OrdersArchive that never appear in current Orders","prompt":"Find all OrderIDs in OrdersArchive that never appear in current Orders.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT oa.OrderID\nFROM Orders o\nRIGHT JOIN OrdersArchive oa ON o.OrderID = oa.OrderID\nWHERE o.OrderID IS NULL","starterSql":"","id":"right-anti-join-08"},{"topic":"right-anti-join","difficulty":"Hard","title":"Find customers who are in the archive orders but have no record in current Orders","prompt":"Find customers who are in the archive orders but have no record in current Orders.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT oa.CustomerID\nFROM Orders o\nRIGHT JOIN OrdersArchive oa ON oa.CustomerID = o.CustomerID\nWHERE o.CustomerID IS NULL","starterSql":"","id":"right-anti-join-09"},{"topic":"right-anti-join","difficulty":"Hard","title":"Using RIGHT ANTI JOIN, identify Sales employees who have no high-value orders (Sales > 50)","prompt":"Using RIGHT ANTI JOIN, identify Sales employees who have no high-value orders (Sales > 50).","tables":["Employees","Orders"],"solutionSql":"SELECT e.EmployeeID, e.FirstName, e.LastName, e.Department\nFROM (\n    SELECT DISTINCT SalesPersonID \n    FROM Orders \n    WHERE Sales > 50\n) high_orders\nRIGHT JOIN Employees e ON high_orders.SalesPersonID = e.EmployeeID\nWHERE high_orders.SalesPersonID IS NULL","starterSql":"","id":"right-anti-join-10"},{"topic":"right-anti-join","difficulty":"Hard","title":"Find customers who placed orders in OrdersArchive (2024) but have NO orders in 2025 (curre","prompt":"Find customers who placed orders in OrdersArchive (2024) but have NO orders in 2025 (current Orders).","tables":["Customers","OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT c.CustomerID, c.FirstName, c.LastName\nFROM Orders curr\nRIGHT JOIN (\n    SELECT DISTINCT CustomerID \n    FROM OrdersArchive\n) arch ON curr.CustomerID = arch.CustomerID\nJOIN Customers c ON arch.CustomerID = c.CustomerID\nWHERE curr.CustomerID IS NULL","starterSql":"","id":"right-anti-join-11"},{"topic":"full-anti-join","difficulty":"Easy","title":"Find customers with no orders AND orders with no matching customer","prompt":"Find customers with no orders AND orders with no matching customer.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, o.OrderID, o.Sales,\n       CASE WHEN c.CustomerID IS NULL THEN 'Orphan Order'\n            WHEN o.OrderID    IS NULL THEN 'Customer No Order'\n       END AS Flag\nFROM Customers c\nFULL JOIN Orders o ON c.CustomerID = o.CustomerID\nWHERE c.CustomerID IS NULL OR o.OrderID IS NULL","starterSql":"","id":"full-anti-join-02"},{"topic":"full-anti-join","difficulty":"Easy","title":"Find products with no orders AND orders with no matching product (Full Anti Join)","prompt":"Find products with no orders AND orders with no matching product (Full Anti Join).","tables":["Products","Orders"],"solutionSql":"SELECT p.ProductID, p.Product, o.OrderID,\n       CASE WHEN p.ProductID IS NULL THEN 'Orphan Order'\n            WHEN o.OrderID   IS NULL THEN 'Unsold Product'\n       END AS Flag\nFROM Products p\nFULL JOIN Orders o ON p.ProductID = o.ProductID\nWHERE p.ProductID IS NULL OR o.OrderID IS NULL","starterSql":"","id":"full-anti-join-03"},{"topic":"full-anti-join","difficulty":"Medium","title":"Full Anti Join between current Orders and OrdersArchive: show orders existing in one table","prompt":"Full Anti Join between current Orders and OrdersArchive: show orders existing in one table but not the other (by OrderID+ProductID).","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT COALESCE(o.OrderID, oa.OrderID) AS OrderID,\n       COALESCE(o.ProductID, oa.ProductID) AS ProductID,\n       CASE WHEN o.OrderID IS NULL  THEN 'Only in Archive'\n            WHEN oa.OrderID IS NULL THEN 'Only in Current'\n       END AS Source\nFROM Orders o\nFULL JOIN OrdersArchive oa ON o.OrderID = oa.OrderID AND o.ProductID = oa.ProductID\nWHERE o.OrderID IS NULL OR oa.OrderID IS NULL","starterSql":"","id":"full-anti-join-04"},{"topic":"full-anti-join","difficulty":"Medium","title":"Full Anti Join between Employees and Customers to find people who appear in only one table","prompt":"Full Anti Join between Employees and Customers to find people who appear in only one table (matched by name).","tables":["Customers","Employees"],"solutionSql":"SELECT COALESCE(e.FirstName, c.FirstName) AS FirstName,\n       COALESCE(e.LastName, c.LastName)   AS LastName,\n       e.EmployeeID, c.CustomerID,\n       CASE WHEN e.EmployeeID IS NULL THEN 'Customer Only'\n            WHEN c.CustomerID IS NULL THEN 'Employee Only'\n       END AS WhichTable\nFROM Employees e\nFULL JOIN Customers c ON e.FirstName = c.FirstName AND e.LastName = c.LastName\nWHERE e.EmployeeID IS NULL OR c.CustomerID IS NULL","starterSql":"","id":"full-anti-join-05"},{"topic":"full-anti-join","difficulty":"Medium","title":"Using Full Anti Join, identify all mismatches between Orders and Products","prompt":"Using Full Anti Join, identify all mismatches between Orders and Products.","tables":["Products","Orders"],"solutionSql":"SELECT o.OrderID, o.ProductID AS OrderProductID,\n       p.ProductID AS CatalogProductID, p.Product\nFROM Orders o\nFULL JOIN Products p ON o.ProductID = p.ProductID\nWHERE o.OrderID IS NULL OR p.ProductID IS NULL","starterSql":"","id":"full-anti-join-06"},{"topic":"full-anti-join","difficulty":"Medium","title":"Full Anti Join: find SalesPersonIDs that don't match any employee, and employees who never","prompt":"Full Anti Join: find SalesPersonIDs that don't match any employee, and employees who never sold.","tables":["Employees","Orders"],"solutionSql":"SELECT COALESCE(CAST(o.SalesPersonID AS TEXT), CAST(e.EmployeeID AS TEXT)) AS ID,\n       CASE WHEN e.EmployeeID IS NULL THEN 'SalesPersonID not in Employees'\n            WHEN o.SalesPersonID IS NULL THEN 'Employee never sold'\n       END AS Issue\nFROM (SELECT DISTINCT SalesPersonID FROM Orders) o\nFULL JOIN Employees e ON o.SalesPersonID = e.EmployeeID\nWHERE o.SalesPersonID IS NULL OR e.EmployeeID IS NULL","starterSql":"","id":"full-anti-join-07"},{"topic":"full-anti-join","difficulty":"Hard","title":"Full Anti Join across 3 tables: find customers not in Orders, products not in Orders, comb","prompt":"Full Anti Join across 3 tables: find customers not in Orders, products not in Orders, combined into a single result set.","tables":["Customers","Products","Orders"],"solutionSql":"SELECT 'Customer' AS EntityType, CAST(c.CustomerID AS TEXT) AS EntityID, \n       c.FirstName || ' ' || COALESCE(c.LastName, '') AS EntityName\nFROM Customers c\nLEFT JOIN Orders o ON c.CustomerID = o.CustomerID\nWHERE o.OrderID IS NULL\nUNION ALL\nSELECT 'Product' AS EntityType, CAST(p.ProductID AS TEXT) AS EntityID,\n       p.Product AS EntityName\nFROM Products p\nLEFT JOIN Orders o ON p.ProductID = o.ProductID\nWHERE o.OrderID IS NULL","starterSql":"","id":"full-anti-join-08"},{"topic":"full-anti-join","difficulty":"Hard","title":"Perform Full Anti Join between Orders and OrdersArchive based on CustomerID + ProductID, a","prompt":"Perform Full Anti Join between Orders and OrdersArchive based on CustomerID + ProductID, and show the first/last order date for unmatched records.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT 'Current Only' AS Source, o.CustomerID, o.ProductID,\n       MIN(o.OrderDate) AS FirstOrder, MAX(o.OrderDate) AS LastOrder, SUM(o.Sales) AS TotalSales\nFROM Orders o\nLEFT JOIN OrdersArchive oa ON o.CustomerID = oa.CustomerID AND o.ProductID = oa.ProductID\nWHERE oa.CustomerID IS NULL\nGROUP BY o.CustomerID, o.ProductID\nUNION ALL\nSELECT 'Archive Only' AS Source, oa.CustomerID, oa.ProductID,\n       MIN(oa.OrderDate), MAX(oa.OrderDate), SUM(oa.Sales)\nFROM OrdersArchive oa\nLEFT JOIN Orders o ON oa.CustomerID = o.CustomerID AND oa.ProductID = o.ProductID\nWHERE o.CustomerID IS NULL\nGROUP BY oa.CustomerID, oa.ProductID","starterSql":"","id":"full-anti-join-09"},{"topic":"full-anti-join","difficulty":"Hard","title":"Using Full Anti Join, reconcile which employees are in Orders as salespersons but not in t","prompt":"Using Full Anti Join, reconcile which employees are in Orders as salespersons but not in the Employees table (data integrity check).","tables":["Employees","Orders"],"solutionSql":"SELECT 'In Orders Not Employees' AS Issue, CAST(o.SalesPersonID AS TEXT) AS ID\nFROM (SELECT DISTINCT SalesPersonID FROM Orders) o\nFULL JOIN Employees e ON o.SalesPersonID = e.EmployeeID\nWHERE e.EmployeeID IS NULL\nUNION ALL\nSELECT 'In Employees Not Orders', CAST(e.EmployeeID AS TEXT)\nFROM (SELECT DISTINCT SalesPersonID FROM Orders) o\nFULL JOIN Employees e ON o.SalesPersonID = e.EmployeeID\nWHERE o.SalesPersonID IS NULL","starterSql":"","id":"full-anti-join-10"},{"topic":"full-anti-join","difficulty":"Hard","title":"Full Anti Join: Create a complete mismatch audit report across Customers, Products, Orders","prompt":"Full Anti Join: Create a complete mismatch audit report across Customers, Products, Orders.","tables":["Customers","Employees","Products","Orders"],"solutionSql":"WITH CustomerMismatch AS (\n    SELECT 'Customer without Order' AS Issue, c.CustomerID AS RefID, c.FirstName AS Name\n    FROM Customers c LEFT JOIN Orders o ON c.CustomerID = o.CustomerID WHERE o.OrderID IS NULL\n),\nProductMismatch AS (\n    SELECT 'Product without Order' AS Issue, p.ProductID AS RefID, p.Product AS Name\n    FROM Products p LEFT JOIN Orders o ON p.ProductID = o.ProductID WHERE o.OrderID IS NULL\n),\nEmpMismatch AS (\n    SELECT 'Employee never sold' AS Issue, e.EmployeeID AS RefID, e.FirstName AS Name\n    FROM Employees e LEFT JOIN Orders o ON e.EmployeeID = o.SalesPersonID WHERE o.SalesPersonID IS NULL\n)\nSELECT * FROM CustomerMismatch\nUNION ALL SELECT * FROM ProductMismatch\nUNION ALL SELECT * FROM EmpMismatch\nORDER BY Issue","starterSql":"","id":"full-anti-join-11"},{"topic":"cross-join","difficulty":"Easy","title":"Generate all possible combinations of Customers and Products","prompt":"Generate all possible combinations of Customers and Products.","tables":["Customers","Products"],"solutionSql":"SELECT c.FirstName, c.LastName, p.Product, p.Price\nFROM Customers c\nCROSS JOIN Products p\nORDER BY c.CustomerID, p.ProductID","starterSql":"","id":"cross-join-02"},{"topic":"cross-join","difficulty":"Easy","title":"Generate all possible customer-employee combinations","prompt":"Generate all possible customer-employee combinations.","tables":["Customers","Employees"],"solutionSql":"SELECT c.FirstName AS CustomerName, e.FirstName AS EmployeeName, e.Department\nFROM Customers c\nCROSS JOIN Employees e\nORDER BY c.CustomerID, e.EmployeeID","starterSql":"","id":"cross-join-03"},{"topic":"cross-join","difficulty":"Medium","title":"Using CROSS JOIN, create a pricing matrix showing what each customer would pay for each pr","prompt":"Using CROSS JOIN, create a pricing matrix showing what each customer would pay for each product.","tables":["Customers","Products"],"solutionSql":"SELECT c.CustomerID, c.FirstName || ' ' || COALESCE(c.LastName,'') AS CustomerName,\n       p.ProductID, p.Product, p.Price,\n       p.Price * COALESCE(c.Score/100.0, 1) AS AdjustedPrice\nFROM Customers c\nCROSS JOIN Products p\nORDER BY c.CustomerID, p.ProductID","starterSql":"","id":"cross-join-04"},{"topic":"cross-join","difficulty":"Medium","title":"Using CROSS JOIN, generate all month-product combinations for a reporting template","prompt":"Using CROSS JOIN, generate all month-product combinations for a reporting template.","tables":["Products"],"solutionSql":"SELECT m.MonthName, p.Product, p.Category\nFROM (VALUES ('January'),('February'),('March')) AS m(MonthName)\nCROSS JOIN Products p\nORDER BY m.MonthName, p.ProductID","starterSql":"","id":"cross-join-05"},{"topic":"cross-join","difficulty":"Medium","title":"CROSS JOIN employees with departments to plan assignments","prom
