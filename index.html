pt":"CROSS JOIN employees with departments to plan assignments.","tables":["Employees"],"solutionSql":"SELECT e.FirstName, e.LastName, d.DeptName\nFROM Employees e\nCROSS JOIN (VALUES ('Marketing'),('Sales'),('HR'),('Finance')) AS d(DeptName)\nWHERE d.DeptName != e.Department\nORDER BY e.EmployeeID","starterSql":"","id":"cross-join-06"},{"topic":"cross-join","difficulty":"Medium","title":"Use CROSS JOIN to create a full test matrix of OrderStatus and Country","prompt":"Use CROSS JOIN to create a full test matrix of OrderStatus and Country.","tables":["Customers"],"solutionSql":"SELECT c.Country, s.Status\nFROM (SELECT DISTINCT Country FROM Customers) c\nCROSS JOIN (VALUES ('Delivered'),('Shipped'),('Cancelled'),('Pending')) AS s(Status)\nORDER BY c.Country, s.Status","starterSql":"","id":"cross-join-07"},{"topic":"cross-join","difficulty":"Hard","title":"Use CROSS JOIN with actual orders to find which customer-product pairs have NOT been order","prompt":"Use CROSS JOIN with actual orders to find which customer-product pairs have NOT been ordered (by comparing cross join to existing orders).","tables":["Customers","Products","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, p.ProductID, p.Product\nFROM Customers c\nCROSS JOIN Products p\nWHERE NOT EXISTS (\n    SELECT 1 FROM Orders o \n    WHERE o.CustomerID = c.CustomerID AND o.ProductID = p.ProductID\n)\nORDER BY c.CustomerID, p.ProductID","starterSql":"","id":"cross-join-08"},{"topic":"cross-join","difficulty":"Hard","title":"Using CROSS JOIN, simulate a salary budget table for all employees in all departments","prompt":"Using CROSS JOIN, simulate a salary budget table for all employees in all departments.","tables":["Employees"],"solutionSql":"SELECT e.FirstName, e.LastName, e.Salary AS CurrentSalary,\n       d.DeptName AS TargetDepartment,\n       CASE d.DeptName\n           WHEN 'Marketing' THEN e.Salary * 1.05\n           WHEN 'Sales'     THEN e.Salary * 1.10\n           WHEN 'HR'        THEN e.Salary * 0.95\n           WHEN 'Finance'   THEN e.Salary * 1.08\n       END AS ProjectedSalary\nFROM Employees e\nCROSS JOIN (VALUES ('Marketing'),('Sales'),('HR'),('Finance')) AS d(DeptName)\nORDER BY e.EmployeeID, d.DeptName","starterSql":"","id":"cross-join-09"},{"topic":"cross-join","difficulty":"Hard","title":"CROSS JOIN with aggregation: for each customer-product pair, calculate whether they have o","prompt":"CROSS JOIN with aggregation: for each customer-product pair, calculate whether they have ordered that product and how much they spent.","tables":["Customers","Products","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName, p.ProductID, p.Product,\n       COALESCE(SUM(o.Sales), 0)     AS TotalSpent,\n       COALESCE(COUNT(o.OrderID), 0) AS TimesPurchased\nFROM Customers c\nCROSS JOIN Products p\nLEFT JOIN Orders o ON o.CustomerID = c.CustomerID AND o.ProductID = p.ProductID\nGROUP BY c.CustomerID, c.FirstName, p.ProductID, p.Product\nORDER BY c.CustomerID, p.ProductID","starterSql":"","id":"cross-join-10"},{"topic":"cross-join","difficulty":"Hard","title":"Use CROSS JOIN to create a performance comparison matrix: each employee's sales vs. every ","prompt":"Use CROSS JOIN to create a performance comparison matrix: each employee's sales vs. every other employee's sales.","tables":["Employees","Orders"],"solutionSql":"SELECT e1.FirstName || ' ' || COALESCE(e1.LastName,'') AS Employee1,\n       e2.FirstName || ' ' || COALESCE(e2.LastName,'') AS Employee2,\n       COALESCE(s1.TotalSales, 0) AS Employee1Sales,\n       COALESCE(s2.TotalSales, 0) AS Employee2Sales,\n       COALESCE(s1.TotalSales,0) - COALESCE(s2.TotalSales,0) AS Difference\nFROM Employees e1\nCROSS JOIN Employees e2\nLEFT JOIN (SELECT SalesPersonID, SUM(Sales) AS TotalSales FROM Orders GROUP BY SalesPersonID) s1\n    ON e1.EmployeeID = s1.SalesPersonID\nLEFT JOIN (SELECT SalesPersonID, SUM(Sales) AS TotalSales FROM Orders GROUP BY SalesPersonID) s2\n    ON e2.EmployeeID = s2.SalesPersonID\nWHERE e1.EmployeeID <> e2.EmployeeID\nORDER BY e1.EmployeeID, e2.EmployeeID","starterSql":"","id":"cross-join-11"},{"topic":"multiple-tables","difficulty":"Easy","title":"Join Orders, Customers, and Products to get order details","prompt":"Join Orders, Customers, and Products to get order details.","tables":["Customers","Products","Orders"],"solutionSql":"SELECT o.OrderID, c.FirstName, c.LastName, p.Product, p.Category, o.Quantity, o.Sales\nFROM Orders o\nJOIN Customers c ON o.CustomerID = c.CustomerID\nJOIN Products  p ON o.ProductID  = p.ProductID\nORDER BY o.OrderID","starterSql":"","id":"multiple-tables-02"},{"topic":"multiple-tables","difficulty":"Easy","title":"Join Orders, Customers, and Employees (as SalesPerson)","prompt":"Join Orders, Customers, and Employees (as SalesPerson).","tables":["Customers","Employees","Orders"],"solutionSql":"SELECT o.OrderID, c.FirstName AS Customer,\n       e.FirstName AS SalesPerson, e.Department,\n       o.OrderDate, o.Sales\nFROM Orders o\nJOIN Customers c ON o.CustomerID    = c.CustomerID\nJOIN Employees e ON o.SalesPersonID = e.EmployeeID\nORDER BY o.OrderID","starterSql":"","id":"multiple-tables-03"},{"topic":"multiple-tables","difficulty":"Medium","title":"Join 4 tables: Orders, Customers, Products, and Employees","prompt":"Join 4 tables: Orders, Customers, Products, and Employees.","tables":["Customers","Employees","Products","Orders"],"solutionSql":"SELECT o.OrderID,\n       c.FirstName || ' ' || COALESCE(c.LastName,'') AS CustomerName, c.Country,\n       p.Product, p.Category, p.Price,\n       e.FirstName || ' ' || COALESCE(e.LastName,'') AS SalesPersonName,\n       o.Quantity, o.Sales, o.OrderStatus\nFROM Orders o\nJOIN Customers c ON o.CustomerID    = c.CustomerID\nJOIN Products  p ON o.ProductID     = p.ProductID\nJOIN Employees e ON o.SalesPersonID = e.EmployeeID\nORDER BY o.OrderDate","starterSql":"","id":"multiple-tables-04"},{"topic":"multiple-tables","difficulty":"Medium","title":"Join Employees to itself to show employee-manager pairs with their salaries","prompt":"Join Employees to itself to show employee-manager pairs with their salaries.","tables":["Employees"],"solutionSql":"SELECT e.FirstName  AS EmployeeName, e.Salary AS EmpSalary, e.Department,\n       m.FirstName  AS ManagerName,  m.Salary AS MgrSalary\nFROM Employees e\nJOIN Employees m ON e.ManagerID = m.EmployeeID\nORDER BY e.EmployeeID","starterSql":"","id":"multiple-tables-05"},{"topic":"multiple-tables","difficulty":"Medium","title":"Using multiple JOINs, calculate total sales per salesperson per product category","prompt":"Using multiple JOINs, calculate total sales per salesperson per product category.","tables":["Employees","Products","Orders"],"solutionSql":"SELECT e.FirstName || ' ' || COALESCE(e.LastName,'') AS SalesPerson,\n       p.Category,\n       COUNT(o.OrderID) AS Orders,\n       SUM(o.Sales)     AS TotalSales\nFROM Orders o\nJOIN Employees e ON o.SalesPersonID = e.EmployeeID\nJOIN Products  p ON o.ProductID     = p.ProductID\nGROUP BY e.EmployeeID, e.FirstName, e.LastName, p.Category\nORDER BY SalesPerson, p.Category","starterSql":"","id":"multiple-tables-06"},{"topic":"multiple-tables","difficulty":"Medium","title":"Join all 5 tables (including OrdersArchive) to compare current vs historical sales","prompt":"Join all 5 tables (including OrdersArchive) to compare current vs historical sales.","tables":["Customers","Employees","Products","OrdersArchive","Orders"],"solutionSql":"SELECT c.FirstName, c.LastName, c.Country,\n       p.Product, p.Category,\n       o.Sales   AS CurrentSale,\n       oa.Sales  AS ArchiveSale\nFROM Orders o\nJOIN Customers      c  ON o.CustomerID = c.CustomerID\nJOIN Products       p  ON o.ProductID  = p.ProductID\nJOIN OrdersArchive  oa ON oa.CustomerID = o.CustomerID AND oa.ProductID = o.ProductID\nJOIN Employees      e  ON o.SalesPersonID = e.EmployeeID\nORDER BY c.CustomerID, p.ProductID","starterSql":"","id":"multiple-tables-07"},{"topic":"multiple-tables","difficulty":"Hard","title":"Using 4 JOINs, find the top-selling product per country","prompt":"Using 4 JOINs, find the top-selling product per country.","tables":["Customers","Products","Orders"],"solutionSql":"WITH SalesByCountry AS (\n    SELECT c.Country, p.ProductID, p.Product,\n           SUM(o.Sales) AS TotalSales,\n           RANK() OVER (PARTITION BY c.Country ORDER BY SUM(o.Sales) DESC) AS Rnk\n    FROM Orders    o\n    JOIN Customers c ON o.CustomerID = c.CustomerID\n    JOIN Products  p ON o.ProductID  = p.ProductID\n    GROUP BY c.Country, p.ProductID, p.Product\n)\nSELECT Country, Product, TotalSales\nFROM SalesByCountry\nWHERE Rnk = 1","starterSql":"","id":"multiple-tables-08"},{"topic":"multiple-tables","difficulty":"Hard","title":"For each customer, join to find their favorite (most ordered) product","prompt":"For each customer, join to find their favorite (most ordered) product.","tables":["Customers","Products","Orders"],"solutionSql":"WITH CustomerProductSales AS (\n    SELECT o.CustomerID, o.ProductID, p.Product,\n           SUM(o.Sales) AS TotalSpent,\n           RANK() OVER (PARTITION BY o.CustomerID ORDER BY SUM(o.Sales) DESC) AS Rnk\n    FROM Orders o\n    JOIN Products p ON o.ProductID = p.ProductID\n    GROUP BY o.CustomerID, o.ProductID, p.Product\n)\nSELECT c.CustomerID, c.FirstName, c.LastName,\n       cps.Product AS FavoriteProduct, cps.TotalSpent\nFROM Customers c\nJOIN CustomerProductSales cps ON c.CustomerID = cps.CustomerID AND cps.Rnk = 1\nORDER BY c.CustomerID","starterSql":"","id":"multiple-tables-09"},{"topic":"multiple-tables","difficulty":"Hard","title":"Multi-table join with manager hierarchy: for each order, show the salesperson's manager na","prompt":"Multi-table join with manager hierarchy: for each order, show the salesperson's manager name.","tables":["Customers","Employees","Products","Orders"],"solutionSql":"SELECT o.OrderID, o.Sales,\n       c.FirstName  AS Customer,\n       sp.FirstName AS SalesPerson,\n       mgr.FirstName AS Manager\nFROM Orders    o\nJOIN Customers c   ON o.CustomerID    = c.CustomerID\nJOIN Employees sp  ON o.SalesPersonID = sp.EmployeeID\nLEFT JOIN Employees mgr ON sp.ManagerID = mgr.EmployeeID\nJOIN Products  p   ON o.ProductID     = p.ProductID\nORDER BY o.OrderID","starterSql":"","id":"multiple-tables-10"},{"topic":"multiple-tables","difficulty":"Hard","title":"Comprehensive 5-table join: full order report with customer, product, salesperson, manager","prompt":"Comprehensive 5-table join: full order report with customer, product, salesperson, manager, and whether the product was also in archive.","tables":["Customers","Employees","Products","OrdersArchive","Orders"],"solutionSql":"SELECT o.OrderID, o.OrderDate, o.OrderStatus,\n       c.FirstName || ' ' || COALESCE(c.LastName,'') AS Customer, c.Country,\n       p.Product, p.Category, p.Price, o.Quantity,\n       o.Sales,\n       sp.FirstName || ' ' || COALESCE(sp.LastName,'') AS SalesPerson,\n       COALESCE(mgr.FirstName,'No Manager')          AS Manager,\n       CASE WHEN oa.OrderID IS NOT NULL THEN 'Yes' ELSE 'No' END AS InArchive\nFROM Orders o\nJOIN Customers c    ON o.CustomerID    = c.CustomerID\nJOIN Products  p    ON o.ProductID     = p.ProductID\nJOIN Employees sp   ON o.SalesPersonID = sp.EmployeeID\nLEFT JOIN Employees mgr ON sp.ManagerID = mgr.EmployeeID\nLEFT JOIN OrdersArchive oa ON o.OrderID = oa.OrderID AND o.ProductID = oa.ProductID\nORDER BY o.OrderDate, o.OrderID","starterSql":"","id":"multiple-tables-11"},{"topic":"union-topic","difficulty":"Easy","title":"Combine FirstName from Customers and Employees (distinct names only)","prompt":"Combine FirstName from Customers and Employees (distinct names only).","tables":["Customers","Employees"],"solutionSql":"SELECT FirstName FROM Customers\nUNION\nSELECT FirstName FROM Employees\nORDER BY FirstName","starterSql":"","id":"union-topic-02"},{"topic":"union-topic","difficulty":"Easy","title":"Get all unique OrderIDs from both Orders and OrdersArchive","prompt":"Get all unique OrderIDs from both Orders and OrdersArchive.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT OrderID FROM Orders\nUNION\nSELECT OrderID FROM OrdersArchive\nORDER BY OrderID","starterSql":"","id":"union-topic-03"},{"topic":"union-topic","difficulty":"Medium","title":"Combine customer names from both USA and Germany into a unified list","prompt":"Combine customer names from both USA and Germany into a unified list.","tables":["Customers","Employees"],"solutionSql":"SELECT FirstName, LastName, 'Customer' AS Role, Country\nFROM Customers\nUNION\nSELECT FirstName, LastName, 'Employee' AS Role, 'N/A' AS Country\nFROM Employees\nORDER BY Role, FirstName","starterSql":"","id":"union-topic-04"},{"topic":"union-topic","difficulty":"Medium","title":"Get all unique SalesPersonIDs from Orders and OrdersArchive","prompt":"Get all unique SalesPersonIDs from Orders and OrdersArchive.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT SalesPersonID, 'Current' AS Source FROM Orders\nUNION\nSELECT DISTINCT SalesPersonID, 'Archive' AS Source FROM OrdersArchive\nORDER BY SalesPersonID, Source","starterSql":"","id":"union-topic-05"},{"topic":"union-topic","difficulty":"Medium","title":"Create a combined contact list: customers from Germany and employees from Sales dept","prompt":"Create a combined contact list: customers from Germany and employees from Sales dept.","tables":["Customers","Employees"],"solutionSql":"SELECT FirstName, LastName, Country AS Info\nFROM Customers\nWHERE Country = 'Germany'\nUNION\nSELECT FirstName, LastName, Department AS Info\nFROM Employees\nWHERE Department = 'Sales'\nORDER BY LastName","starterSql":"","id":"union-topic-06"},{"topic":"union-topic","difficulty":"Medium","title":"List all distinct order statuses from both Orders and OrdersArchive","prompt":"List all distinct order statuses from both Orders and OrdersArchive.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT OrderStatus FROM Orders\nUNION\nSELECT DISTINCT OrderStatus FROM OrdersArchive\nORDER BY OrderStatus","starterSql":"","id":"union-topic-07"},{"topic":"union-topic","difficulty":"Hard","title":"Using UNION, create a full activity report combining order data from both tables","prompt":"Using UNION, create a full activity report combining order data from both tables.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT 'Current' AS TableSource, OrderID, CustomerID, ProductID, \n       OrderDate, Sales, OrderStatus\nFROM Orders\nUNION\nSELECT 'Archive' AS TableSource, OrderID, CustomerID, ProductID,\n       OrderDate, Sales, OrderStatus\nFROM OrdersArchive\nORDER BY OrderDate, OrderID","starterSql":"","id":"union-topic-08"},{"topic":"union-topic","difficulty":"Hard","title":"Using UNION, find the highest-paid employee and highest-scoring customer","prompt":"Using UNION, find the highest-paid employee and highest-scoring customer.","tables":["Customers","Employees"],"solutionSql":"SELECT 'Top Employee' AS Category, FirstName, LastName, CAST(Salary AS TEXT) AS Value\nFROM Employees\nWHERE Salary = (SELECT MAX(Salary) FROM Employees)\nUNION\nSELECT 'Top Customer', FirstName, LastName, CAST(Score AS TEXT) AS Value\nFROM Customers\nWHERE Score = (SELECT MAX(Score) FROM Customers)\nORDER BY Category","starterSql":"","id":"union-topic-09"},{"topic":"union-topic","difficulty":"Hard","title":"Using UNION with aggregation, report total sales by source (Current vs Archive)","prompt":"Using UNION with aggregation, report total sales by source (Current vs Archive).","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT 'Current Orders' AS Source, COUNT(OrderID) AS TotalOrders,\n       SUM(Sales) AS TotalSales, AVG(CAST(Sales AS DECIMAL(10,2))) AS AvgSales\nFROM Orders\nUNION\nSELECT 'Archive Orders', COUNT(OrderID), SUM(Sales), AVG(CAST(Sales AS DECIMAL(10,2)))\nFROM OrdersArchive","starterSql":"","id":"union-topic-10"},{"topic":"union-topic","difficulty":"Hard","title":"Using UNION, build a leaderboard combining employee sales performance from both current an","prompt":"Using UNION, build a leaderboard combining employee sales performance from both current and archive orders.","tables":["Employees","OrdersArchive","Orders"],"solutionSql":"SELECT e.FirstName, e.LastName, e.Department,\n       SUM(o.Sales) AS TotalSales, 'Current' AS Period\nFROM Orders o\nJOIN Employees e ON o.SalesPersonID = e.EmployeeID\nGROUP BY e.FirstName, e.LastName, e.Department\nUNION\nSELECT e.FirstName, e.LastName, e.Department,\n       SUM(oa.Sales) AS TotalSales, 'Archive' AS Period\nFROM OrdersArchive oa\nJOIN Employees e ON oa.SalesPersonID = e.EmployeeID\nGROUP BY e.FirstName, e.LastName, e.Department\nORDER BY Period, TotalSales DESC","starterSql":"","id":"union-topic-11"},{"topic":"union-all-topic","difficulty":"Easy","title":"Combine all FirstNames from Customers AND Employees including duplicates","prompt":"Combine all FirstNames from Customers AND Employees including duplicates.","tables":["Customers","Employees"],"solutionSql":"SELECT FirstName, 'Customer' AS Source FROM Customers\nUNION ALL\nSELECT FirstName, 'Employee' AS Source FROM Employees\nORDER BY FirstName","starterSql":"","id":"union-all-topic-02"},{"topic":"union-all-topic","difficulty":"Easy","title":"Combine all orders from Orders and OrdersArchive (keep all records)","prompt":"Combine all orders from Orders and OrdersArchive (keep all records).","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT OrderID, CustomerID, ProductID, Sales, OrderDate, 'Current' AS Source\nFROM Orders\nUNION ALL\nSELECT OrderID, CustomerID, ProductID, Sales, OrderDate, 'Archive' AS Source\nFROM OrdersArchive\nORDER BY OrderDate","starterSql":"","id":"union-all-topic-03"},{"topic":"union-all-topic","difficulty":"Medium","title":"Find the total number of orders across both tables using UNION ALL","prompt":"Find the total number of orders across both tables using UNION ALL.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT COUNT(*) AS TotalCombinedOrders\nFROM (\n    SELECT OrderID FROM Orders\n    UNION ALL\n    SELECT OrderID FROM OrdersArchive\n) combined","starterSql":"","id":"union-all-topic-04"},{"topic":"union-all-topic","difficulty":"Medium","title":"Get all sales from current and archive, then sum them by CustomerID","prompt":"Get all sales from current and archive, then sum them by CustomerID.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT CustomerID, SUM(Sales) AS TotalSalesAllTime\nFROM (\n    SELECT CustomerID, Sales FROM Orders\n    UNION ALL\n    SELECT CustomerID, Sales FROM OrdersArchive\n) combined\nGROUP BY CustomerID\nORDER BY TotalSalesAllTime DESC","starterSql":"","id":"union-all-topic-05"},{"topic":"union-all-topic","difficulty":"Medium","title":"List all products sold in current and archive orders using UNION ALL","prompt":"List all products sold in current and archive orders using UNION ALL.","tables":["Products","OrdersArchive","Orders"],"solutionSql":"SELECT o.OrderDate, p.Product, o.Sales, 'Current' AS Source\nFROM Orders o\nJOIN Products p ON o.ProductID = p.ProductID\nUNION ALL\nSELECT oa.OrderDate, p.Product, oa.Sales, 'Archive' AS Source\nFROM OrdersArchive oa\nJOIN Products p ON oa.ProductID = p.ProductID\nORDER BY OrderDate","starterSql":"","id":"union-all-topic-06"},{"topic":"union-all-topic","difficulty":"Medium","title":"Using UNION ALL, count orders per status from both tables combined","prompt":"Using UNION ALL, count orders per status from both tables combined.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT OrderStatus, COUNT(*) AS Count, 'Current' AS Source FROM Orders GROUP BY OrderStatus\nUNION ALL\nSELECT OrderStatus, COUNT(*) AS Count, 'Archive' AS Source FROM OrdersArchive GROUP BY OrderStatus\nORDER BY Source, OrderStatus","starterSql":"","id":"union-all-topic-07"},{"topic":"union-all-topic","difficulty":"Hard","title":"Using UNION ALL, calculate each salesperson's total sales across both periods","prompt":"Using UNION ALL, calculate each salesperson's total sales across both periods.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT SalesPersonID,\n       SUM(Sales)   AS TotalSales,\n       COUNT(*)     AS TotalOrders,\n       MIN(OrderDate) AS FirstOrder,\n       MAX(OrderDate) AS LastOrder\nFROM (\n    SELECT SalesPersonID, Sales, OrderDate FROM Orders\n    UNION ALL\n    SELECT SalesPersonID, Sales, OrderDate FROM OrdersArchive\n) combined\nGROUP BY SalesPersonID\nORDER BY TotalSales DESC","starterSql":"","id":"union-all-topic-08"},{"topic":"union-all-topic","difficulty":"Hard","title":"Detect duplicate OrderIDs across both tables using UNION ALL and GROUP BY","prompt":"Detect duplicate OrderIDs across both tables using UNION ALL and GROUP BY.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT OrderID, ProductID, CustomerID, COUNT(*) AS Occurrences\nFROM (\n    SELECT OrderID, ProductID, CustomerID FROM Orders\n    UNION ALL\n    SELECT OrderID, ProductID, CustomerID FROM OrdersArchive\n) combined\nGROUP BY OrderID, ProductID, CustomerID\nHAVING COUNT(*) > 1\nORDER BY OrderID","starterSql":"","id":"union-all-topic-09"},{"topic":"union-all-topic","difficulty":"Hard","title":"Using UNION ALL, calculate monthly sales totals combining both tables","prompt":"Using UNION ALL, calculate monthly sales totals combining both tables.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT CAST(strftime('%Y', CAST(OrderDate AS DATE)) AS INT) AS Year,\n       CAST(strftime('%m', CAST(OrderDate AS DATE)) AS INT) AS Month,\n       SUM(Sales) AS TotalSales,\n       COUNT(*)   AS OrderCount\nFROM (\n    SELECT OrderDate, Sales FROM Orders\n    UNION ALL\n    SELECT OrderDate, Sales FROM OrdersArchive\n) combined\nGROUP BY CAST(strftime('%Y', CAST(OrderDate AS DATE)) AS INT), CAST(strftime('%m', CAST(OrderDate AS DATE)) AS INT)\nORDER BY Year, Month","starterSql":"","id":"union-all-topic-10"},{"topic":"union-all-topic","difficulty":"Hard","title":"Build a complete customer activity timeline using UNION ALL showing each order event from ","prompt":"Build a complete customer activity timeline using UNION ALL showing each order event from both current and archive.","tables":["Customers","Products","OrdersArchive","Orders"],"solutionSql":"SELECT c.FirstName || ' ' || COALESCE(c.LastName,'') AS CustomerName,\n       combined.OrderDate,\n       combined.OrderStatus,\n       p.Product,\n       combined.Sales,\n       combined.Source\nFROM (\n    SELECT CustomerID, ProductID, OrderDate, OrderStatus, Sales, 'Current' AS Source\n    FROM Orders\n    UNION ALL\n    SELECT CustomerID, ProductID, OrderDate, OrderStatus, Sales, 'Archive' AS Source\n    FROM OrdersArchive\n) combined\nJOIN Customers c ON combined.CustomerID = c.CustomerID\nJOIN Products  p ON combined.ProductID  = p.ProductID\nORDER BY CustomerName, combined.OrderDate","starterSql":"","id":"union-all-topic-11"},{"topic":"except-topic","difficulty":"Easy","title":"Find CustomerIDs that exist in Customers but not in Orders","prompt":"Find CustomerIDs that exist in Customers but not in Orders.","tables":["Customers","Orders"],"solutionSql":"SELECT CustomerID FROM Customers\nEXCEPT\nSELECT CustomerID FROM Orders\nORDER BY CustomerID","starterSql":"","id":"except-topic-02"},{"topic":"except-topic","difficulty":"Easy","title":"Find ProductIDs in Products that were never ordered","prompt":"Find ProductIDs in Products that were never ordered.","tables":["Products","Orders"],"solutionSql":"SELECT ProductID FROM Products\nEXCEPT\nSELECT ProductID FROM Orders\nORDER BY ProductID","starterSql":"","id":"except-topic-03"},{"topic":"except-topic","difficulty":"Medium","title":"Find SalesPersonIDs in Orders that don't match any EmployeeID","prompt":"Find SalesPersonIDs in Orders that don't match any EmployeeID.","tables":["Employees","Orders"],"solutionSql":"SELECT SalesPersonID FROM Orders\nEXCEPT\nSELECT EmployeeID FROM Employees\nORDER BY SalesPersonID","starterSql":"","id":"except-topic-04"},{"topic":"except-topic","difficulty":"Medium","title":"Find OrderIDs in current Orders that do not appear in OrdersArchive","prompt":"Find OrderIDs in current Orders that do not appear in OrdersArchive.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT OrderID FROM Orders\nEXCEPT\nSELECT OrderID FROM OrdersArchive\nORDER BY OrderID","starterSql":"","id":"except-topic-05"},{"topic":"except-topic","difficulty":"Medium","title":"Find CustomerIDs who ordered in current Orders but NOT in OrdersArchive","prompt":"Find CustomerIDs who ordered in current Orders but NOT in OrdersArchive.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT CustomerID FROM Orders\nEXCEPT\nSELECT DISTINCT CustomerID FROM OrdersArchive\nORDER BY CustomerID","starterSql":"","id":"except-topic-06"},{"topic":"except-topic","difficulty":"Medium","title":"Find countries in Customers that are not present in any Employee's department info","prompt":"Find countries in Customers that are not present in any Employee's department info.","tables":["Customers","Employees"],"solutionSql":"SELECT DISTINCT Country FROM Customers\nEXCEPT\nSELECT DISTINCT Department FROM Employees","starterSql":"","id":"except-topic-07"},{"topic":"except-topic","difficulty":"Hard","title":"Find products that were sold in 2025 (current) but NOT sold in 2024 (archive)","prompt":"Find products that were sold in 2025 (current) but NOT sold in 2024 (archive).","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT ProductID FROM Orders\nEXCEPT\nSELECT DISTINCT ProductID FROM OrdersArchive","starterSql":"","id":"except-topic-08"},{"topic":"except-topic","difficulty":"Hard","title":"Find customers who placed orders in Q1 2025 but NOT in any archive period","prompt":"Find customers who placed orders in Q1 2025 but NOT in any archive period.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT CustomerID\nFROM Orders\nWHERE OrderDate >= '2025-01-01' AND OrderDate <= '2025-03-31'\nEXCEPT\nSELECT DISTINCT CustomerID\nFROM OrdersArchive","starterSql":"","id":"except-topic-09"},{"topic":"except-topic","difficulty":"Hard","title":"Using EXCEPT, find employees who are managers but have never personally sold anything","prompt":"Using EXCEPT, find employees who are managers but have never personally sold anything.","tables":["Employees","Orders"],"solutionSql":"SELECT DISTINCT ManagerID AS EmployeeID FROM Employees WHERE ManagerID IS NOT NULL\nEXCEPT\nSELECT DISTINCT SalesPersonID FROM Orders","starterSql":"","id":"except-topic-10"},{"topic":"except-topic","difficulty":"Hard","title":"Find the set of (CustomerID, ProductID) pairs from OrdersArchive that do NOT appear in cur","prompt":"Find the set of (CustomerID, ProductID) pairs from OrdersArchive that do NOT appear in current Orders.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT CustomerID, ProductID FROM OrdersArchive\nEXCEPT\nSELECT DISTINCT CustomerID, ProductID FROM Orders\nORDER BY CustomerID, ProductID","starterSql":"","id":"except-topic-11"},{"topic":"intersect-topic","difficulty":"Easy","title":"Find CustomerIDs that appear in both Customers and Orders","prompt":"Find CustomerIDs that appear in both Customers and Orders.","tables":["Customers","Orders"],"solutionSql":"SELECT CustomerID FROM Customers\nINTERSECT\nSELECT CustomerID FROM Orders\nORDER BY CustomerID","starterSql":"","id":"intersect-topic-02"},{"topic":"intersect-topic","difficulty":"Easy","title":"Find ProductIDs that appear in both Products and Orders","prompt":"Find ProductIDs that appear in both Products and Orders.","tables":["Products","Orders"],"solutionSql":"SELECT ProductID FROM Products\nINTERSECT\nSELECT ProductID FROM Orders\nORDER BY ProductID","starterSql":"","id":"intersect-topic-03"},{"topic":"intersect-topic","difficulty":"Medium","title":"Find OrderIDs that exist in BOTH current Orders and OrdersArchive","prompt":"Find OrderIDs that exist in BOTH current Orders and OrdersArchive.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT OrderID FROM Orders\nINTERSECT\nSELECT OrderID FROM OrdersArchive\nORDER BY OrderID","starterSql":"","id":"intersect-topic-04"},{"topic":"intersect-topic","difficulty":"Medium","title":"Find SalesPersonIDs that appear in both Orders and OrdersArchive","prompt":"Find SalesPersonIDs that appear in both Orders and OrdersArchive.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT SalesPersonID FROM Orders\nINTERSECT\nSELECT DISTINCT SalesPersonID FROM OrdersArchive\nORDER BY SalesPersonID","starterSql":"","id":"intersect-topic-05"},{"topic":"intersect-topic","difficulty":"Medium","title":"Find customers who have ordered in BOTH the current and archive tables","prompt":"Find customers who have ordered in BOTH the current and archive tables.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT CustomerID FROM Orders\nINTERSECT\nSELECT DISTINCT CustomerID FROM OrdersArchive\nORDER BY CustomerID","starterSql":"","id":"intersect-topic-06"},{"topic":"intersect-topic","difficulty":"Medium","title":"Find first names that are common to both Customers and Employees","prompt":"Find first names that are common to both Customers and Employees.","tables":["Customers","Employees"],"solutionSql":"SELECT FirstName FROM Customers\nINTERSECT\nSELECT FirstName FROM Employees\nORDER BY FirstName","starterSql":"","id":"intersect-topic-07"},{"topic":"intersect-topic","difficulty":"Hard","title":"Find (CustomerID, ProductID) pairs that appear in BOTH Orders and OrdersArchive","prompt":"Find (CustomerID, ProductID) pairs that appear in BOTH Orders and OrdersArchive.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT CustomerID, ProductID FROM Orders\nINTERSECT\nSELECT DISTINCT CustomerID, ProductID FROM OrdersArchive\nORDER BY CustomerID, ProductID","starterSql":"","id":"intersect-topic-08"},{"topic":"intersect-topic","difficulty":"Hard","title":"Find employees whose first name matches any customer's first name (using INTERSECT for dat","prompt":"Find employees whose first name matches any customer's first name (using INTERSECT for data matching).","tables":["Customers","Employees"],"solutionSql":"SELECT FirstName, LastName FROM Employees\nINTERSECT\nSELECT FirstName, LastName FROM Customers\nORDER BY FirstName","starterSql":"","id":"intersect-topic-09"},{"topic":"intersect-topic","difficulty":"Hard","title":"Find order statuses that appear in BOTH current Orders and OrdersArchive","prompt":"Find order statuses that appear in BOTH current Orders and OrdersArchive.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT OrderStatus FROM Orders\nINTERSECT\nSELECT DISTINCT OrderStatus FROM OrdersArchive\nORDER BY OrderStatus","starterSql":"","id":"intersect-topic-10"},{"topic":"intersect-topic","difficulty":"Hard","title":"Using INTERSECT, find (SalesPersonID, CustomerID) pairs that appear in both current and ar","prompt":"Using INTERSECT, find (SalesPersonID, CustomerID) pairs that appear in both current and archive orders  identifying repeat relationships.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT DISTINCT SalesPersonID, CustomerID FROM Orders\nINTERSECT\nSELECT DISTINCT SalesPersonID, CustomerID FROM OrdersArchive\nORDER BY SalesPersonID, CustomerID","starterSql":"","id":"intersect-topic-11"},{"topic":"concat","difficulty":"Easy","title":"Concatenate FirstName and LastName for all customers","prompt":"Concatenate FirstName and LastName for all customers.","tables":["Customers"],"solutionSql":"SELECT CustomerID, (COALESCE(FirstName, '') || ' ' || COALESCE(LastName, '')) AS FullName, Country\nFROM Customers","starterSql":"","id":"concat-02"},{"topic":"concat","difficulty":"Easy","title":"Build a greeting message for each employee using CONCAT","prompt":"Build a greeting message for each employee using CONCAT.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, ('Hello, ' || COALESCE(FirstName, '') || ' ' || COALESCE(COALESCE(LastName,''), '') || '!') AS Greeting\nFROM Employees","starterSql":"","id":"concat-03"},{"topic":"concat","difficulty":"Medium","title":"Create a full order description by concatenating multiple columns","prompt":"Create a full order description by concatenating multiple columns.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       ('Order #' || COALESCE(OrderID, '') || ' | Customer: ' || COALESCE(CustomerID, '') || ' | Product: ' || COALESCE(ProductID, '') || ' | Status: ' || COALESCE(OrderStatus, '')) AS OrderDescription\nFROM Orders","starterSql":"","id":"concat-04"},{"topic":"concat","difficulty":"Medium","title":"Generate a product label using CONCAT with category and price","prompt":"Generate a product label using CONCAT with category and price.","tables":["Products"],"solutionSql":"SELECT ProductID, (COALESCE(Product, '') || ' (' || COALESCE(Category, '') || ') - $' || COALESCE(Price, '')) AS ProductLabel\nFROM Products","starterSql":"","id":"concat-05"},{"topic":"concat","difficulty":"Medium","title":"Combine ship and bill address in orders for a delivery label","prompt":"Combine ship and bill address in orders for a delivery label.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       ('Ship To: ' || COALESCE(COALESCE(ShipAddress, 'N/A'), '') || ' | Bill To: ' || COALESCE(COALESCE(BillAddress, 'N/A'), '')) AS AddressLabel\nFROM Orders","starterSql":"","id":"concat-06"},{"topic":"concat","difficulty":"Medium","title":"Create an employee profile string using CONCAT","prompt":"Create an employee profile string using CONCAT.","tables":["Employees"],"solutionSql":"SELECT EmployeeID,\n       (COALESCE(FirstName, '') || ' ' || COALESCE(COALESCE(LastName,''), '') || ' | Dept: ' || COALESCE(Department, '') || ' | Salary: $' || COALESCE(Salary, '') || ' | Gender: ' || COALESCE(Gender, '')) AS EmployeeProfile\nFROM Employees","starterSql":"","id":"concat-07"},{"topic":"concat","difficulty":"Hard","title":"Generate a full customer order summary sentence using CONCAT with JOIN","prompt":"Generate a full customer order summary sentence using CONCAT with JOIN.","tables":["Customers","Products","Orders"],"solutionSql":"SELECT o.OrderID,\n       (COALESCE(c.FirstName, '') || ' ' || COALESCE(COALESCE(c.LastName,''), '') || ' ordered ' || COALESCE(p.Product, '') || ' (' || COALESCE(p.Category, '') || ')' || ' on ' || COALESCE(o.OrderDate, '') || ' for $' || COALESCE(o.Sales, '') || '. Status: ' || COALESCE(o.OrderStatus, '') || '.') AS OrderSummary\nFROM Orders o\nJOIN Customers c ON o.CustomerID = c.CustomerID\nJOIN Products  p ON o.ProductID  = p.ProductID","starterSql":"","id":"concat-08"},{"topic":"concat","difficulty":"Hard","title":"Build a CSV-formatted output of all orders using CONCAT","prompt":"Build a CSV-formatted output of all orders using CONCAT.","tables":["Orders"],"solutionSql":"SELECT ('\"' || COALESCE(CAST(OrderID AS TEXT), '') || '\",\"' || COALESCE(CAST(CustomerID AS TEXT), '') || '\",\"' || COALESCE(CAST(ProductID AS TEXT), '') || '\",\"' || COALESCE(OrderDate, '') || '\",\"' || COALESCE(OrderStatus, '') || '\",\"' || COALESCE(CAST(Sales AS TEXT), '') || '\"') AS CSVRow\nFROM Orders","starterSql":"","id":"concat-09"},{"topic":"concat","difficulty":"Hard","title":"Using CONCAT, generate dynamic SQL-like INSERT statements for all products","prompt":"Using CONCAT, generate dynamic SQL-like INSERT statements for all products.","tables":["Products"],"solutionSql":"SELECT ('INSERT INTO Products VALUES (' || COALESCE(ProductID, '') || ', ''' || COALESCE(Product, '') || ''', ''' || COALESCE(Category, '') || ''', ' || COALESCE(Price, '') || ');') AS InsertStatement\nFROM Products","starterSql":"","id":"concat-10"},{"topic":"concat","difficulty":"Hard","title":"Using CONCAT with aggregation, build a pipe-separated list of products per category","prompt":"Using CONCAT with aggregation, build a pipe-separated list of products per category.","tables":["Products"],"solutionSql":"SELECT Category,\n       GROUP_CONCAT((COALESCE(Product, '') || ' ($' || COALESCE(Price, '') || ')'), ' | ') AS ProductList\nFROM Products\nGROUP BY Category","starterSql":"","id":"concat-11"},{"topic":"lower-upper","difficulty":"Easy","title":"Convert all customer first names to uppercase","prompt":"Convert all customer first names to uppercase.","tables":["Customers"],"solutionSql":"SELECT CustomerID, UPPER(FirstName) AS FirstNameUpper, Country\nFROM Customers","starterSql":"","id":"lower-upper-02"},{"topic":"lower-upper","difficulty":"Easy","title":"Convert all product names to lowercase","prompt":"Convert all product names to lowercase.","tables":["Products"],"solutionSql":"SELECT ProductID, LOWER(Product) AS ProductLower, LOWER(Category) AS CategoryLower, Price\nFROM Products","starterSql":"","id":"lower-upper-03"},{"topic":"lower-upper","difficulty":"Medium","title":"Convert order status to lowercase and filter 'delivered' orders","prompt":"Convert order status to lowercase and filter 'delivered' orders.","tables":["Orders"],"solutionSql":"SELECT OrderID, CustomerID, ProductID, LOWER(OrderStatus) AS StatusLower, Sales\nFROM Orders\nWHERE LOWER(OrderStatus) = 'delivered'","starterSql":"","id":"lower-upper-04"},{"topic":"lower-upper","difficulty":"Medium","title":"Normalize employee names to uppercase last name and title case first name","prompt":"Normalize employee names to uppercase last name and title case first name.","tables":["Employees"],"solutionSql":"SELECT EmployeeID,\n       UPPER(FirstName) AS FirstName,\n       UPPER(COALESCE(LastName,'')) AS LastName,\n       Department\nFROM Employees","starterSql":"","id":"lower-upper-05"},{"topic":"lower-upper","difficulty":"Medium","title":"Use LOWER to perform a case-insensitive search for customers from 'usa'","prompt":"Use LOWER to perform a case-insensitive search for customers from 'usa'.","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName, LastName, Country\nFROM Customers\nWHERE LOWER(Country) = 'usa'","starterSql":"","id":"lower-upper-06"},{"topic":"lower-upper","difficulty":"Medium","title":"Display all employees with department in uppercase and name in lowercase","prompt":"Display all employees with department in uppercase and name in lowercase.","tables":["Employees"],"solutionSql":"SELECT EmployeeID,\n       LOWER(FirstName) AS FirstNameLower,\n       LOWER(COALESCE(LastName,'')) AS LastNameLower,\n       UPPER(Department) AS DeptUpper\nFROM Employees","starterSql":"","id":"lower-upper-07"},{"topic":"lower-upper","difficulty":"Hard","title":"Use UPPER in a JOIN condition to do case-insensitive matching between tables","prompt":"Use UPPER in a JOIN condition to do case-insensitive matching between tables.","tables":["Customers","Employees"],"solutionSql":"SELECT e.EmployeeID, e.FirstName AS EmpName, c.CustomerID, c.FirstName AS CustName\nFROM Employees e\nJOIN Customers c ON UPPER(e.FirstName) = UPPER(c.FirstName)","starterSql":"","id":"lower-upper-08"},{"topic":"lower-upper","difficulty":"Hard","title":"Using LOWER and CONCAT, generate a standardized email address for each employee","prompt":"Using LOWER and CONCAT, generate a standardized email address for each employee.","tables":["Employees"],"solutionSql":"SELECT EmployeeID,\n       (COALESCE(LOWER(FirstName), '') || '.' || COALESCE(LOWER(COALESCE(LastName,'unknown')), '') || '@company.com') AS Email\nFROM Employees","starterSql":"","id":"lower-upper-09"},{"topic":"lower-upper","difficulty":"Hard","title":"Standardize and compare customer names using UPPER to find any matching employees","prompt":"Standardize and compare customer names using UPPER to find any matching employees.","tables":["Customers","Employees"],"solutionSql":"SELECT c.CustomerID, UPPER((COALESCE(c.FirstName, '') || ' ' || COALESCE(COALESCE(c.LastName,''), ''))) AS CustNameUpper,\n       e.EmployeeID, UPPER((COALESCE(e.FirstName, '') || ' ' || COALESCE(COALESCE(e.LastName,''), ''))) AS EmpNameUpper,\n       CASE WHEN UPPER((COALESCE(c.FirstName, '') || ' ' || COALESCE(COALESCE(c.LastName,''), ''))) =\n                 UPPER((COALESCE(e.FirstName, '') || ' ' || COALESCE(COALESCE(e.LastName,''), '')))\n            THEN 'MATCH' ELSE 'NO MATCH' END AS MatchStatus\nFROM Customers c\nCROSS JOIN Employees e\nWHERE UPPER((COALESCE(c.FirstName, '') || ' ' || COALESCE(COALESCE(c.LastName,''), ''))) =\n      UPPER((COALESCE(e.FirstName, '') || ' ' || COALESCE(COALESCE(e.LastName,''), '')))","starterSql":"","id":"lower-upper-10"},{"topic":"lower-upper","difficulty":"Hard","title":"Case-insensitive search for any product in orders where the product name contains 'o' (upp","prompt":"Case-insensitive search for any product in orders where the product name contains 'o' (uppercase-normalized).","tables":["Products","Orders"],"solutionSql":"SELECT o.OrderID, p.Product, p.Category, o.Sales\nFROM Orders o\nJOIN Products p ON o.ProductID = p.ProductID\nWHERE UPPER(p.Product) LIKE '%O%'","starterSql":"","id":"lower-upper-11"},{"topic":"trim","difficulty":"Easy","title":"Remove leading and trailing spaces from customer first names","prompt":"Remove leading and trailing spaces from customer first names.","tables":["Customers"],"solutionSql":"SELECT CustomerID, TRIM(FirstName) AS CleanFirstName, Country\nFROM Customers","starterSql":"","id":"trim-02"},{"topic":"trim","difficulty":"Easy","title":"Trim spaces from the OrderStatus column","prompt":"Trim spaces from the OrderStatus column.","tables":["Orders"],"solutionSql":"SELECT OrderID, TRIM(OrderStatus) AS CleanStatus, Sales\nFROM Orders","starterSql":"","id":"trim-03"},{"topic":"trim","difficulty":"Medium","title":"Find products where the name has extra spaces using TRIM comparison","prompt":"Find products where the name has extra spaces using TRIM comparison.","tables":["Products"],"solutionSql":"SELECT ProductID, Product,\n       CASE WHEN LENGTH(Product) != LENGTH(TRIM(Product)) THEN 'Has Extra Spaces' ELSE 'Clean' END AS SpaceCheck\nFROM Products","starterSql":"","id":"trim-04"},{"topic":"trim","difficulty":"Medium","title":"Trim and standardize country names from Customers","prompt":"Trim and standardize country names from Customers.","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName, TRIM(UPPER(Country)) AS Country_Standardized\nFROM Customers","starterSql":"","id":"trim-05"},{"topic":"trim","difficulty":"Medium","title":"LTRIM (Left Trim) and RTRIM (Right Trim) on department names","prompt":"LTRIM (Left Trim) and RTRIM (Right Trim) on department names.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, \n       LTRIM(Department) AS DeptLTrimmed,\n       RTRIM(Department) AS DeptRTrimmed\nFROM Employees","starterSql":"","id":"trim-06"},{"topic":"trim","difficulty":"Medium","title":"Use TRIM to clean and compare product categories","prompt":"Use TRIM to clean and compare product categories.","tables":["Products"],"solutionSql":"SELECT ProductID, Product, TRIM(Category) AS CleanCategory\nFROM Products\nWHERE TRIM(Category) = 'Clothing'","starterSql":"","id":"trim-07"},{"topic":"trim","difficulty":"Hard","title":"Use TRIM with REPLACE to standardize addresses in Orders","prompt":"Use TRIM with REPLACE to standardize addresses in Orders.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       TRIM(REPLACE(COALESCE(ShipAddress,''), '  ', ' ')) AS CleanShipAddress,\n       TRIM(REPLACE(COALESCE(BillAddress,''), '  ', ' ')) AS CleanBillAddress\nFROM Orders","starterSql":"","id":"trim-08"},{"topic":"trim","difficulty":"Hard","title":"Use TRIM to detect and filter records where OrderStatus has whitespace issues","prompt":"Use TRIM to detect and filter records where OrderStatus has whitespace issues.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderStatus, LENGTH(OrderStatus) AS RawLen,\n       LENGTH(TRIM(OrderStatus)) AS TrimLen,\n       CASE WHEN LENGTH(OrderStatus) != LENGTH(TRIM(OrderStatus))\n            THEN 'Whitespace Issue' ELSE 'OK' END AS QualityFlag\nFROM Orders","starterSql":"","id":"trim-09"},{"topic":"trim","difficulty":"Hard","title":"Using TRIM and CONCAT, create a clean mailing label for each order","prompt":"Using TRIM and CONCAT, create a clean mailing label for each order.","tables":["Customers","Orders"],"solutionSql":"SELECT o.OrderID,\n       (COALESCE(TRIM(c.FirstName), '') || ' ' || COALESCE(TRIM(COALESCE(c.LastName,'')), '') || COALESCE(CHAR(13), '') || COALESCE(TRIM(COALESCE(o.ShipAddress, 'Address Unknown')), '') || COALESCE(CHAR(13), '') || COALESCE(TRIM(c.Country), '')) AS MailingLabel\nFROM Orders o\nJOIN Customers c ON o.CustomerID = c.CustomerID","starterSql":"","id":"trim-10"},{"topic":"trim","difficulty":"Hard","title":"Clean all text columns in Employees and show before/after comparison","prompt":"Clean all text columns in Employees and show before/after comparison.","tables":["Employees"],"solutionSql":"SELECT EmployeeID,\n       FirstName                          AS OrigFirstName,\n       TRIM(FirstName)                    AS CleanFirstName,\n       COALESCE(LastName,'')              AS OrigLastName,\n       TRIM(COALESCE(LastName,''))        AS CleanLastName,\n       Department                         AS OrigDept,\n       TRIM(Department)                   AS CleanDept\nFROM Employees","starterSql":"","id":"trim-11"},{"topic":"replace","difficulty":"Easy","title":"Replace 'USA' with 'United States' in the Customers table","prompt":"Replace 'USA' with 'United States' in the Customers table.","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName, LastName,\n       REPLACE(Country, 'USA', 'United States') AS Country_Full\nFROM Customers","starterSql":"","id":"replace-02"},{"topic":"replace","difficulty":"Easy","title":"Replace 'Delivered' with 'Completed' in order status","prompt":"Replace 'Delivered' with 'Completed' in order status.","tables":["Orders"],"solutionSql":"SELECT OrderID, REPLACE(OrderStatus, 'Delivered', 'Completed') AS UpdatedStatus, Sales\nFROM Orders","starterSql":"","id":"replace-03"},{"topic":"replace","difficulty":"Medium","title":"Replace 'Accessories' with 'Acc.' and 'Clothing' with 'Clth.' in Products","prompt":"Replace 'Accessories' with 'Acc.' and 'Clothing' with 'Clth.' in Products.","tables":["Products"],"solutionSql":"SELECT ProductID, Product,\n       REPLACE(REPLACE(Category, 'Accessories', 'Acc.'), 'Clothing', 'Clth.') AS ShortCategory,\n       Price\nFROM Products","starterSql":"","id":"replace-04"},{"topic":"replace","difficulty":"Medium","title":"Replace dots in ship addresses to clean up abbreviations","prompt":"Replace dots in ship addresses to clean up abbreviations.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       REPLACE(COALESCE(ShipAddress,''), '.', '') AS CleanShipAddress\nFROM Orders","starterSql":"","id":"replace-05"},{"topic":"replace","difficulty":"Medium","title":"Replace 'M' and 'F' gender codes with full text in Employees","prompt":"Replace 'M' and 'F' gender codes with full text in Employees.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, LastName,\n       REPLACE(REPLACE(Gender, 'M', 'Male'), 'F', 'Female') AS GenderFull\nFROM Employees","starterSql":"","id":"replace-06"},{"topic":"replace","difficulty":"Medium","title":"Use REPLACE to mask part of the BillAddress for privacy","prompt":"Use REPLACE to mask part of the BillAddress for privacy.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       REPLACE(COALESCE(BillAddress,'N/A'), \n               SUBSTR(COALESCE(BillAddress,'N/A'), 1, 4), 'XXXX') AS MaskedBillAddress\nFROM Orders","starterSql":"","id":"replace-07"},{"topic":"replace","difficulty":"Hard","title":"Replace multiple words in order addresses using nested REPLACE","prompt":"Replace multiple words in order addresses using nested REPLACE.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       REPLACE(\n           REPLACE(\n               REPLACE(COALESCE(ShipAddress,''), 'Blv.', 'Boulevard'),\n           'Rd.', 'Road'),\n       'St.', 'Street') AS ExpandedAddress\nFROM Orders","starterSql":"","id":"replace-08"},{"topic":"replace","difficulty":"Hard","title":"Replace null last names with 'Unknown' using REPLACE combined with ISNULL","prompt":"Replace null last names with 'Unknown' using REPLACE combined with ISNULL.","tables":["Customers"],"solutionSql":"SELECT CustomerID,\n       FirstName,\n       IFNULL(REPLACE(LastName, LastName, LastName), 'Unknown') AS SafeLastName,\n       Country\nFROM Customers;\n-- Cleaner approach:\nSELECT CustomerID, FirstName, COALESCE(LastName, 'Unknown') AS SafeLastName, Country\nFROM Customers","starterSql":"","id":"replace-09"},{"topic":"replace","difficulty":"Hard","title":"Use REPLACE to standardize phone-like Order IDs into formatted strings","prompt":"Use REPLACE to standardize phone-like Order IDs into formatted strings.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       REPLACE(CAST(CAST(OrderID AS TEXT) || '0000' AS TEXT), '10000', '10-000') AS FormattedID\nFROM Orders;\n-- Practical use: Format OrderID with prefix\nSELECT REPLACE(('ORD-' || COALESCE(CAST(OrderID AS TEXT), '')), 'ORD-', 'ORDER-') AS FormattedOrderID,\n       CustomerID, Sales\nFROM Orders","starterSql":"","id":"replace-10"},{"topic":"replace","difficulty":"Hard","title":"Perform data cleansing by replacing old product category names with new standardized names","prompt":"Perform data cleansing by replacing old product category names with new standardized names using a CASE-like REPLACE chain.","tables":["Products"],"solutionSql":"SELECT ProductID, Product,\n       Category AS OldCategory,\n       CASE\n           WHEN Category = 'Accessories' THEN 'Sports Accessories'\n           WHEN Category = 'Clothing'    THEN 'Sports Clothing'\n           ELSE REPLACE(Category, Category, 'Other')\n       END AS NewCategory,\n       Price\nFROM Products","starterSql":"","id":"replace-11"},{"topic":"len","difficulty":"Easy","title":"Find the length of each customer's first name","prompt":"Find the length of each customer's first name.","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName, LENGTH(FirstName) AS NameLength\nFROM Customers\nORDER BY NameLength DESC","starterSql":"","id":"len-02"},{"topic":"len","difficulty":"Easy","title":"Find the length of each product name","prompt":"Find the length of each product name.","tables":["Products"],"solutionSql":"SELECT ProductID, Product, LENGTH(Product) AS ProductNameLength\nFROM Products\nORDER BY ProductNameLength DESC","starterSql":"","id":"len-03"},{"topic":"len","difficulty":"Medium","title":"Find employees whose last name is longer than 4 characters","prompt":"Find employees whose last name is longer than 4 characters.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, LastName, LENGTH(COALESCE(LastName,'')) AS LastNameLen\nFROM Employees\nWHERE LENGTH(COALESCE(LastName,'')) > 4","starterSql":"","id":"len-04"},{"topic":"len","difficulty":"Medium","title":"Show orders with ship addresses and their character lengths","prompt":"Show orders with ship addresses and their character lengths.","tables":["Orders"],"solutionSql":"SELECT OrderID, ShipAddress, LENGTH(COALESCE(ShipAddress,'')) AS AddressLength\nFROM Orders\nORDER BY AddressLength DESC","starterSql":"","id":"len-05"},{"topic":"len","difficulty":"Medium","title":"Filter products where the category name has exactly 8 characters","prompt":"Filter products where the category name has exactly 8 characters.","tables":["Products"],"solutionSql":"SELECT ProductID, Product, Category, LENGTH(Category) AS CategoryLen\nFROM Products\nWHERE LENGTH(Category) = 8","starterSql":"","id":"len-06"},{"topic":"len","difficulty":"Medium","title":"Calculate average length of customer last names (excluding NULLs)","prompt":"Calculate average length of customer last names (excluding NULLs).","tables":["Customers"],"solutionSql":"SELECT AVG(LENGTH(LastName)) AS AvgLastNameLength,\n       MAX(LENGTH(LastName)) AS MaxLastNameLength,\n       MIN(LENGTH(LastName)) AS MinLastNameLength\nFROM Customers\nWHERE LastName IS NOT NULL","starterSql":"","id":"len-07"},{"topic":"len","difficulty":"Hard","title":"Find customers whose full name (FirstName + LastName) exceeds 12 characters","prompt":"Find customers whose full name (FirstName + LastName) exceeds 12 characters.","tables":["Customers"],"solutionSql":"SELECT CustomerID,\n       (COALESCE(FirstName, '') || ' ' || COALESCE(COALESCE(LastName,''), '')) AS FullName,\n       LENGTH((COALESCE(FirstName, '') || ' ' || COALESCE(COALESCE(LastName,''), ''))) AS FullNameLength\nFROM Customers\nWHERE LENGTH((COALESCE(FirstName, '') || ' ' || COALESCE(COALESCE(LastName,''), ''))) > 12","starterSql":"","id":"len-08"},{"topic":"len","difficulty":"Hard","title":"Show the longest and shortest first names from both Customers and Employees combined","prompt":"Show the longest and shortest first names from both Customers and Employees combined.","tables":["Customers","Employees"],"solutionSql":"SELECT 'Longest' AS Type, Name, NameLen\nFROM (\n    SELECT (COALESCE(FirstName, '') || ' (Customer)') AS Name, LENGTH(FirstName) AS NameLen\n    FROM Customers\n    UNION ALL\n    SELECT (COALESCE(FirstName, '') || ' (Employee)') AS Name, LENGTH(FirstName) AS NameLen\n    FROM Employees\n) combined\nWHERE NameLen = (SELECT MAX(LENGTH(FirstName)) FROM (SELECT FirstName FROM Customers UNION ALL SELECT FirstName FROM Employees) all_names)\nUNION ALL\nSELECT 'Shortest', Name, NameLen\nFROM (\n    SELECT (COALESCE(FirstName, '') || ' (Customer)') AS Name, LENGTH(FirstName) AS NameLen\n    FROM Customers\n    UNION ALL\n    SELECT (COALESCE(FirstName, '') || ' (Employee)') AS Name, LENGTH(FirstName) AS NameLen\n    FROM Employees\n) combined\nWHERE NameLen = (SELECT MIN(LENGTH(FirstName)) FROM (SELECT FirstName FROM Customers UNION ALL SELECT FirstName FROM Employees) all_names)","starterSql":"","id":"len-09"},{"topic":"len","difficulty":"Hard","title":"Identify orders where the ShipAddress and BillAddress differ in length significantly (>5 c","prompt":"Identify orders where the ShipAddress and BillAddress differ in length significantly (>5 chars).","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       ShipAddress, LENGTH(COALESCE(ShipAddress,'')) AS ShipLen,\n       BillAddress, LENGTH(COALESCE(BillAddress,'')) AS BillLen,\n       ABS(LENGTH(COALESCE(ShipAddress,'')) - LENGTH(COALESCE(BillAddress,''))) AS LenDiff\nFROM Orders\nWHERE ABS(LENGTH(COALESCE(ShipAddress,'')) - LENGTH(COALESCE(BillAddress,''))) > 5\nORDER BY LenDiff DESC","starterSql":"","id":"len-10"},{"topic":"len","difficulty":"Hard","title":"Rank products by the length of their name and show cumulative character count using window","prompt":"Rank products by the length of their name and show cumulative character count using window functions.","tables":["Products"],"solutionSql":"SELECT ProductID, Product, Category,\n       LENGTH(Product) AS NameLen,\n       SUM(LENGTH(Product)) OVER (ORDER BY LENGTH(Product), ProductID) AS CumulativeLen,\n       RANK() OVER (ORDER BY LENGTH(Product) DESC) AS LenRank\nFROM Products","starterSql":"","id":"len-11"},{"topic":"left-fn","difficulty":"Easy","title":"Get the first 3 characters of each customer's first name","prompt":"Get the first 3 characters of each customer's first name.","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName, SUBSTR(FirstName, 1, 3) AS FirstThreeChars\nFROM Customers","starterSql":"","id":"left-fn-02"},{"topic":"left-fn","difficulty":"Easy","title":"Extract the first 4 characters of product names","prompt":"Extract the first 4 characters of product names.","tables":["Products"],"solutionSql":"SELECT ProductID, Product, SUBSTR(Product, 1, 4) AS ShortName\nFROM Products","starterSql":"","id":"left-fn-03"},{"topic":"left-fn","difficulty":"Medium","title":"Extract the year from the OrderDate using LEFT","prompt":"Extract the year from the OrderDate using LEFT.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderDate, SUBSTR(OrderDate, 1, 4) AS OrderYear\nFROM Orders","starterSql":"","id":"left-fn-04"},{"topic":"left-fn","difficulty":"Medium","title":"Create a short product code using LEFT of category + product","prompt":"Create a short product code using LEFT of category + product.","tables":["Products"],"solutionSql":"SELECT ProductID,\n       (COALESCE(SUBSTR(Category, 1, 3), '') || '-' || COALESCE(SUBSTR(Product, 1, 3), '')) AS ProductCode\nFROM Products","starterSql":"","id":"left-fn-05"},{"topic":"left-fn","difficulty":"Medium","title":"Extract the first word from ship addresses in Orders using LEFT and CHARINDEX","prompt":"Extract the first word from ship addresses in Orders using LEFT and CHARINDEX.","tables":["Orders"],"solutionSql":"SELECT OrderID, ShipAddress,\n       CASE WHEN INSTR(COALESCE(ShipAddress,''), ' ') = 0 THEN ShipAddress ELSE SUBSTR(ShipAddress, 1, INSTR(ShipAddress, ' ') - 1) END AS FirstWord\nFROM Orders","starterSql":"","id":"left-fn-06"},{"topic":"left-fn","difficulty":"Medium","title":"Get the first 2 characters of gender and department for a short employee code","prompt":"Get the first 2 characters of gender and department for a short employee code.","tables":["Employees"],"solutionSql":"SELECT EmployeeID,\n       (COALESCE(SUBSTR(Gender, 1, 1), '') || '-' || COALESCE(SUBSTR(Department, 1, 3), '')) AS EmpCode,\n       FirstName\nFROM Employees","starterSql":"","id":"left-fn-07"},{"topic":"left-fn","difficulty":"Hard","title":"Using LEFT, generate initials for customers (first letter of each name)","prompt":"Using LEFT, generate initials for customers (first letter of each name).","tables":["Customers"],"solutionSql":"SELECT CustomerID,\n       (COALESCE(SUBSTR(FirstName, 1, 1), '') || '.' || COALESCE(SUBSTR(COALESCE(LastName,'x'), 1, 1), '') || '.') AS Initials\nFROM Customers","starterSql":"","id":"left-fn-08"},{"topic":"left-fn","difficulty":"Hard","title":"Use LEFT to extract and group orders by month prefix (YYYY-MM)","prompt":"Use LEFT to extract and group orders by month prefix (YYYY-MM).","tables":["Orders"],"solutionSql":"SELECT SUBSTR(OrderDate, 1, 7) AS YearMonth,\n       COUNT(*) AS OrderCount,\n       SUM(Sales) AS TotalSales\nFROM Orders\nGROUP BY SUBSTR(OrderDate, 1, 7)\nORDER BY YearMonth","starterSql":"","id":"left-fn-09"},{"topic":"left-fn","difficulty":"Hard","title":"Use LEFT to create a product lookup key and validate it against a reference","prompt":"Use LEFT to create a product lookup key and validate it against a reference.","tables":["Products"],"solutionSql":"SELECT p.ProductID,\n       SUBSTR(p.Category, 1, 3) + CAST(p.ProductID AS TEXT) AS LookupKey,\n       p.Product, p.Price\nFROM Products p\nORDER BY LookupKey","starterSql":"","id":"left-fn-10"},{"topic":"left-fn","difficulty":"Hard","title":"Classify employees by their salary range using LEFT on salary string representation","prompt":"Classify employees by their salary range using LEFT on salary string representation.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, Salary,\n       CASE SUBSTR(CAST(Salary AS TEXT), 1, 1)\n           WHEN '5' THEN 'Entry Level (50K-59K)'\n           WHEN '6' THEN 'Mid Level (60K-69K)'\n           WHEN '7' THEN 'Senior Level (70K-79K)'\n           WHEN '8' THEN 'Expert Level (80K-89K)'\n           WHEN '9' THEN 'Executive (90K+)'\n           ELSE 'Other'\n       END AS SalaryBand\nFROM Employees\nORDER BY Salary","starterSql":"","id":"left-fn-11"},{"topic":"right-fn","difficulty":"Easy","title":"Get the last 3 characters of each product name","prompt":"Get the last 3 characters of each product name.","tables":["Products"],"solutionSql":"SELECT ProductID, Product, SUBSTR(Product, -(3)) AS LastThreeChars\nFROM Products","starterSql":"","id":"right-fn-02"},{"topic":"right-fn","difficulty":"Easy","title":"Extract the last 2 characters (day) from the OrderDate","prompt":"Extract the last 2 characters (day) from the OrderDate.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderDate, SUBSTR(OrderDate, -(2)) AS DayOfMonth\nFROM Orders","starterSql":"","id":"right-fn-03"},{"topic":"right-fn","difficulty":"Medium","title":"Extract the last 4 characters from CustomerID padded values","prompt":"Extract the last 4 characters from CustomerID padded values.","tables":["Customers"],"solutionSql":"SELECT CustomerID, SUBSTR('000' || CAST(CustomerID AS TEXT), -(4)) AS PaddedID, FirstName\nFROM Customers","starterSql":"","id":"right-fn-04"},{"topic":"right-fn","difficulty":"Medium","title":"Get the last 2 characters of BirthDate (day) from Employees","prompt":"Get the last 2 characters of BirthDate (day) from Employees.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, BirthDate, SUBSTR(BirthDate, -(2)) AS BirthDay\nFROM Employees","starterSql":"","id":"right-fn-05"},{"topic":"right-fn","difficulty":"Medium","title":"Extract the last word from ship addresses using RIGHT and CHARINDEX","prompt":"Extract the last word from ship addresses using RIGHT and CHARINDEX.","tables":["Orders"],"solutionSql":"SELECT OrderID, ShipAddress,\n       CASE WHEN ShipAddress IS NULL THEN NULL ELSE SUBSTR(ShipAddress, -4) END AS AddressEnding\nFROM Orders","starterSql":"","id":"right-fn-06"},{"topic":"right-fn","difficulty":"Medium","title":"Create order reference code using RIGHT of OrderDate and OrderID","prompt":"Create order reference code using RIGHT of OrderDate and OrderID.","tables":["Orders"],"solutionSql":"SELECT OrderID,\n       ('REF-' || COALESCE(SUBSTR(OrderDate, -(5)), '') || '-' || COALESCE(SUBSTR('00'+CAST(OrderID AS TEXT), -(3)), '')) AS RefCode\nFROM Orders","starterSql":"","id":"right-fn-07"},{"topic":"right-fn","difficulty":"Hard","title":"Using RIGHT, mask all but the last 3 digits of product price","prompt":"Using RIGHT, mask all but the last 3 digits of product price.","tables":["Products"],"solutionSql":"SELECT ProductID, Product,\n       REPLICATE('*', LENGTH(CAST(Price AS TEXT)) - 1) || SUBSTR(CAST(Price AS TEXT), -(1)) AS MaskedPrice\nFROM Products","starterSql":"","id":"right-fn-08"},{"topic":"right-fn","difficulty":"Hard","title":"Use RIGHT to extract the file extension from CreationTime string (last 7 chars)","prompt":"Use RIGHT to extract the file extension from CreationTime string (last 7 chars).","tables":["Orders"],"solutionSql":"SELECT OrderID, CreationTime, SUBSTR(CreationTime, -(7)) AS TimeSuffix\nFROM Orders","starterSql":"","id":"right-fn-09"},{"topic":"right-fn","difficulty":"Hard","title":"Use RIGHT to extract and compare the year from both Orders and OrdersArchive","prompt":"Use RIGHT to extract and compare the year from both Orders and OrdersArchive.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT 'Current'  AS Source, SUBSTR(SUBSTR(OrderDate, 1, 4), -(4)) AS OrderYear, COUNT(*) AS Count\nFROM Orders\nGROUP BY SUBSTR(OrderDate, 1, 4)\nUNION ALL\nSELECT 'Archive', SUBSTR(SUBSTR(OrderDate, 1, 4), -(4)), COUNT(*)\nFROM OrdersArchive\nGROUP BY SUBSTR(OrderDate, 1, 4)\nORDER BY Source, OrderYear","starterSql":"","id":"right-fn-10"},{"topic":"right-fn","difficulty":"Hard","title":"Create a formatted employee badge using RIGHT for ID padding and CONCAT","prompt":"Create a formatted employee badge using RIGHT for ID padding and CONCAT.","tables":["Employees"],"solutionSql":"SELECT ('BADGE: ' || COALESCE(UPPER(SUBSTR(FirstName, 1, 1)), '') || COALESCE(UPPER(SUBSTR(COALESCE(LastName,'X'), 1, 1)), '') || '-' || COALESCE(SUBSTR('0000' || CAST(EmployeeID AS TEXT), -(4)), '') || ' | ' || COALESCE(Department, '')) AS EmployeeBadge\nFROM Employees","starterSql":"","id":"right-fn-11"},{"topic":"substring","difficulty":"Easy","title":"Extract the month portion from the OrderDate string","prompt":"Extract the month portion from the OrderDate string.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderDate, SUBSTR(OrderDate, 6, 2) AS OrderMonth\nFROM Orders","starterSql":"","id":"substring-02"},{"topic":"substring","difficulty":"Easy","title":"Extract the first 3 characters of the department name","prompt":"Extract the first 3 characters of the department name.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, Department, SUBSTR(Department, 1, 3) AS DeptCode\nFROM Employees","starterSql":"","id":"substring-03"},{"topic":"substring","difficulty":"Medium","title":"Extract year, month, and day separately from OrderDate using SUBSTRING","prompt":"Extract year, month, and day separately from OrderDate using SUBSTRING.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderDate,\n       SUBSTR(OrderDate, 1, 4) AS Year,\n       SUBSTR(OrderDate, 6, 2) AS Month,\n       SUBSTR(OrderDate, 9, 2) AS Day\nFROM Orders","starterSql":"","id":"substring-04"},{"topic":"substring","difficulty":"Medium","title":"Extract middle characters of product names (characters 2 to 4)","prompt":"Extract middle characters of product names (characters 2 to 4).","tables":["Products"],"solutionSql":"SELECT ProductID, Product, SUBSTR(Product, 2, 3) AS MiddleChars\nFROM Products","starterSql":"","id":"substring-05"},{"topic":"substring","difficulty":"Medium","title":"Extract the birth year and birth month from BirthDate in Employees","prompt":"Extract the birth year and birth month from BirthDate in Employees.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, BirthDate,\n       SUBSTR(BirthDate, 1, 4) AS BirthYear,\n       SUBSTR(BirthDate, 6, 2) AS BirthMonth\nFROM Employees","starterSql":"","id":"substring-06"},{"topic":"substring","difficulty":"Medium","title":"Extract the time portion from CreationTime in Orders","prompt":"Extract the time portion from CreationTime in Orders.","tables":["Orders"],"solutionSql":"SELECT OrderID, CreationTime,\n       SUBSTR(CreationTime, 12, 8) AS TimeOnly\nFROM Orders","starterSql":"","id":"substring-07"},{"topic":"substring","difficulty":"Hard","title":"Use SUBSTRING to parse and reconstruct dates in DD/MM/YYYY format","prompt":"Use SUBSTRING to parse and reconstruct dates in DD/MM/YYYY format.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderDate,\n       (COALESCE(SUBSTR(OrderDate, 9, 2), '') || '/' || COALESCE(SUBSTR(OrderDate, 6, 2), '') || '/' || COALESCE(SUBSTR(OrderDate, 1, 4), '')) AS FormattedDate\nFROM Orders","starterSql":"","id":"substring-08"},{"topic":"substring","difficulty":"Hard","title":"Extract area code and street number from ship addresses using SUBSTRING + CHARINDEX","prompt":"Extract area code and street number from ship addresses using SUBSTRING + CHARINDEX.","tables":["Orders"],"solutionSql":"SELECT OrderID, ShipAddress,\n       CASE WHEN INSTR(COALESCE(ShipAddress,''), ' ') = 0 THEN ShipAddress ELSE SUBSTR(ShipAddress, 1, INSTR(ShipAddress, ' ') - 1) END AS StreetNumber\nFROM Orders\nWHERE ShipAddress IS NOT NULL","starterSql":"","id":"substring-09"},{"topic":"substring","difficulty":"Hard","title":"Use SUBSTRING to extract and compare order quarter from both tables","prompt":"Use SUBSTRING to extract and compare order quarter from both tables.","tables":["OrdersArchive","Orders"],"solutionSql":"SELECT 'Current' AS Source, OrderID,\n       'Q' || CAST(CEILING(CAST(SUBSTR(OrderDate,6,2) AS INT) / 3.0) AS TEXT) AS Quarter,\n       Sales\nFROM Orders\nUNION ALL\nSELECT 'Archive', OrderID,\n       'Q' || CAST(CEILING(CAST(SUBSTR(OrderDate,6,2) AS INT) / 3.0) AS TEXT),\n       Sales\nFROM OrdersArchive\nORDER BY Source, Quarter","starterSql":"","id":"substring-10"},{"topic":"substring","difficulty":"Hard","title":"Build a standardized employee ID from SUBSTRING of BirthDate and name","prompt":"Build a standardized employee ID from SUBSTRING of BirthDate and name.","tables":["Employees"],"solutionSql":"SELECT EmployeeID,\n       (COALESCE(UPPER(SUBSTR(FirstName, 1, 2)), '') || COALESCE(UPPER(SUBSTR(COALESCE(LastName,'XX'), 1, 2)), '') || COALESCE(SUBSTR(BirthDate, 3, 2), '') || COALESCE(SUBSTR(BirthDate, 6, 2), '')) AS StdEmployeeCode\nFROM Employees","starterSql":"","id":"substring-11"},{"topic":"round","difficulty":"Easy","title":"Round the average sales of all orders to 2 decimal places","prompt":"Round the average sales of all orders to 2 decimal places.","tables":["Orders"],"solutionSql":"SELECT ROUND(AVG(CAST(Sales AS DECIMAL(10,2))), 2) AS AvgSalesRounded\nFROM Orders","starterSql":"","id":"round-02"},{"topic":"round","difficulty":"Easy","title":"Round each product's price to the nearest 10","prompt":"Round each product's price to the nearest 10.","tables":["Products"],"solutionSql":"SELECT ProductID, Product, Price, ROUND(Price, -1) AS PriceRoundedTo10\nFROM Products","starterSql":"","id":"round-03"},{"topic":"round","difficulty":"Medium","title":"Calculate and round the average order quantity to 1 decimal place","prompt":"Calculate and round the average order quantity to 1 decimal place.","tables":["Orders"],"solutionSql":"SELECT ROUND(AVG(CAST(Quantity AS DECIMAL(10,1))), 1) AS AvgQuantityRounded\nFROM Orders","starterSql":"","id":"round-04"},{"topic":"round","difficulty":"Medium","title":"Round the price per unit (Sales/Quantity) to 2 decimals for each order","prompt":"Round the price per unit (Sales/Quantity) to 2 decimals for each order.","tables":["Orders"],"solutionSql":"SELECT OrderID, Sales, Quantity,\n       ROUND(CAST(Sales AS DECIMAL(10,2)) / NULLIF(Quantity, 0), 2) AS PricePerUnit\nFROM Orders","starterSql":"","id":"round-05"},{"topic":"round","difficulty":"Medium","title":"Calculate each customer's share of total sales (%) rounded to 1 decimal","prompt":"Calculate each customer's share of total sales (%) rounded to 1 decimal.","tables":["Customers","Orders"],"solutionSql":"SELECT c.CustomerID, c.FirstName,\n       SUM(o.Sales) AS CustomerSales,\n       ROUND(SUM(o.Sales) * 100.0 / (SELECT SUM(Sales) FROM Orders), 1) AS SalesSharePct\nFROM Customers c\nJOIN Orders o ON c.CustomerID = o.CustomerID\nGROUP BY c.CustomerID, c.FirstName\nORDER BY SalesSharePct DESC","starterSql":"","id":"round-06"},{"topic":"round","difficulty":"Medium","title":"Apply a 10% discount to each product price and round to nearest cent","prompt":"Apply a 10% discount to each product price and round to nearest cent.","tables":["Products"],"solutionSql":"SELECT ProductID, Product, Price,\n       ROUND(Price * 0.90, 2) AS DiscountedPrice\nFROM Products","starterSql":"","id":"round-07"},{"topic":"round","difficulty":"Hard","title":"Calculate and round the variance of salaries in each department","prompt":"Calculate and round the variance of salaries in each department.","tables":["Employees"],"solutionSql":"SELECT Department,\n       ROUND(AVG(CAST(Salary AS DECIMAL(10,2))), 2)  AS AvgSalary,\n       ROUND(MAX(Salary) - MIN(Salary), 2)            AS SalaryRange,\n       COUNT(*) AS EmployeeCount\nFROM Employees\nGROUP BY Department","starterSql":"","id":"round-08"},{"topic":"round","difficulty":"Hard","title":"Round the cumulative sales to the nearest 50 for reporting purposes","prompt":"Round the cumulative sales to the nearest 50 for reporting purposes.","tables":["Orders"],"solutionSql":"SELECT OrderID, OrderDate, Sales,\n       SUM(Sales) OVER (ORDER BY OrderDate, OrderID) AS CumulativeSales,\n       ROUND(SUM(Sales) OVER (ORDER BY OrderDate, OrderID) / 50.0, 0) * 50 AS RoundedCumulative\nFROM Orders","starterSql":"","id":"round-09"},{"topic":"round","difficulty":"Hard","title":"Calculate salesperson bonus (5% of their total sales) and round to 2 decimal places","prompt":"Calculate salesperson bonus (5% of their total sales) and round to 2 decimal places.","tables":["Employees","Orders"],"solutionSql":"SELECT e.EmployeeID, e.FirstName, e.LastName,\n       SUM(o.Sales)                                    AS TotalSales,\n       ROUND(SUM(o.Sales) * 0.05, 2)                  AS Bonus,\n       ROUND(e.Salary + SUM(o.Sales) * 0.05, 2)       AS TotalComp\nFROM Employees e\nJOIN Orders o ON e.EmployeeID = o.SalesPersonID\nGROUP BY e.EmployeeID, e.FirstName, e.LastName, e.Salary\nORDER BY TotalSales DESC","starterSql":"","id":"round-10"},{"topic":"round","difficulty":"Hard","title":"Show product price after applying tiered rounding: Accessories rounded to nearest 5, Cloth","prompt":"Show product price after applying tiered rounding: Accessories rounded to nearest 5, Clothing rounded to nearest 10.","tables":["Products"],"solutionSql":"SELECT ProductID, Product, Category, Price,\n       CASE\n           WHEN Category = 'Accessories' THEN ROUND(Price / 5.0, 0) * 5\n           WHEN Category = 'Clothing'    THEN ROUND(Price / 10.0, 0) * 10\n       END AS TieredRoundedPrice\nFROM Products","starterSql":"","id":"round-11"},{"topic":"abs","difficulty":"Easy","title":"Find the absolute difference between each product's price and 20","prompt":"Find the absolute difference between each product's price and 20.","tables":["Products"],"solutionSql":"SELECT ProductID, Product, Price,\n       ABS(Price - 20) AS PriceDiffFrom20\nFROM Products","starterSql":"","id":"abs-02"},{"topic":"abs","difficulty":"Easy","title":"Calculate the absolute difference between Sales and Quantity*10 for each order","prompt":"Calculate the absolute difference between Sales and Quantity*10 for each order.","tables":["Orders"],"solutionSql":"SELECT OrderID, Sales, Quantity,\n       ABS(Sales - Quantity * 10) AS SalesDiff\nFROM Orders","starterSql":"","id":"abs-03"},{"topic":"abs","difficulty":"Medium","title":"Find the absolute salary difference between each employee and the average salary","prompt":"Find the absolute salary difference between each employee and the average salary.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, Salary,\n       ROUND(AVG(CAST(Salary AS DECIMAL(10,2))) OVER (), 2) AS AvgSalary,\n       ABS(Salary - AVG(CAST(Salary AS DECIMAL(10,2))) OVER ()) AS AbsDiffFromAvg\nFROM Employees\nORDER BY AbsDiffFromAvg DESC","starterSql":"","id":"abs-04"},{"topic":"abs","difficulty":"Medium","title":"Calculate the absolute difference between each order's sales and the product's price","prompt":"Calculate the absolute difference between each order's sales and the product's price.","tables":["Products","Orders"],"solutionSql":"SELECT o.OrderID, p.Product, p.Price, o.Quantity, o.Sales,\n       ABS(o.Sales - p.Price * o.Quantity) AS DiscountOrSurcharge\nFROM Orders o\nJOIN Products p ON o.ProductID = p.ProductID","starterSql":"","id":"abs-05"},{"topic":"abs","difficulty":"Medium","title":"Show products with price deviation from the average price using ABS","prompt":"Show products with price deviation from the average price using ABS.","tables":["Products"],"solutionSql":"SELECT ProductID, Product, Price,\n       ROUND(AVG(CAST(Price AS DECIMAL)) OVER (), 2) AS AvgPrice,\n       ABS(Price - AVG(CAST(Price AS DECIMAL)) OVER ()) AS DeviationFromAvg\nFROM Products","starterSql":"","id":"abs-06"},{"topic":"abs","difficulty":"Medium","title":"Find orders where ABS difference between Sales and average Sales is > 20","prompt":"Find orders where ABS difference between Sales and average Sales is > 20.","tables":["Orders"],"solutionSql":"SELECT OrderID, Sales,\n       ROUND(AVG(CAST(Sales AS DECIMAL)) OVER (), 2) AS AvgSales,\n       ABS(Sales - AVG(CAST(Sales AS DECIMAL)) OVER ()) AS Deviation\nFROM Orders\nWHERE ABS(Sales - (SELECT AVG(CAST(Sales AS DECIMAL)) FROM Orders)) > 20\nORDER BY Deviation DESC","starterSql":"","id":"abs-07"},{"topic":"abs","difficulty":"Hard","title":"Compute absolute sales difference between each order and the previous order per customer","prompt":"Compute absolute sales difference between each order and the previous order per customer.","tables":["Orders"],"solutionSql":"SELECT o.CustomerID, o.OrderID, o.Sales,\n       LAG(o.Sales) OVER (PARTITION BY o.CustomerID ORDER BY o.OrderDate, o.OrderID) AS PrevSales,\n       ABS(o.Sales - COALESCE(LAG(o.Sales) OVER (PARTITION BY o.CustomerID ORDER BY o.OrderDate, o.OrderID), 0)) AS AbsDiff\nFROM Orders o\nORDER BY o.CustomerID, o.OrderDate","starterSql":"","id":"abs-08"},{"topic":"abs","difficulty":"Hard","title":"Calculate ABS difference between current Orders and archive Orders sales by product","prompt":"Calculate ABS difference between current Orders and archive Orders sales by product.","tables":["Products","OrdersArchive","Orders"],"solutionSql":"SELECT p.Product,\n       COALESCE(curr.TotalSales, 0) AS CurrentSales,\n       COALESCE(arch.TotalSales, 0) AS ArchiveSales,\n       ABS(COALESCE(curr.TotalSales,0) - COALESCE(arch.TotalSales,0)) AS AbsDifference\nFROM Products p\nLEFT JOIN (SELECT ProductID, SUM(Sales) AS TotalSales FROM Orders        GROUP BY ProductID) curr ON p.ProductID = curr.ProductID\nLEFT JOIN (SELECT ProductID, SUM(Sales) AS TotalSales FROM OrdersArchive GROUP BY ProductID) arch ON p.ProductID = arch.ProductID\nORDER BY AbsDifference DESC","starterSql":"","id":"abs-09"},{"topic":"abs","difficulty":"Hard","title":"Using ABS, find the employee whose salary is closest to the department average","prompt":"Using ABS, find the employee whose salary is closest to the department average.","tables":["Employees"],"solutionSql":"WITH DeptAvg AS (\n    SELECT Department, AVG(CAST(Salary AS DECIMAL)) AS AvgSalary\n    FROM Employees\n    GROUP BY Department\n)\nSELECT e.EmployeeID, e.FirstName, e.Department, e.Salary, \n       ROUND(da.AvgSalary, 2) AS DeptAvgSalary,\n       ABS(e.Salary - da.AvgSalary) AS AbsDiff\nFROM Employees e\nJOIN DeptAvg da ON e.Department = da.Department\nORDER BY e.Department, AbsDiff","starterSql":"","id":"abs-10"},{"topic":"abs","difficulty":"Hard","title":"Create a price variance report showing ABS deviation of each product from both category av","prompt":"Create a price variance report showing ABS deviation of each product from both category average and overall average.","tables":["Products"],"solutionSql":"SELECT p.ProductID, p.Product, p.Category, p.Price,\n       ROUND(AVG(p2.Price), 2) AS CategoryAvg,\n       ROUND(AVG(p3.Price), 2) AS OverallAvg,\n       ABS(p.Price - AVG(p2.Price)) AS DeviationFromCategory,\n       ABS(p.Price - AVG(p3.Price)) AS DeviationFromOverall\nFROM Products p\nJOIN Products p2 ON p.Category = p2.Category\nCROSS JOIN Products p3\nGROUP BY p.ProductID, p.Product, p.Category, p.Price\nORDER BY DeviationFromCategory DESC","starterSql":"","id":"abs-11"},{"topic":"isnull","difficulty":"Easy","title":"Replace NULL LastName with 'Unknown' for all customers","prompt":"Replace NULL LastName with 'Unknown' for all customers.","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName,\n       IFNULL(LastName, 'Unknown') AS LastName,\n       Country\nFROM Customers","starterSql":"","id":"isnull-02"},{"topic":"isnull","difficulty":"Easy","title":"Replace NULL Score with 0 for all customers","prompt":"Replace NULL Score with 0 for all customers.","tables":["Customers"],"solutionSql":"SELECT CustomerID, FirstName, LastName,\n       IFNULL(Score, 0) AS Score\nFROM Customers","starterSql":"","id":"isnull-03"},{"topic":"isnull","difficulty":"Medium","title":"Replace NULL ManagerID with -1 (sentinel for 'Top Manager') in Employees","prompt":"Replace NULL ManagerID with -1 (sentinel for 'Top Manager') in Employees.","tables":["Employees"],"solutionSql":"SELECT EmployeeID, FirstName, LastName,\n       IFNULL(ManagerID, -1) AS ManagerID\nFROM Employees","starterSql":"","id":"isnull-04"},{"topic":"isnull","difficulty":"Medium","title":"Use ISNULL to build a full name, substituting 'N/A' for NULL last names","prompt":"Use ISNULL to build a full name, substituting 'N/A' for NULL last names.","tables":["Customers"],"solutionSql":"SELECT CustomerID,\n       FirstName || ' ' || IFNULL(LastName, 'N/A') AS FullName\nFROM Customers","starterSql":"","id":"isnull-05"},{"topic":"isnull","difficulty":"Medium","title":"Replace NULL BillAddress with ShipAddress using ISNULL in Orders","prompt":"Replace NULL BillAddress with ShipAddress using ISNULL in Orders.","tables":["Orders"],"solutionSql":"SELECT OrderID, ShipAddress,\n       IFNULL(BillAddress, ShipAddress) AS EffectiveBillAddress\nFROM Orders","starterSql":"","id":"isnull-06"},{"topic":"isnull",
